# Config for oapi-codegen. Run via `make generate`.
package: gen
output: internal/gen/gen.go
generate:
  models: true
  client: true
output-options:
  # Keep every schema, including ones no operation references yet. The bundle
  # is still growing; pruning would make regeneration output churn.
  skip-prune: true
  # Go-specific mappings live here, not in the producer spec.
  overlay:
    path: openapi/overlay.yaml
  nullable-type: true
  # Name the inline object schemas. Without this, a trigger configuration or a
  # dashboard widget generates as an anonymous struct inside an internal package,
  # which no caller outside it can construct — apiv3 had to restate the literal
  # to build one. Added in oapi-codegen v2.8.0 for exactly this.
  generate-types-for-anonymous-schemas: true
  # apiv3 reads each response itself (typed errors, rate limits, the merged-
  # fault redirect, the body cap), so the typed-response client oapi-codegen
  # also emits, ClientWithResponses and a Parse function per operation, would
  # go unused. `client: true` has no switch for it, so its template is replaced
  # with a single comment, which leaves the plain Client as it was. The body
  # must print something: text/template ignores a redefinition that is only
  # whitespace and {{/* */}} comments.
  user-templates:
    client-with-responses.tmpl: |
      // ClientWithResponses is not generated: apiv3 decodes responses itself.
