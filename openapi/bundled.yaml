      summary: Describe the current credential
      description: |
        Reports what the credential making the request is and what it can reach.
        Requires no scope: a credential must always be able to discover its own limits, or a client holding a narrow token cannot tell a missing scope from a broken endpoint without a second round trip. A credential with no scopes at all still introspects successfully.
        `project_ids` is re-derived from the binding on every request, so a user token narrows the moment its owner loses access to a project rather than at its next rotation.
      tags:
      - Tokens
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - user
                        - account
                        - oauth
                        description: "`user` and `account` are scoped API tokens.
                          `oauth` is an access token issued to an application acting
                          for a user.\n"
                      name:
                        type:
                        - string
                        - 'null'
                        description: 'The token''s name, or for an OAuth grant the
                          name of the application holding it.

                          '
                      scopes:
                        type: array
                        items:
                          type: string
                        description: 'Granular permissions. For an OAuth grant these
                          are its legacy `read`/`write` aliases expanded to the API
                          surface as it stood when the grant was consented to.

                          '
                        example:
                        - faults:read
                        - faults:write
                      account_id:
                        type: string
                        description: public_id of the account the credential is bound
                          to.
                      project_ids:
                        type: array
                        items:
                          type: string
                        description: 'public_ids of the projects the credential can
                          reach. Empty for a credential bound to an account with no
                          visible projects; every project in the account when unrestricted.

                          '
                      expires_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                      last_used_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
        '401':
          "$ref": "#/components/responses/Unauthorized"
