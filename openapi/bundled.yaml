        channel_id:
          type:
          - string
          - 'null'
          title: Channel
          description: The value that service's API uses for it, usually an ID.
          example: 4-90120123456-8
    IntegrationConfigIlert:
      type: object
      title: ilert settings
      additionalProperties: false
      properties:
        url:
