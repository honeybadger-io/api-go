        first:
          type: string
          format: uri
          description: First page
        prev:
          type:
          - string
          - 'null'
          description: Previous page, or null on the first page
        next:
          type:
          - string
          - 'null'
          description: Next page, or null on the last page
        last:
          type: string
          format: uri
          description: Last page
    Outage:
      type: object
