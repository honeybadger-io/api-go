    DashboardChartConfigTable:
      type: object
      description: Raw result rows and columns. No config.
      additionalProperties: false
    DashboardChartConfigBillboard:
      type: object
      description: 'Big-number stat tiles: one tile per result row (or one per result
        field when `groupType` is `fields`).'
      additionalProperties: false
      properties:
        titleField:
          type: string
          description: Alias shown as the tile title
        valueField:
          type: string
          description: Alias shown as the big number; required when `groupType` is
            `events`
        titleURLField:
          type: string
          description: Alias containing a URL; makes the tile title a link
        subtitleField:
          type: string
          description: Alias shown below the value
        statusField:
          type: string
          description: Alias whose value drives the tile's status indicator
        groupType:
          type: string
          enum:
          - fields
          - events
          description: "`events` (default): one tile per result row using `valueField`;
            `fields`: one tile per result field"
      allOf:
      - if:
          properties:
            groupType:
              const: events
          required:
          - groupType
        then:
          required:
          - valueField
    DashboardChartConfigBar:
      type: object
      description: Bar chart of a value per category.
      required:
      - categoryField
      - valueField
      additionalProperties: false
      properties:
        categoryField:
          type: string
          description: Alias for the category axis; one bar per distinct value
        valueField:
          type: string
          description: Alias for bar height
        valueFieldUnit:
          type: string
          description: 'Unit used to format values: `percent`, `microseconds`, or
            `milliseconds`'
        labelField:
          type: string
          description: Alias rendered as a label on each bar
        groupType:
          type: string
          enum:
          - fields
          - events
          description: "`events` (default): series come from `groupField`; `fields`:
            every result field except `categoryField` becomes its own series"
        groupField:
          type: string
          description: Alias whose distinct values split bars into series (with `groupType`
            `events`)
        horizontal:
          type: boolean
          description: Render bars horizontally
        stacked:
          type: boolean
          description: Stack series instead of grouping side by side
        groups:
          type: object
          description: 'Per-series display options keyed by series name, e.g. `{"web":
            {"color": "#4A90D9"}}`. Advanced — usually omit'
          patternProperties:
            "^.*$":
              type: object
              properties:
                color:
                  type: string
    DashboardChartConfigLine:
      type: object
      description: One or more series plotted over an x axis, usually time.
      additionalProperties: false
      properties:
        xField:
          type: string
          description: Alias for the x axis, typically a time bin such as `bin(1h)`
        yField:
          type: string
          description: Alias plotted as the series value; required when `groupType`
            is `events`
        zField:
          type: string
          description: Alias whose distinct values split results into one series each
        colorField:
          type: string
          description: Alias whose values supply explicit series colors
        xFieldUnit:
          type: string
          description: 'Unit used to format x values: `percent`, `microseconds`, or
            `milliseconds`'
        yFieldUnit:
          type: string
          description: 'Unit used to format y values: `percent`, `microseconds`, or
            `milliseconds`'
        groupType:
          type: string
          enum:
          - fields
          - events
          description: "`events` (default): one series from `yField`, split by `zField`
            if set; `fields`: every result field except `xField` becomes its own series"
        yAxisLabel:
          type: string
          description: Left y-axis label (accepted but not currently applied by the
            renderer)
        yAxisMin:
          type: number
          description: Left y-axis minimum (accepted but not currently applied by
            the renderer)
        yAxisMax:
          type: number
          description: Left y-axis maximum (accepted but not currently applied by
            the renderer)
        rightYAxisFormat:
          type: string
          description: Right y-axis format (accepted but not currently applied by
            the renderer)
        rightYAxisLabel:
          type: string
          description: Right y-axis label (accepted but not currently applied by the
            renderer)
        rightYAxisMin:
          type: number
          description: Right y-axis minimum (accepted but not currently applied by
            the renderer)
        rightYAxisMax:
          type: number
          description: Right y-axis maximum (accepted but not currently applied by
            the renderer)
        groups:
          type: object
          description: 'Per-series display options keyed by series name, e.g. `{"web":
            {"color": "#4A90D9"}}`; entries may also set `axis` (`left`|`right`) to
            plot a series on the right y axis. Advanced — usually omit'
          patternProperties:
            "^.*$":
              type: object
              properties:
                color:
                  type: string
                axis:
                  type: string
                  enum:
                  - left
                  - right
      allOf:
      - if:
          properties:
            groupType:
              const: events
          required:
          - groupType
        then:
          required:
          - yField
    DashboardChartConfigArea:
      type: object
      description: Like line, with the area under each series filled; series can be
        stacked.
      additionalProperties: false
      properties:
        xField:
          type: string
          description: Alias for the x axis, typically a time bin such as `bin(1h)`
        yField:
          type: string
          description: Alias plotted as the series value; required when `groupType`
            is `events`
        zField:
          type: string
          description: Alias whose distinct values split results into one series each
        groupType:
          type: string
          enum:
          - fields
          - events
          description: "`events` (default): one series from `yField`, split by `zField`
            if set; `fields`: every result field except `xField` becomes its own series"
        stacked:
          type: boolean
          description: Stack series instead of overlaying them
        groups:
          type: object
          description: 'Per-series display options keyed by series name, e.g. `{"web":
            {"color": "#4A90D9"}}`. Advanced — usually omit'
          patternProperties:
            "^.*$":
              type: object
              properties:
                color:
                  type: string
      allOf:
      - if:
          properties:
            groupType:
              const: events
          required:
          - groupType
        then:
          required:
          - yField
    DashboardChartConfigHistogram:
      type: object
      description: Distribution of values across buckets.
      required:
      - xField
      - yField
      additionalProperties: false
      properties:
        xField:
          type: string
          description: Alias for the x axis
        yField:
          type: string
          description: Alias for the y axis
        zField:
          type: string
          description: Alias whose distinct values split results into one series each
        xFieldUnit:
          type: string
          description: 'Unit used to format x values: `percent`, `microseconds`, or
            `milliseconds`'
        yFieldUnit:
          type: string
          description: 'Unit used to format y values: `percent`, `microseconds`, or
            `milliseconds`'
        groups:
          type: object
          description: 'Per-series display options keyed by series name, e.g. `{"web":
            {"color": "#4A90D9"}}`. Advanced — usually omit'
          patternProperties:
            "^.*$":
              type: object
              properties:
                color:
                  type: string
    DashboardChartConfigScatter:
      type: object
      description: Individual points plotted on two axes.
      required:
      - xField
      - yField
      additionalProperties: false
      properties:
        xField:
          type: string
          description: Alias for the x axis
        yField:
          type: string
          description: Alias for the y axis
        groupField:
          type: string
          description: Alias whose distinct values color the points
        scaleField:
          type: string
          description: Alias that scales point size
        groups:
          type: object
          description: 'Per-series display options keyed by series name, e.g. `{"web":
            {"color": "#4A90D9"}}`. Advanced — usually omit'
          patternProperties:
            "^.*$":
              type: object
              properties:
                color:
                  type: string
    DashboardChartConfigHeatmap:
      type: object
      description: Grid of cells colored by intensity. The query must sort by the
        x and y fields (`| sort x, y`) to render correctly.
      required:
      - xField
      - yField
      - zField
      additionalProperties: false
      properties:
        xField:
          type: string
          description: Alias for the x axis, typically a time bin such as `bin(1h)`
        yField:
          type: string
          description: Alias for the y axis
        zField:
          type: string
          description: Alias for cell value/intensity
        yFieldUnit:
          type: string
          description: 'Unit used to format y values: `percent`, `microseconds`, or
            `milliseconds`'
        steps:
          type: integer
          minimum: 1
          description: Number of color steps (default 5)
        groups:
          type: object
          description: 'Per-series display options keyed by series name, e.g. `{"web":
            {"color": "#4A90D9"}}`. Advanced — usually omit'
          patternProperties:
            "^.*$":
              type: object
              properties:
                color:
                  type: string
    DashboardChartConfigPie:
      type: object
      description: Proportional slices; one slice per result row.
      required:
      - nameField
      - valueField
      additionalProperties: false
      properties:
        nameField:
          type: string
          description: Alias for slice labels
        valueField:
          type: string
          description: Alias for slice sizes
        groups:
          type: object
          description: 'Per-slice display options keyed by slice name, e.g. `{"web":
            {"color": "#4A90D9"}}`. Advanced — usually omit'
          patternProperties:
            "^.*$":
              type: object
              properties:
                color:
                  type: string
    DashboardWidgetConfigInsightsVis:
      additionalProperties: false
      properties:
        streams:
          type: array
          items:
            type: string
            enum:
            - default
            - internal
          description: Streams to query (defaults to ["default"])
        query:
          type: string
          description: BadgerQL query producing the widget's data
        vis:
          type: object
          required:
          - view
          additionalProperties: false
          properties:
            view:
              type: string
              enum:
              - billboard
              - bar
              - line
              - pie
              - area
              - histogram
              - scatter
              - heatmap
              - table
            chart_config:
              type: object
          allOf:
          - if:
              properties:
                view:
                  const: table
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigTable"
          - if:
              properties:
                view:
                  const: billboard
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigBillboard"
          - if:
              properties:
                view:
                  const: bar
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigBar"
          - if:
              properties:
                view:
                  const: line
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigLine"
          - if:
              properties:
                view:
                  const: area
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigArea"
          - if:
              properties:
                view:
                  const: histogram
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigHistogram"
          - if:
              properties:
                view:
                  const: scatter
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigScatter"
          - if:
              properties:
                view:
                  const: heatmap
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigHeatmap"
          - if:
              properties:
                view:
                  const: pie
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigPie"
          description: 'How to render the result: `{view, chart_config}`'
    DashboardWidgetConfigAlarms:
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          description: Max alarms shown
        filter_state:
          type: string
          enum:
          - all
          - triggered
          - ok
          description: Show all alarms or only those in one state
    DashboardWidgetConfigErrors:
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          description: Max errors shown
        query:
          type: string
          description: Error search query string to filter the list
        sort:
          type: string
          enum:
          - last_seen_desc
          - last_seen_asc
          - times_desc
          - times_asc
          description: Sort order
    DashboardWidgetConfigDeployments:
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          description: Max deploys shown
        override_time:
          type: boolean
          description: Use `ts` instead of the dashboard's time range
        ts:
          type: string
          description: Time range used when `override_time` is true
    DashboardWidgetConfigCheckins:
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          description: Max check-ins shown
        sort_order:
          type: string
          enum:
          - state_name
          - name
          - last_reported
          description: Sort by state, name, or last report time
    DashboardWidgetConfigUptime:
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          description: Max uptime monitors shown
    DashboardWidgetInput:
      type: object
      required:
      - type
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - insights_vis
          - alarms
          - deployments
          - checkins
          - uptime
          - errors
        grid:
          type: object
          additionalProperties: false
          properties:
            x:
              type: integer
              minimum: 0
            "y":
              type: integer
              minimum: 0
            w:
              type: integer
              minimum: 1
            h:
              type: integer
              minimum: 1
        presentation:
          type: object
          additionalProperties: false
          properties:
            title:
              type: string
              maxLength: 255
            subtitle:
              type: string
              maxLength: 255
        config:
          type: object
          additionalProperties: true
          description: The widget's settings, as described by DashboardWidgetConfig<Type>
            for its `type`.
      allOf:
      - if:
          properties:
            type:
              const: insights_vis
        then:
          properties:
            config:
              "$ref": "#/components/schemas/DashboardWidgetConfigInsightsVis"
      - if:
          properties:
            type:
              const: alarms
        then:
          properties:
            config:
              "$ref": "#/components/schemas/DashboardWidgetConfigAlarms"
      - if:
          properties:
            type:
              const: errors
        then:
          properties:
            config:
              "$ref": "#/components/schemas/DashboardWidgetConfigErrors"
      - if:
          properties:
            type:
              const: deployments
        then:
          properties:
            config:
              "$ref": "#/components/schemas/DashboardWidgetConfigDeployments"
      - if:
          properties:
            type:
              const: checkins
        then:
          properties:
            config:
              "$ref": "#/components/schemas/DashboardWidgetConfigCheckins"
      - if:
          properties:
            type:
              const: uptime
        then:
          properties:
            config:
              "$ref": "#/components/schemas/DashboardWidgetConfigUptime"
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: Project public ID
      schema:
        type: string
        example: Xk9mZp
    FaultId:
      name: fault_id
      in: path
      required: true
      description: Fault ID
      schema:
        type: string
        example: '12345'
    Unmapped:
      name: unmapped
      in: query
      description: |
        Return the backtrace exactly as the client reported it, instead of the source-mapped one. Frames are source-mapped by default. Where no different mapped trace was stored — no source map was uploaded for the revision, or mapping did not change the frames — both forms are the same.

        Accepts `true`/`false` and the usual spellings (`1`/`0`, `yes`/`no`, `on`/`off`). Any other value is refused with 400 `invalid_parameter` rather than being read as true.
      schema:
        type: boolean
        default: false
    Page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Limit:
      name: limit
      in: query
      description: 'Maximum items to return. A value above the maximum is clamped
        down to it; a value that is not a positive integer is refused with 400 `invalid_parameter`
        rather than being reinterpreted.

        '
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Before:
      name: before
      in: query
      description: Cursor for fetching older items
      schema:
        type: string
    After:
      name: after
      in: query
      description: Cursor for fetching newer items
      schema:
        type: string
    CreatedAfter:
      name: created_after
      in: query
      description: |
        Only return items created after this Unix timestamp. Fractional seconds are significant; take the value from `links.newer` rather than constructing it.

        A value in any other format — including the ISO8601 form this API returns in response bodies — is refused with 400 `invalid_parameter` rather than silently dropped.
      schema:
        type: number
        format: double
        example: 1704067200.123456
    PageCreatedAfter:
      name: created_after
      in: query
      description: |
        With created_before, a window. Alone, pages forward: the items just after it, newest first, with a newer link while more exist. `links.newer` uses it this way. Fractional seconds are significant; take the value from `links.newer` rather than constructing it.

        A value in any other format — including the ISO8601 form this API returns in response bodies — is refused with 400 `invalid_parameter` rather than silently dropped.
      schema:
        type: number
        format: double
        example: 1704067200.123456
    CreatedBefore:
      name: created_before
      in: query
      description: |
        Only return items created before this Unix timestamp. Fractional seconds are significant; take the value from `links.older` rather than constructing it.

        A value in any other format — including the ISO8601 form this API returns in response bodies — is refused with 400 `invalid_parameter` rather than silently dropped.
      schema:
        type: number
        format: double
        example: 1704153600.123456
    OccurrencePeriod:
      name: period
      in: query
      description: |
        Window to report over. Both ends of the window are inclusive, so each period returns one more bucket than its name suggests: `hour` gives 61 one-minute buckets, `day` 25 hourly, `week` 8 daily, `month` 31 daily.

        Defaults to `hour` when omitted, and `meta.period` reports what was used. An unrecognised value is refused with 400 `invalid_parameter` rather than silently reinterpreted.
      schema:
        type: string
        enum:
        - hour
        - day
        - week
        - month
        default: hour
    OccurrenceEnvironment:
      name: environment
      in: query
      description: Only count notices from faults in this environment
      schema:
        type: string
        example: production
    FaultOrder:
      name: order
      in: query
      description: 'How to sort the list. `recent` is by most recent occurrence, `frequent`
        by occurrence count. Omitted means creation order. An unrecognised value is
        refused with 400 `invalid_parameter`.

        '
      schema:
        type: string
        enum:
        - recent
        - frequent
    Sort:
      name: sort
      in: query
      description: 'Direction for `order`. Each ordering has its own default — most
        recent and most frequent descend, creation order ascends. An unrecognised
        value is refused with 400 `invalid_parameter` rather than sorting the other
        way.

        '
      schema:
        type: string
        enum:
        - asc
        - desc
    FaultCreatedAfter:
      name: created_after
      in: query
      description: |
        Only faults first seen after this Unix timestamp. Clamped to the project's creation date.

        A value in any other format — including the ISO8601 form this API returns in response bodies — is refused with 400 `invalid_parameter` rather than silently dropped.
      schema:
        type: number
        format: double
    FaultOccurredAfter:
      name: occurred_after
      in: query
      description: |
        Only faults with an occurrence after this Unix timestamp. Clamped to the project's retention window, so a value beyond it returns what is retained. Occurrence counts in the response are for this window.

        A value in any other format — including the ISO8601 form this API returns in response bodies — is refused with 400 `invalid_parameter` rather than silently dropped.
      schema:
        type: number
        format: double
    FaultOccurredBefore:
      name: occurred_before
      in: query
      description: |
        Only faults with an occurrence before this Unix timestamp. On the occurrence timeline it is the upper bound of the reported window; omitting `occurred_after` reports the hour before it.

        A value in any other format — including the ISO8601 form this API returns in response bodies — is refused with 400 `invalid_parameter` rather than silently dropped, as is an empty value.
      schema:
        type: number
        format: double
    SearchFilter:
      name: q
      in: query
      description: 'Search filter, the same syntax the web UI accepts — `is:resolved`,
        `environment:production`, `class:ArgumentError`. Filters that need the search
        index return nothing when it holds no data for the project.

        '
      schema:
        type: string
  responses:
    MergedFault:
      description: 'This fault was merged into another fault. Location is the same
        resource on the fault it was merged into: `…/faults/<survivor>` for the fault,
        or the same subresource path and query for occurrences, affected users and
        notices. Only reads redirect; writes get a 409 `fault_merged`.

        '
      headers:
        Location:
          required: true
          description: Absolute URL of the same resource on the surviving fault.
          schema:
            type: string
            format: uri
    FaultMergedConflict:
      description: 'This fault was merged into another fault, so the write was not
        applied. It isn''t redirected, because a client that follows redirects would
        repeat the write as a GET, or against a fault the caller never named. `error.details`
        identifies the surviving fault.

        '
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: fault_merged
              message: This fault was merged into fault 12345
              details:
                merged_into: '12345'
                location: https://app.honeybadger.io/v3/projects/Xk9mZp/faults/12345
            meta:
              request_id: abc123
    ServiceUnavailable:
      description: 'A data store this read depends on didn''t answer. Nothing is wrong
        with the request; try again shortly.

        '
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: service_unavailable
              message: Occurrence counts are unavailable. Try again shortly.
            meta:
              request_id: abc123
    AlarmServiceUnavailable:
      description: The alarm service could not be reached or failed to handle the
        request.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: service_unavailable
              message: Alarm service unavailable, please try again later
            meta:
              request_id: abc123
    Unauthorized:
      description: 'Authentication failed: the credential was missing, malformed,
        expired, revoked, or presented in a way v3 does not accept. `error.code` says
        which — see the examples below.

        '
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          examples:
            unauthorized:
              summary: Missing, malformed, expired or revoked credential
              value:
                error:
                  code: unauthorized
                  message: Access denied
                meta:
                  request_id: abc123
            unsupported_auth_scheme:
              summary: Sent as HTTP basic, which v3 does not accept
              description: 'The token as the username with a blank password, which
                is what `curl -u` produces. v2 accepts it; v3 takes Bearer only. Named
                separately from a plain 401 because the credential is usually valid,
                and "Access denied" would send someone hunting a token problem that
                does not exist.

                '
              value:
                error:
                  code: unsupported_auth_scheme
                  message: 'Send the credential as `Authorization: Bearer <token>`;
                    v3 does not accept HTTP basic'
                meta:
                  request_id: abc123
            credential_in_query:
              summary: Sent as the auth_token query parameter
              description: 'Refused even when the credential is valid: a secret in
                a URL leaks through access logs, proxies, Referer headers and anything
                a person copy-pastes.

                '
              value:
                error:
                  code: credential_in_query
                  message: Credentials must be sent in the Authorization header
                meta:
                  request_id: abc123
    Forbidden:
      description: |
        Authenticated, but not allowed to do this. `error.code` says why — see the examples below.
        Note what is NOT here: a binding failure — an account or project the credential does not cover — answers 404 `not_found` instead. A 403 there would confirm the resource exists.
      headers:
        WWW-Authenticate:
          description: 'Present as `Bearer error="insufficient_scope"` when the code
            is `insufficient_scope`. Absent for the other reasons.

            '
          schema:
            type: string
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          examples:
            access_denied:
              summary: The ability refuses this action on this record
              value:
                error:
                  code: access_denied
                  message: Access denied
                meta:
                  request_id: abc123
            insufficient_scope:
              summary: The credential lacks the permission this endpoint requires
              description: "`details.required_scope` names it and `details.token_scopes`
                lists what the credential does hold, so a client can tell the holder
                exactly what to re-grant rather than guessing.\n"
              value:
                error:
                  code: insufficient_scope
                  message: Insufficient scope
                  details:
                    required_scope: faults:write
                    token_scopes:
                    - faults:read
                    - insights:read
                meta:
                  request_id: abc123
            requires_user_token:
              summary: The endpoint records who acted, and an account token has nobody
              description: 'Authoring or editing a comment attributes text to a person.
                An account token may hold `faults:write` legitimately and still have
                nobody to attribute it to, so this is not something a scope can express.

                '
              value:
                error:
                  code: requires_user_token
                  message: This endpoint records the person who acted, so it requires
                    a user credential rather than an account token
                meta:
                  request_id: abc123
            project_restricted:
              summary: A project-restricted credential cannot create a project
              description: 'A project that does not exist yet cannot be inside a fixed
                list. Deliberately 403 rather than 404: the endpoint exists and the
                caller may well hold `projects:create`.

                '
              value:
                error:
                  code: project_restricted
                  message: Project-restricted tokens cannot create projects
                meta:
                  request_id: abc123
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Resource not found
            meta:
              request_id: abc123
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: validation_error
              message: Name can't be blank
              details:
              - field: name
                message: can't be blank
            meta:
              request_id: abc123
    AmbiguousAccount:
      description: 'No path names the account, so the API token has to. This is returned
        when the token covers more than one account and the account a request applies
        to cannot be determined. Use a token bound to a single account.

        '
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: ambiguous_account
              message: This credential covers more than one account, so the account
                a request applies to is ambiguous. Use a token bound to a single account.
            meta:
              request_id: abc123
    FaultBulkRejected:
      description: 'The request was refused and nothing was changed. `error.code`
        and `error.details` say why — see the examples below.

        '
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          examples:
            missing_selection:
              summary: The body named no faults
              description: 'A body naming nothing used to mean every fault in the
                project. Say which faults with fault_ids, narrow them with q or a
                time filter, or ask for all of them with all=true.

                '
              value:
                error:
                  code: validation_error
                  message: Name the faults to change with fault_ids, narrow them with
                    a filter, or pass all=true to change every fault in the project.
                  details:
                  - field: fault_ids
                    message: required unless a filter or all=true is given
                meta:
                  request_id: abc123
            unrecognised_filter:
              summary: q contained a filter that matches nothing
              description: 'An unknown token contributes nothing to the query, so
                the request would have applied to everything the rest of it matched.
                `is:unresolved` is the common mistake — the filter is `-is:resolved`.

                '
              value:
                error:
                  code: validation_error
                  message: 'Unrecognised search filters: is:unresolved. They match
                    nothing, so this would have applied to every fault the rest of
                    the query matched.'
                  details:
                  - field: q
                    message: unrecognised filter is:unresolved
                meta:
                  request_id: abc123
            unknown_fault_ids:
              summary: fault_ids named a fault that isn't in this project
              description: 'Every ID must be a fault in the project. One that isn''t,
                including a fault merged away since it was listed, fails the whole
                request.

                '
              value:
                error:
                  code: validation_error
                  message: 'fault_ids has unknown ids: 99999'
                  details:
                  - field: fault_ids
                    message: 'has unknown ids: 99999'
                meta:
                  request_id: abc123
            ambiguous_account:
              summary: The `me` alias covers more than one account
              value:
                error:
                  code: ambiguous_account
                  message: This credential covers more than one account, so "me" is
                    ambiguous.
                meta:
                  request_id: abc123
    RateLimitExceeded:
      description: 'Rate limit exceeded. The limit is per credential owner per hour:
        a person''s tokens share one budget, and an account token uses the account''s.
        Wait `Retry-After` seconds and retry.

        '
      headers:
        Retry-After:
          description: Seconds until the hourly window resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: rate_limit_exceeded
              message: Rate limit exceeded
            meta:
              request_id: abc123
    ConcurrentCreate:
      description: 'Another project is being created in this account at the same moment
        (`concurrent_request`), or the rate limit is exceeded (`rate_limit_exceeded`).
        Nothing was created. Wait `Retry-After` seconds and retry.

        '
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: concurrent_request
              message: Another project is being created in this account; retry shortly
            meta:
              request_id: abc123
    StreamsProvisioning:
      description: "`stream_ids` was left out (or null) and the project's streams
        are still being set up, which a new project's are for a short time after it's
        created (`streams_provisioning`); or the rate limit is exceeded (`rate_limit_exceeded`).
        Nothing was created. Wait `Retry-After` seconds and retry.\n"
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: streams_provisioning
              message: The project's streams are still being set up; retry shortly
            meta:
              request_id: abc123
    BadRequest:
      description: 'A query parameter was malformed or carried a value outside its
        documented set. `error.details` names the parameter. Returned rather than
        reinterpreting the value, so a caller that guessed wrong is told instead of
        being handed a correct-looking answer to a different question.

        '
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: invalid_parameter
              message: unmapped must be true or false
              details:
              - field: unmapped
                message: must be true or false
            meta:
              request_id: abc123
