      in: path
      required: true
      description: |
        Account public ID, or the literal `me` for the account the API token belongs to. Using `me` means a client never has to call `GET /v3/accounts` before it can address a project.

        `me` resolves only when the token covers exactly one account. A token covering several returns 422 with code `ambiguous_account`; list the accounts and pass a concrete id instead. Response `links` are always returned with the concrete id.
      schema:
        type: string
        example: Ab3kL9
    ProjectId:
      name: project_id
      in: path
      required: true
      description: Project public ID
      schema:
        type: string
        example: Xk9mZp
    FaultId:
      name: fault_id
      in: path
      required: true
      description: Fault public ID
      schema:
        type: string
        example: Nm8pQx
    Page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Limit:
      name: limit
      in: query
      description: Maximum items to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Before:
      name: before
      in: query
      description: Cursor for fetching older items
      schema:
        type: string
    After:
      name: after
      in: query
      description: Cursor for fetching newer items
      schema:
        type: string
    CreatedAfter:
      name: created_after
      in: query
      description: 'Only return items created after this Unix timestamp. Fractional
        seconds are significant; take the value from `links.newer` rather than constructing
        it.

        '
      schema:
        type: number
        format: double
        example: 1704067200.123456
    CreatedBefore:
      name: created_before
      in: query
      description: 'Only return items created before this Unix timestamp. Fractional
        seconds are significant; take the value from `links.older` rather than constructing
        it.

        '
      schema:
        type: number
        format: double
        example: 1704153600.123456
    OccurrencePeriod:
      name: period
      in: query
      description: 'Window to report over. Both ends of the window are inclusive,
        so each period returns one more bucket than its name suggests: `hour` gives
        61 one-minute buckets, `day` 25 hourly, `week` 8 daily, `month` 31 daily.
        Defaults to `hour`; an unrecognised value falls back to `hour` and `meta.period`
        says so.

        '
      schema:
        type: string
        enum:
        - hour
        - day
        - week
        - month
        default: hour
    OccurrenceEnvironment:
      name: environment
      in: query
      description: Only count notices from faults in this environment
      schema:
        type: string
        example: production
    FaultOrder:
      name: order
      in: query
      description: 'How to sort the list. `recent` is by most recent occurrence, `frequent`
        by occurrence count. Defaults to creation order.

        '
      schema:
        type: string
        enum:
        - recent
        - frequent
    FaultCreatedAfter:
      name: created_after
      in: query
      description: 'Only faults first seen after this Unix timestamp. Clamped to the
        project''s creation date.

        '
      schema:
        type: number
        format: double
    FaultOccurredAfter:
      name: occurred_after
      in: query
      description: 'Only faults with an occurrence after this Unix timestamp. Clamped
        to the project''s retention window, so a value beyond it returns what is retained.
        Occurrence counts in the response are for this window.

        '
      schema:
        type: number
        format: double
    FaultOccurredBefore:
      name: occurred_before
      in: query
      description: Only faults with an occurrence before this Unix timestamp
      schema:
        type: number
        format: double
    SearchFilter:
      name: q
      in: query
      description: 'Search filter, the same syntax the web UI accepts — `is:resolved`,
        `environment:production`, `class:ArgumentError`. Filters that need the search
        index return nothing when it holds no data for the project.

        '
      schema:
        type: string
  responses:
    Unauthorized:
      description: 'Authentication failed. OpenAPI allows one response per status
        code, and every operation maps 401 here — so the ways a credential can be
        refused are the examples below rather than separate response components, which
        nothing could reference.

        '
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          examples:
            unauthorized:
              summary: Missing, malformed, expired or revoked credential
              value:
                error:
                  code: unauthorized
                  message: Access denied
                meta:
                  request_id: abc123
            unsupported_auth_scheme:
              summary: Sent as HTTP basic, which v3 does not accept
              description: 'The token as the username with a blank password, which
                is what `curl -u` produces. v2 accepts it; v3 takes Bearer only. Named
                separately from a plain 401 because the credential is usually valid,
                and "Access denied" would send someone hunting a token problem that
                does not exist.

                '
              value:
                error:
                  code: unsupported_auth_scheme
                  message: 'Send the credential as `Authorization: Bearer <token>`;
                    v3 does not accept HTTP basic'
                meta:
                  request_id: abc123
            credential_in_query:
              summary: Sent as the auth_token query parameter
              description: 'Refused even when the credential is valid: a secret in
                a URL leaks through access logs, proxies, Referer headers and anything
                a person copy-pastes.

                '
              value:
                error:
                  code: credential_in_query
                  message: Credentials must be sent in the Authorization header
                meta:
                  request_id: abc123
    Forbidden:
      description: |
        Authenticated, but not allowed. As with 401, OpenAPI allows one response per status code and every operation maps 403 here, so the distinct reasons are the examples below rather than separate components nothing could reference.
        Note what is NOT here: a binding failure — an account or project the credential does not cover — answers 404 `not_found` instead. A 403 there would confirm the resource exists.
      headers:
        WWW-Authenticate:
          description: 'Present as `Bearer error="insufficient_scope"` when the code
            is `insufficient_scope`. Absent for the other reasons.

            '
          schema:
            type: string
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          examples:
            access_denied:
              summary: The ability refuses this action on this record
              value:
                error:
                  code: access_denied
                  message: Access denied
                meta:
                  request_id: abc123
            insufficient_scope:
              summary: The credential lacks the permission this endpoint requires
              description: "`details.required_scope` names it and `details.token_scopes`
                lists what the credential does hold, so a client can tell the holder
                exactly what to re-grant rather than guessing.\n"
              value:
                error:
                  code: insufficient_scope
                  message: Insufficient scope
                  details:
                    required_scope: faults:write
                    token_scopes:
                    - faults:read
                    - insights:read
                meta:
                  request_id: abc123
            requires_user_token:
              summary: The endpoint records who acted, and an account token has nobody
              description: 'Authoring or editing a comment attributes text to a person.
                An account token may hold `faults:write` legitimately and still have
                nobody to attribute it to, so this is not something a scope can express.

                '
              value:
                error:
                  code: requires_user_token
                  message: This endpoint records the person who acted, so it requires
                    a user credential rather than an account token
                meta:
                  request_id: abc123
            project_restricted:
              summary: A project-restricted credential cannot create a project
              description: 'A project that does not exist yet cannot be inside a fixed
                list. Deliberately 403 rather than 404: the endpoint exists and the
                caller may well hold `projects:create`.

                '
              value:
                error:
                  code: project_restricted
                  message: Project-restricted tokens cannot create projects
                meta:
                  request_id: abc123
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Resource not found
            meta:
              request_id: abc123
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: validation_error
              message: Name can't be blank
              details:
              - field: name
                message: can't be blank
            meta:
              request_id: abc123
    AmbiguousAccount:
      description: 'The `me` account alias could not be resolved because the API token
        covers more than one account. List the accounts and pass a concrete id. Only
        returned when `account_id` is the literal `me`.

        '
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: ambiguous_account
              message: This credential covers more than one account, so "me" is ambiguous.
            meta:
              request_id: abc123
    RateLimitExceeded:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: rate_limit_exceeded
              message: Rate limit exceeded
            meta:
              request_id: abc123
