          description: URL of the status page
          example: https://acme.statuspage.honeybadger.io
        created_at:
          type: string
          format: date-time
          description: When the status page was created
        domain_verified_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the custom domain was verified
        sites:
          type: array
          description: Uptime sites displayed on the status page
          items:
            type: object
            properties:
              site_id:
                type: string
                description: Public ID of the site
              display_name:
                type: string
                description: Display name on the status page
              description:
                type: string
                description: Description shown on the status page
              state:
                type: string
                description: Current state of the site
              last_checked_at:
                type: string
                format: date-time
                description: When the site was last checked
        check_ins:
          type: array
          description: Check-ins displayed on the status page
          items:
            type: object
            properties:
              check_in_id:
