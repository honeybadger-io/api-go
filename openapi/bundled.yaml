                    "$ref": "#/components/schemas/ResponseMeta"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
      security:
      - bearer_auth:
        - incidents:write
    delete:
      operationId: deleteIncidentUpdate
      summary: Delete an incident update
      description: Deletes an incident update. An incident must keep at least one
        update, so deleting its only update returns 422.
      tags:
      - Status Pages
      parameters:
      - "$ref": "#/components/parameters/AccountId"
      - name: status_page_id
        in: path
        required: true
        description: Status page public ID
        schema:
          type: string
      - name: incident_id
        in: path
        required: true
        description: Incident public ID
        schema:
          type: string
      - name: update_id
        in: path
        required: true
        description: Update public ID
        schema:
          type: string
      responses:
        '204':
          description: Update deleted
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
      security:
      - bearer_auth:
        - incidents:write
  "/accounts/{account_id}/projects/{project_id}/streams":
    get:
      operationId: listStreams
      summary: List event streams
      description: |
        Returns the project's Insights event streams. A project is provisioned with a `default` stream carrying events your applications send and an `internal` stream carrying events Honeybadger generates about the project — errors, deploys, uptime checks and check-ins.

        Provisioning is asynchronous, so a just-created project may return an empty or partial list for a short time. Retry before concluding that a stream is missing.

        Listing streams is a prerequisite for querying: a query against an unselected stream returns nothing, which is indistinguishable from the events not existing.
      tags:
      - Streams
      parameters:
      - "$ref": "#/components/parameters/AccountId"
      - "$ref": "#/components/parameters/ProjectId"
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/PerPage"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Stream"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
                  links:
                    "$ref": "#/components/schemas/OffsetLinks"
                  meta:
                    type: object
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/AmbiguousAccount"
        '429':
          "$ref": "#/components/responses/RateLimitExceeded"
      security:
      - bearer_auth:
        - insights:read
  "/accounts/{account_id}/projects/{project_id}/insights/queries":
    post:
      operationId: runInsightsQuery
      summary: Run an Insights query
      description: |
        Executes a BadgerQL query against the project's event streams and returns the result. A POST because the query goes in the body, but it only reads — nothing is created.

        Selecting streams is part of the request, not the query: pass `stream_ids`, or omit it to search every stream on the project. An event class that lives on an unselected stream returns no rows, which looks exactly like the events not existing — so list the project's streams first. Unlike v2, an id that does not belong to the project is rejected rather than silently dropped, so a partial result can never be mistaken for a complete one.

        See the BadgerQL reference for the query language.
      tags:
      - Insights
      parameters:
      - "$ref": "#/components/parameters/AccountId"
      - "$ref": "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  description: BadgerQL query
                  example: "@size > 0 | limit 10"
                stream_ids:
                  type: array
                  description: 'Streams to search. Omit it, or pass an empty array,
                    to search every stream on the project. Every id must belong to
                    this project; repeated ids are deduplicated. A value that is not
                    an array of strings is rejected with 422.

                    '
                  items:
                    type: string
                ts:
                  type: string
                  description: Time range for the query
                  example: 1h
                timezone:
                  type: string
                  description: Timezone for time bucketing and display
                  example: UTC
      responses:
        '200':
          description: 'The query result. Its shape is defined by the Insights query
            service rather than by this API, and varies with the query — an aggregation
            returns different fields from an event listing. It is passed through unchanged,
            so this schema deliberately does not pin it.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    description: Query result, as returned by the query service
                    additionalProperties: true
                  meta:
                    type: object
        '422':
          description: 'The query was rejected. For a syntax or semantic error, `error.message`
            is the query service''s own message, since it is more specific than anything
            this API could substitute, and the service may supply additional keys
            alongside it. Also returned when `query` is missing or not a string, when
            `stream_ids` is not an array of strings, or when a stream id does not
            belong to the project.

            '
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Error"
                - type: object
                  properties:
                    error:
                      type: object
                      additionalProperties: true
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimitExceeded"
        '503':
          description: The query service was unreachable or failed. Retry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
      - bearer_auth:
        - insights:read
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: |
        Either credential v3 accepts, as a Bearer token: a scoped API token (prefixed `hbt_` for a personal one, `hba_` for an account one), or an OAuth access token issued to an application acting on a user's behalf.
        Both are authorized the same way. An API token carries granular permissions directly; an OAuth grant carries `read` or `write`, which expand to the permission set covering the API surface as it stood when that grant was consented to — a grant never gains a capability added to the API afterwards.
        Bearer is the only accepted scheme. Unlike v2, v3 refuses HTTP basic (the token as username with a blank password, which is what `curl -u` sends) and refuses a credential in the `auth_token` query parameter.
  schemas:
    Account:
      type: object
      description: A Honeybadger account
      required:
      - id
      - name
      - email
      - active
      properties:
        id:
          type: string
          description: Unique public identifier
          example: Ab3kL9
        name:
          type: string
          description: Account name
          example: Acme Corp
        email:
          type: string
          format: email
          description: Primary account email
          example: billing@acme.com
        active:
          type: boolean
          description: Whether the account is active
        parked:
          type: boolean
          description: Whether the account is parked (temporarily inactive)
        created_at:
          type: string
          format: date-time
          description: When the account was created
    AccountInvitation:
      type: object
      description: An invitation to join an account
      required:
      - id
      - account_id
      - email
      - role
      properties:
        id:
          type: string
          description: Unique public identifier
          example: Ai9nRx
        account_id:
          type: string
          description: Public ID of the account
          example: Ab3kL9
        email:
          type: string
          description: Email address of the invitee
          example: newmember@example.com
        role:
          type: string
          description: Role granted upon acceptance
          example: member
        created_at:
          type: string
          format: date-time
          description: When the invitation was created
        accepted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the invitation was accepted
        created_by:
          type:
          - object
          - 'null'
          description: User who created the invitation
          properties:
            id:
              type: string
              description: Public ID of the user
            name:
              type: string
              description: User name
            email:
              type: string
              description: User email
        accepted_by:
          type:
          - object
          - 'null'
          description: User who accepted the invitation
          properties:
            id:
              type: string
              description: Public ID of the user
            name:
              type: string
              description: User name
            email:
              type: string
              description: User email
    AccountInvitationInput:
      type: object
      description: Writable account-invitation attributes
      required:
      - email
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - Owner
          - Admin
          - Member
        disable_email_notifications:
          type: boolean
          description: Create the member with email notifications off
        team_ids:
          type: array
          description: 'Public IDs of teams to add the invitee to. IDs outside the
            account resolve to nothing rather than attaching another tenant''s team.

            '
          items:
            type: string
    AccountMember:
      type: object
      description: A member of an account
      required:
      - id
      - account_id
      - user_id
      - role
      - email
      - name
      properties:
        id:
          type: string
          description: Unique public identifier
          example: Am4wLq
        account_id:
          type: string
          description: Public ID of the account
          example: Ab3kL9
        user_id:
          type: string
          description: Public ID of the user
          example: Uz4wKm
        role:
          type: string
          description: Member role in the account
          example: admin
        email:
          type: string
          description: Member email address
          example: jane@example.com
        name:
          type: string
          description: Member display name
          example: Jane Smith
        created_at:
          type: string
          format: date-time
          description: When the member was added to the account
    AccountMemberInput:
      type: object
      description: Writable account-member attributes
      required:
      - role
      properties:
        role:
          type: string
          enum:
          - Owner
          - Admin
          - Member
    Alarm:
      type: object
      description: An Insights alarm
      required:
      - id
      - project_id
      - name
      - state
      properties:
        id:
          type: string
          description: Alarm identifier (opticon observer root ID)
          example: obs_abc123
        project_id:
          type: string
          description: Public ID of the project this alarm belongs to
          example: Xk9mZp
        name:
          type: string
          description: Alarm name
          example: High Error Rate
        description:
          type:
          - string
          - 'null'
          description: Alarm description
        state:
          type: string
          description: Current alarm state
        query:
          type: object
          description: Query definition for the alarm
        stream_ids:
          type: array
          items:
            type: string
          description: Associated stream identifiers
        evaluation_period:
          type: integer
          description: Evaluation period in seconds
        lookback_lag:
          type: integer
          description: Lookback lag in seconds
        trigger_config:
          type: object
          description: Trigger configuration for the alarm
        error:
          type:
          - string
          - 'null'
          description: Error message if the alarm is in an error state
        last_checked_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the alarm was last evaluated
        next_check_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the alarm will next be evaluated
        created_at:
          type: string
          format: date-time
          description: When the alarm was created
        updated_at:
          type: string
          format: date-time
          description: When the alarm was last updated
        url:
          type: string
          description: URL to view the alarm in the dashboard
    AlarmCreateInput:
      type: object
      description: An alarm and the observer that evaluates it
      required:
      - name
      - query
      properties:
        name:
          type: string
          example: Error spike
        description:
          type: string
        query:
          type: string
          description: BadgerQL evaluated on each check
          example: filter event_type::str == "notice" | stats count() as count
        stream_ids:
          type: array
          description: 'Streams the query runs against. Defaults to every stream on
            the project. IDs not belonging to the project are dropped.

            '
          items:
            type: string
        evaluation_period:
          type: string
          description: Window each evaluation covers
          example: 10m
        lookback_lag:
          type: string
          description: How far behind now the window ends, allowing for ingestion
            delay
          example: 1m
        trigger_config:
          type: object
          description: What turns the alarm on
          required:
          - type
          properties:
            type:
              type: string
              example: alert_result_count
            config:
              type: object
              properties:
                operator:
                  type: string
                  example: gt
                value:
                  type: number
                  example: 10
    AlarmUpdateInput:
      type: object
      description: Writable alarm attributes
      properties:
        name:
          type: string
        description:
          type: string
    Channel:
      type: object
      description: A notification channel
      required:
      - id
      - project_id
      - type
      - active
      properties:
        id:
          type: string
          description: Unique public identifier
          example: Ch9wLp
        project_id:
          type: string
          description: Public ID of the project this channel belongs to
          example: Xk9mZp
        type:
          type: string
          description: Channel type
          example: slack
        active:
          type: boolean
          description: Whether the channel is active
        events:
          type: array
          items:
            type: string
          description: Event types this channel listens for
        site_ids:
          type: array
          items:
            type: string
          description: Public IDs of sites this channel monitors
        check_in_ids:
          type: array
          items:
            type: string
          description: Public IDs of check-ins this channel monitors
        excluded_environments:
          type: array
          items:
            type: string
          description: Environment names excluded from notifications
        created_at:
          type: string
          format: date-time
          description: When the channel was created
    ChannelInput:
      type: object
      description: Writable channel attributes
      properties:
        active:
          type: boolean
        events:
          type: array
          description: Event names this channel notifies on
          items:
            type: string
        site_ids:
          type: array
          description: 'Public IDs of sites to scope this channel to. Empty means
            every site. IDs outside this project resolve to nothing rather than attaching
            another tenant''s site.

            '
          items:
            type: string
        check_in_ids:
          type: array
          description: Public IDs of check-ins to scope this channel to. Empty means
            every check-in.
          items:
            type: string
    CheckIn:
      type: object
      description: A scheduled task check-in monitor
      required:
      - id
      - project_id
      - name
      - slug
      - schedule_type
      properties:
        id:
          type: string
          description: Unique public identifier
          example: Ci5xWq
        project_id:
          type: string
          description: Public ID of the project this check-in belongs to
          example: Xk9mZp
        name:
          type: string
          description: Display name
          example: Daily Backup
        slug:
          type: string
          description: URL-safe identifier
          example: daily-backup
        schedule_type:
          type: string
          description: Type of schedule
          enum:
          - cron
          - simple
        state:
          type: string
          description: Current check-in state
        reported_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the last report was received
        expected_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the next report is expected
        missed_count:
          type: integer
          description: Number of consecutive missed reports
        grace_period:
          type: integer
          description: Grace period in minutes before alerting
        report_url:
          type: string
          description: URL to ping when the task completes
        created_at:
          type: string
          format: date-time
          description: When the check-in was created
        cron_schedule:
          type:
          - string
          - 'null'
          description: Cron expression (for cron schedule type)
          example: 0 2 * * *
        cron_timezone:
          type:
          - string
          - 'null'
          description: Timezone for cron schedule
          example: America/New_York
        report_period:
          type:
          - integer
          - 'null'
          description: Expected report period in minutes (for simple schedule type)
    CheckInBulkUpdateInput:
      type: object
      description: 'The project''s complete set of check-ins. This replaces rather
        than merges: any check-in the project has and this payload does not name is
        DELETED. Must be a non-empty array, and every entry needs a slug — an empty
        payload is rejected rather than taken to mean "delete all of them".

        '
      required:
      - check_ins
      properties:
        check_ins:
          type: array
          minItems: 1
          items:
            allOf:
            - "$ref": "#/components/schemas/CheckInInput"
            - type: object
              required:
              - slug
              properties:
                slug:
                  type: string
                  description: Identifies which check-in an entry refers to, so it
                    is required here
    CheckInEvent:
      type: object
      description: A check-in event
      required:
      - check_in_id
      - state
      - created_at
      properties:
        check_in_id:
          type: string
          description: Public ID of the check-in
          example: Ci5xWq
        state:
          type: string
          description: The state the check-in entered
          example: reporting
        created_at:
          type: string
          format: date-time
          description: When the event occurred
        payload:
          type:
          - string
          - 'null'
          description: The payload reported with the check-in, as it was sent. Only
            retained on plans with advanced check-ins.
    CheckInInput:
      type: object
      description: Writable check-in attributes
      required:
      - name
      properties:
        name:
          type: string
          example: Nightly billing job
        slug:
          type: string
          description: 'Short identifier used in the check-in''s reporting URL. Generated
            from the name when omitted.

            '
          example: nightly-billing
        schedule_type:
          type: string
          enum:
          - simple
          - cron
          default: simple
          description: "`simple` expects a report every `report_period`. `cron` expects
            reports on a cron schedule and requires `cron_schedule`.\n"
        report_period:
          type: string
          description: 'How often a report is expected, for `simple` schedules. A
            count and a unit (`10 minutes`, `1 day`) or `HH:MM:SS`. Required unless
            `schedule_type` is `cron`, and may not be zero.

            '
          example: 1 day
        grace_period:
          type: string
          description: 'How long after the expected time before the check-in is considered
            missing. Same format as `report_period`.

            '
          example: 10 minutes
        cron_schedule:
          type: string
          description: Cron expression, required when `schedule_type` is `cron`
          example: 0 3 * * *
        cron_timezone:
          type: string
          description: 'Timezone the cron schedule is evaluated in. A Rails/ActiveSupport
            zone NAME, not an IANA identifier — `Central Time (US & Canada)`, not
            `America/Chicago`, which is rejected. Required when `schedule_type` is
            `cron`.

            '
          example: Central Time (US & Canada)
    Comment:
      type: object
      description: A comment on a fault
      required:
      - id
      - fault_id
      - body
      - created_at
      properties:
        id:
          type: string
          description: Unique public identifier
          example: Cm7pLx
        fault_id:
          type: string
          description: Public ID of the fault this comment belongs to
          example: Fq8nRz
        author:
          type:
          - object
          - 'null'
          description: Author of the comment
          properties:
            id:
              type:
              - string
              - 'null'
              description: Public ID of the author
            name:
              type: string
              description: Name of the author
            email:
              type: string
              description: Email of the author
        body:
          type: string
          description: Comment body text
        source:
          type: string
          description: Source of the comment
        event:
          type: string
          description: Event type associated with the comment
        created_at:
          type: string
          format: date-time
          description: When the comment was created
    CommentInput:
      type: object
      description: Writable comment attributes
      required:
      - body
      properties:
        body:
          type: string
          description: The comment text. `@mentions` notify the named project members.
          example: Rolled back, watching for recurrence.
    Dashboard:
      type: object
      description: An Insights dashboard
      required:
      - id
      - project_id
      - title
      properties:
        id:
          type: string
          description: Unique public identifier
          example: Db4rKn
        project_id:
          type: string
          description: Public ID of the project this dashboard belongs to
          example: Xk9mZp
        title:
          type: string
          description: Dashboard title
          example: Performance Overview
        widgets:
          type: array
          description: 'The dashboard''s widgets, in the same shape a write accepts
            — the read and write forms are identical, including `config.streams` as
            stream slugs (`stream_ids` exists only inside the model). Pointed at the
            request schema''s definition rather than restated, because that definition
            is app/data/schemas/dashboard_schema.json, the validator itself.

            '
          items:
            "$ref": "#/components/schemas/DashboardInput/properties/widgets/items"
        is_default:
          type: boolean
          description: Whether this is the default dashboard
        shared:
          type: boolean
          description: Whether the dashboard is shared with all team members
        created_at:
          type: string
          format: date-time
          description: When the dashboard was created
        updated_at:
          type: string
          format: date-time
          description: When the dashboard was last updated
    DashboardInput:
      "$schema": http://json-schema.org/draft-07/schema#
      "$defs":
        chartConfigs:
          table:
            type: object
            description: Raw result rows and columns. No config.
            additionalProperties: false
          billboard:
            type: object
            description: 'Big-number stat tiles: one tile per result row (or one per
              result field when `groupType` is `fields`).'
            additionalProperties: false
            properties:
              titleField:
                type: string
                description: Alias shown as the tile title
              valueField:
                type: string
                description: Alias shown as the big number; required when `groupType`
                  is `events`
              titleURLField:
                type: string
                description: Alias containing a URL; makes the tile title a link
              subtitleField:
                type: string
                description: Alias shown below the value
              statusField:
                type: string
                description: Alias whose value drives the tile's status indicator
              groupType:
                type: string
                enum:
                - fields
                - events
                description: "`events` (default): one tile per result row using `valueField`;
                  `fields`: one tile per result field"
            allOf:
            - if:
                properties:
                  groupType:
                    const: events
                required:
                - groupType
              then:
                required:
                - valueField
          bar:
            type: object
            description: Bar chart of a value per category.
            required:
            - categoryField
            - valueField
            additionalProperties: false
            properties:
              categoryField:
                type: string
                description: Alias for the category axis; one bar per distinct value
              valueField:
                type: string
                description: Alias for bar height
              valueFieldUnit:
                type: string
                description: 'Unit used to format values: `percent`, `microseconds`,
                  or `milliseconds`'
              labelField:
                type: string
                description: Alias rendered as a label on each bar
              groupType:
                type: string
                enum:
                - fields
                - events
                description: "`events` (default): series come from `groupField`; `fields`:
                  every result field except `categoryField` becomes its own series"
              groupField:
                type: string
                description: Alias whose distinct values split bars into series (with
                  `groupType` `events`)
              horizontal:
                type: boolean
                description: Render bars horizontally
              stacked:
                type: boolean
                description: Stack series instead of grouping side by side
              groups:
                type: object
                description: 'Per-series display options keyed by series name, e.g.
                  `{"web": {"color": "#4A90D9"}}`. Advanced — usually omit'
                patternProperties:
                  "^.*$":
                    type: object
                    properties:
                      color:
                        type: string
          line:
            type: object
            description: One or more series plotted over an x axis, usually time.
            additionalProperties: false
            properties:
              xField:
                type: string
                description: Alias for the x axis, typically a time bin such as `bin(1h)`
              yField:
                type: string
                description: Alias plotted as the series value; required when `groupType`
                  is `events`
              zField:
                type: string
                description: Alias whose distinct values split results into one series
                  each
              colorField:
                type: string
                description: Alias whose values supply explicit series colors
              xFieldUnit:
                type: string
                description: 'Unit used to format x values: `percent`, `microseconds`,
                  or `milliseconds`'
              yFieldUnit:
                type: string
                description: 'Unit used to format y values: `percent`, `microseconds`,
                  or `milliseconds`'
              groupType:
                type: string
                enum:
                - fields
                - events
                description: "`events` (default): one series from `yField`, split
                  by `zField` if set; `fields`: every result field except `xField`
                  becomes its own series"
              yAxisLabel:
                type: string
                description: Left y-axis label (accepted but not currently applied
                  by the renderer)
              yAxisMin:
                type: number
                description: Left y-axis minimum (accepted but not currently applied
                  by the renderer)
              yAxisMax:
                type: number
                description: Left y-axis maximum (accepted but not currently applied
                  by the renderer)
              rightYAxisFormat:
                type: string
                description: Right y-axis format (accepted but not currently applied
                  by the renderer)
              rightYAxisLabel:
                type: string
                description: Right y-axis label (accepted but not currently applied
                  by the renderer)
              rightYAxisMin:
                type: number
                description: Right y-axis minimum (accepted but not currently applied
                  by the renderer)
              rightYAxisMax:
                type: number
                description: Right y-axis maximum (accepted but not currently applied
                  by the renderer)
              groups:
                type: object
                description: 'Per-series display options keyed by series name, e.g.
                  `{"web": {"color": "#4A90D9"}}`; entries may also set `axis` (`left`|`right`)
                  to plot a series on the right y axis. Advanced — usually omit'
                patternProperties:
                  "^.*$":
                    type: object
                    properties:
                      color:
                        type: string
                      axis:
                        type: string
                        enum:
                        - left
                        - right
            allOf:
            - if:
                properties:
                  groupType:
                    const: events
                required:
                - groupType
              then:
                required:
                - yField
          area:
            type: object
            description: Like line, with the area under each series filled; series
              can be stacked.
            additionalProperties: false
            properties:
              xField:
                type: string
                description: Alias for the x axis, typically a time bin such as `bin(1h)`
              yField:
                type: string
                description: Alias plotted as the series value; required when `groupType`
                  is `events`
              zField:
                type: string
                description: Alias whose distinct values split results into one series
                  each
              groupType:
                type: string
                enum:
                - fields
                - events
                description: "`events` (default): one series from `yField`, split
                  by `zField` if set; `fields`: every result field except `xField`
                  becomes its own series"
              stacked:
                type: boolean
                description: Stack series instead of overlaying them
              groups:
                type: object
                description: 'Per-series display options keyed by series name, e.g.
                  `{"web": {"color": "#4A90D9"}}`. Advanced — usually omit'
                patternProperties:
                  "^.*$":
                    type: object
                    properties:
                      color:
                        type: string
            allOf:
            - if:
                properties:
                  groupType:
                    const: events
                required:
                - groupType
              then:
                required:
                - yField
          histogram:
            type: object
            description: Distribution of values across buckets.
            required:
            - xField
            - yField
            additionalProperties: false
            properties:
              xField:
                type: string
                description: Alias for the x axis
              yField:
                type: string
                description: Alias for the y axis
              zField:
                type: string
                description: Alias whose distinct values split results into one series
                  each
              xFieldUnit:
                type: string
                description: 'Unit used to format x values: `percent`, `microseconds`,
                  or `milliseconds`'
              yFieldUnit:
                type: string
                description: 'Unit used to format y values: `percent`, `microseconds`,
                  or `milliseconds`'
              groups:
                type: object
                description: 'Per-series display options keyed by series name, e.g.
                  `{"web": {"color": "#4A90D9"}}`. Advanced — usually omit'
                patternProperties:
                  "^.*$":
                    type: object
                    properties:
                      color:
                        type: string
          scatter:
            type: object
            description: Individual points plotted on two axes.
            required:
            - xField
            - yField
            additionalProperties: false
            properties:
              xField:
                type: string
                description: Alias for the x axis
              yField:
                type: string
                description: Alias for the y axis
              groupField:
                type: string
                description: Alias whose distinct values color the points
              scaleField:
                type: string
                description: Alias that scales point size
              groups:
                type: object
                description: 'Per-series display options keyed by series name, e.g.
                  `{"web": {"color": "#4A90D9"}}`. Advanced — usually omit'
                patternProperties:
                  "^.*$":
                    type: object
                    properties:
                      color:
                        type: string
          heatmap:
            type: object
            description: Grid of cells colored by intensity. The query must sort by
              the x and y fields (`| sort x, y`) to render correctly.
            required:
            - xField
            - yField
            - zField
            additionalProperties: false
            properties:
              xField:
                type: string
                description: Alias for the x axis, typically a time bin such as `bin(1h)`
              yField:
                type: string
                description: Alias for the y axis
              zField:
                type: string
                description: Alias for cell value/intensity
              yFieldUnit:
                type: string
                description: 'Unit used to format y values: `percent`, `microseconds`,
                  or `milliseconds`'
              steps:
                type: integer
                minimum: 1
                description: Number of color steps (default 5)
              groups:
                type: object
                description: 'Per-series display options keyed by series name, e.g.
                  `{"web": {"color": "#4A90D9"}}`. Advanced — usually omit'
                patternProperties:
                  "^.*$":
                    type: object
                    properties:
                      color:
                        type: string
          pie:
            type: object
            description: Proportional slices; one slice per result row.
            required:
            - nameField
            - valueField
            additionalProperties: false
            properties:
              nameField:
                type: string
                description: Alias for slice labels
              valueField:
                type: string
                description: Alias for slice sizes
              groups:
                type: object
                description: 'Per-slice display options keyed by slice name, e.g.
                  `{"web": {"color": "#4A90D9"}}`. Advanced — usually omit'
                patternProperties:
                  "^.*$":
                    type: object
                    properties:
                      color:
                        type: string
        widgetConfigs:
          insights_vis:
            additionalProperties: false
            properties:
              streams:
                type: array
                items:
                  type: string
                  enum:
                  - default
                  - internal
                description: Streams to query (defaults to ["default"])
              query:
                description: BadgerQL query producing the widget's data
              vis:
                description: 'How to render the result: `{view, chart_config}`'
          alarms:
            additionalProperties: false
            properties:
              limit:
                type: integer
                minimum: 1
                description: Max alarms shown
              filter_state:
                type: string
                enum:
                - all
                - triggered
                - ok
                description: Show all alarms or only those in one state
          errors:
            additionalProperties: false
            properties:
              limit:
                type: integer
                minimum: 1
                description: Max errors shown
              query:
                type: string
                description: Error search query string to filter the list
              sort:
                type: string
                enum:
                - last_seen_desc
                - last_seen_asc
                - times_desc
                - times_asc
                description: Sort order
          deployments:
            additionalProperties: false
            properties:
              limit:
                type: integer
                minimum: 1
                description: Max deploys shown
              override_time:
                type: boolean
                description: Use `ts` instead of the dashboard's time range
              ts:
                type: string
                description: Time range used when `override_time` is true
          checkins:
            additionalProperties: false
            properties:
              limit:
                type: integer
                minimum: 1
                description: Max check-ins shown
              sort_order:
                type: string
                enum:
                - state_name
                - name
                - last_reported
                description: Sort by state, name, or last report time
          uptime:
            additionalProperties: false
            properties:
              limit:
                type: integer
                minimum: 1
                description: Max uptime monitors shown
      type: object
      required:
      - title
      - widgets
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 255
        default_ts:
          type: string
        widgets:
          type: array
          items:
            type: object
            required:
            - type
            additionalProperties: false
            properties:
              id:
                type: string
              type:
                type: string
                enum:
                - insights_vis
                - alarms
                - deployments
                - checkins
                - uptime
                - errors
              grid:
                type: object
                additionalProperties: false
                properties:
                  x:
                    type: integer
                    minimum: 0
                  "y":
                    type: integer
                    minimum: 0
                  w:
                    type: integer
                    minimum: 1
                  h:
                    type: integer
                    minimum: 1
              presentation:
                type: object
                additionalProperties: false
                properties:
                  title:
                    type: string
                    maxLength: 255
                  subtitle:
                    type: string
                    maxLength: 255
              config:
                type: object
                properties:
                  streams:
                    type: array
                    items:
                      type: string
                      enum:
                      - default
                      - internal
                  query:
                    type: string
                  vis:
                    type: object
                    required:
                    - view
                    additionalProperties: false
                    properties:
                      view:
                        type: string
                        enum:
                        - billboard
                        - bar
                        - line
                        - pie
                        - area
                        - histogram
                        - scatter
                        - heatmap
                        - table
                      chart_config:
                        type: object
                    allOf:
                    - if:
                        properties:
                          view:
                            const: table
                      then:
                        properties:
                          chart_config:
                            "$ref": "#/components/schemas/DashboardInput/$defs/chartConfigs/table"
                    - if:
                        properties:
                          view:
                            const: billboard
                      then:
                        properties:
                          chart_config:
                            "$ref": "#/components/schemas/DashboardInput/$defs/chartConfigs/billboard"
                    - if:
                        properties:
                          view:
                            const: bar
                      then:
                        properties:
                          chart_config:
                            "$ref": "#/components/schemas/DashboardInput/$defs/chartConfigs/bar"
                    - if:
                        properties:
                          view:
                            const: line
                      then:
                        properties:
                          chart_config:
                            "$ref": "#/components/schemas/DashboardInput/$defs/chartConfigs/line"
                    - if:
                        properties:
                          view:
                            const: area
                      then:
                        properties:
                          chart_config:
                            "$ref": "#/components/schemas/DashboardInput/$defs/chartConfigs/area"
                    - if:
                        properties:
                          view:
                            const: histogram
                      then:
                        properties:
                          chart_config:
                            "$ref": "#/components/schemas/DashboardInput/$defs/chartConfigs/histogram"
                    - if:
                        properties:
                          view:
                            const: scatter
                      then:
                        properties:
                          chart_config:
                            "$ref": "#/components/schemas/DashboardInput/$defs/chartConfigs/scatter"
                    - if:
                        properties:
                          view:
                            const: heatmap
                      then:
                        properties:
                          chart_config:
                            "$ref": "#/components/schemas/DashboardInput/$defs/chartConfigs/heatmap"
                    - if:
                        properties:
                          view:
                            const: pie
                      then:
                        properties:
                          chart_config:
                            "$ref": "#/components/schemas/DashboardInput/$defs/chartConfigs/pie"
            allOf:
            - if:
                properties:
                  type:
                    const: insights_vis
              then:
                properties:
                  config:
                    "$ref": "#/components/schemas/DashboardInput/$defs/widgetConfigs/insights_vis"
            - if:
                properties:
                  type:
                    const: alarms
              then:
                properties:
                  config:
                    "$ref": "#/components/schemas/DashboardInput/$defs/widgetConfigs/alarms"
            - if:
                properties:
                  type:
                    const: errors
              then:
                properties:
                  config:
                    "$ref": "#/components/schemas/DashboardInput/$defs/widgetConfigs/errors"
            - if:
                properties:
                  type:
                    const: deployments
              then:
                properties:
                  config:
                    "$ref": "#/components/schemas/DashboardInput/$defs/widgetConfigs/deployments"
            - if:
                properties:
                  type:
                    const: checkins
              then:
                properties:
                  config:
                    "$ref": "#/components/schemas/DashboardInput/$defs/widgetConfigs/checkins"
            - if:
                properties:
                  type:
                    const: uptime
              then:
                properties:
                  config:
                    "$ref": "#/components/schemas/DashboardInput/$defs/widgetConfigs/uptime"
    Deploy:
      type: object
      description: A deploy event
      required:
      - id
      - project_id
      - environment
      - revision
      properties:
        id:
          type: string
          description: Unique public identifier
          example: Dp2yNk
        project_id:
          type: string
          description: Public ID of the project this deploy belongs to
          example: Xk9mZp
        environment:
          type: string
          description: Deploy environment
          example: production
        revision:
          type: string
          description: Source control revision
          example: a1b2c3d4
        branch:
          type:
          - string
          - 'null'
          description: Source control branch
          example: main
        repository_url:
          type:
          - string
          - 'null'
          description: URL of the source repository
          example: https://github.com/acme/app
        local_username:
          type: string
          description: Username of the person who triggered the deploy
          example: jane
        created_at:
          type: string
          format: date-time
          description: When the deploy was recorded
    Environment:
      type: object
      description: A project environment configuration
      required:
      - id
      - project_id
      - name
      properties:
        id:
          type: string
          description: Unique public identifier
          example: En6tRm
        project_id:
          type: string
          description: Public ID of the project this environment belongs to
          example: Xk9mZp
        name:
          type: string
          description: Environment name
          example: production
        notifications:
          type: object
          description: Notification settings for this environment
        created_at:
          type: string
          format: date-time
          description: When the environment was created
    EnvironmentInput:
      type: object
      description: Writable environment attributes
      required:
      - name
      properties:
        name:
          type: string
          example: production
        notifications:
          type: boolean
          description: Whether notifications are sent for faults in this environment
    Error:
      type: object
      description: API error response
      required:
      - error
      properties:
        error:
          "$ref": "#/components/schemas/ErrorBody"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    ErrorBody:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 'Machine-readable code. Branch on this rather than on the message,
            which is free text and may be the upstream service''s own wording.

            '
          enum:
          - unauthorized
          - unsupported_auth_scheme
          - credential_in_query
          - access_denied
          - insufficient_scope
          - requires_user_token
          - project_restricted
          - account_inactive
          - account_parked
          - feature_unavailable
          - not_found
          - validation_error
          - delete_failed
          - limit_reached
          - rate_limit_exceeded
          - maintenance_mode
          - invalid_id
          - forbidden_attributes
          - service_unavailable
          - ambiguous_account
        message:
          type: string
          description: Human-readable explanation
          example: Access denied
        details:
          description: 'A list of field errors for `validation_error`, or an object
            naming the missing permission for `insufficient_scope`. Absent for every
            other code.

            '
          oneOf:
          - type: array
            title: ValidationErrorDetails
            description: Present on validation_error, one entry per field that failed
            items:
              "$ref": "#/components/schemas/ErrorDetail"
          - type: object
            title: InsufficientScopeDetails
            description: 'What the endpoint required and what the credential holds,
              so a client can tell the holder exactly what to re-grant.

              '
            properties:
              required_scope:
                type: string
                description: The permission this endpoint requires.
                example: faults:write
              token_scopes:
                type: array
                description: The permissions the credential actually holds.
                items:
                  type: string
    ErrorDetail:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
          description: The field that failed validation
          example: name
        message:
          type: string
          description: Why it failed, without the field name repeated
          example: can't be blank
    Fault:
      type: object
      description: A unique error fingerprint (fault)
      required:
      - id
      - project_id
      properties:
        id:
          type: string
          description: Unique public identifier
          example: Fq8nRz
        project_id:
          type: string
          description: Public ID of the project this fault belongs to
          example: Xk9mZp
        klass:
          type: string
          description: Error class name
          example: NoMethodError
        message:
          type: string
          description: Error message
          example: undefined method 'foo' for nil:NilClass
        component:
          type:
          - string
          - 'null'
          description: Component where the error occurred
          example: UsersController
        action:
          type:
          - string
          - 'null'
          description: Action where the error occurred
          example: show
        environment:
          type: string
          description: Environment name
          example: production
        resolved:
          type: boolean
          description: Whether the fault is resolved
        ignored:
          type: boolean
          description: Whether the fault is ignored
        created_at:
          type: string
          format: date-time
          description: When the fault was first reported
        last_notice_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the last notice was received
        notices_count:
          type: integer
          description: Total number of notices for this fault
        comments_count:
          type: integer
          description: Number of comments on this fault
        tags:
          type: array
          items:
            type: string
          description: Tags assigned to this fault
          example:
          - critical
          - backend
        assignee:
          type:
          - object
          - 'null'
          description: User assigned to this fault
          properties:
            id:
              type: string
              description: Public ID of the assignee
            name:
              type: string
              description: Name of the assignee
            email:
              type: string
              description: Email of the assignee
        deploy:
          type:
          - object
          - 'null'
          description: Deploy associated with this fault
          properties:
            id:
              type: string
              description: Public ID of the deploy
            environment:
              type: string
              description: Deploy environment
            revision:
              type: string
              description: Deploy revision
            created_at:
              type: string
              format: date-time
              description: When the deploy was created
        tickets:
          type: array
          description: Issue tracker tickets linked to this fault
          items:
            type: object
            properties:
              url:
                type: string
                description: URL of the ticket
              channel_id:
                type: string
                description: Public ID of the channel that created the ticket
        resolve_on_deploy:
          type: boolean
          description: 'Whether this fault is waiting to be resolved by the next recorded
            deploy. Absent for a fault on an inactive project.

            '
        notices_count_in_range:
          type: integer
          description: 'Notices inside the requested occurrence window. Present only
            when the request supplied `occurred_after` or `occurred_before`.

            '
    FaultAssignmentInput:
      type: object
      description: Who to assign a fault to
      required:
      - assignee_id
      properties:
        assignee_id:
          type: string
          description: 'Public ID of a user on the project. A public ID that is not
            a member is rejected with 422 rather than silently unassigning. DELETE
            the same path to unassign.

            '
          example: Xk9mZp
    FaultInput:
      type: object
      description: Writable fault attributes
      properties:
        resolved:
          type: boolean
        ignored:
          type: boolean
        assignee_id:
          type:
          - string
          - 'null'
          description: 'Public ID of a user on the project. Null unassigns. A public
            ID that is not a member of this project is rejected with 422 rather than
            silently unassigning.

            '
          example: Xk9mZp
        tags:
          type: array
          items:
            type: string
        resolve_on_deploy:
          type: boolean
          description: |
            Resolve this fault the next time a deploy is recorded. Not a column on the fault — it is stored as a pending resolution — so it is applied after the update succeeds and is echoed back on the fault as `resolve_on_deploy`.

            Setting it on a fault that is already resolved or ignored does nothing, since those states clear any pending resolution. Sending false removes a pending resolution.
    IncidentUpdate:
      type: object
      description: An update to a status page incident. The incident's prose lives
        here, and its current_status, current_severity and closed_at are derived from
        its updates.
      required:
      - id
      - incident_id
      - status
      - severity
      properties:
        id:
          type: string
          description: Unique public identifier
          example: Iu6tMn
        incident_id:
          type: string
          description: Public ID of the incident
          example: In3pKr
        message:
          type:
          - string
          - 'null'
          description: The update's prose
          example: We have identified the cause and are rolling back.
        status:
          type: string
          description: Status at the time of the update
          enum:
          - maintenance_scheduled
          - in_maintenance
          - maintenance_complete
          - investigating
          - identified
          - resolving
          - monitoring
          - resolved
        severity:
          type: string
          description: Severity at the time of the update
          enum:
          - problem_detected
          - degraded_performance
          - partial_outage
          - outage
          - operational
        start_at:
          type: string
          format: date-time
          description: When the update takes effect. A future time schedules it.
        should_notify:
          type:
          - boolean
          - 'null'
          description: Whether the update is announced on the status page's connected
            accounts
        notified_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the announcement was sent
        created_at:
          type: string
          format: date-time
          description: When the update was posted
        updated_at:
          type: string
          format: date-time
          description: When the update was last changed
    IncidentUpdateInput:
      type: object
      description: The writable fields of an incident update. status and severity
        default to investigating and problem_detected. If neither start_at nor start_now
        is given, the update starts now.
      properties:
        message:
          type: string
          description: The update's prose
          example: We have identified the cause and are rolling back.
        status:
          type: string
          enum:
          - maintenance_scheduled
          - in_maintenance
          - maintenance_complete
          - investigating
          - identified
          - resolving
          - monitoring
          - resolved
        severity:
          type: string
          enum:
          - problem_detected
          - degraded_performance
          - partial_outage
          - outage
          - operational
        start_at:
          type: string
          format: date-time
          description: When the update takes effect. Only a scheduled_maintenance
            incident may set this in the future.
        start_now:
          type: boolean
          description: Start the update immediately, ignoring start_at
        should_notify:
          type: boolean
          description: Announce the update on the status page's connected accounts
    Notice:
      type: object
      description: An individual error occurrence
      required:
      - id
      - fault_id
      - project_id
      - message
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The notice's token UUID, which addresses it globally
          example: 1e2ba1f0-4f3c-4b1a-9c7e-6f2f5c0f1a3b
        fault_id:
          type: string
          description: Public ID of the fault this notice belongs to
          example: Fq8nRz
        project_id:
          type: string
          description: Public ID of the project
          example: Xk9mZp
        environment:
          type:
          - string
          - 'null'
          description: 'Environment name, from the fault''s environment or the notice''s
            own environment_name. Null when neither is set.

            '
          example: production
        message:
          type: string
          description: Error message
          example: undefined method 'foo' for nil:NilClass
        created_at:
          type: string
          format: date-time
          description: When the notice was received
        request:
          type:
          - object
          - 'null'
          description: Request details when the error occurred
          properties:
            url:
              type: string
              description: Request URL
            component:
              type: string
              description: Controller or component name
            action:
              type: string
              description: Action name
            params:
              type: object
              description: Request parameters
            session:
              type: object
              description: Session data
        context:
          type: object
          description: Custom context data sent with the notice
          additionalProperties: true
        backtrace:
          type: array
          description: Stack trace frames
          items:
            type: object
            properties:
              file:
                type: string
              number:
                type: string
              method:
                type: string
    OccurrenceMeta:
      type: object
      properties:
        request_id:
          type: string
        period:
          type: string
          enum:
          - hour
          - day
          - week
          - month
