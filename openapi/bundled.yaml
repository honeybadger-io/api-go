                      total:
                        type: integer
                        description: Total faults matching the filter
                        example: 142
                      environments:
                        type: array
                        description: 'One entry per distinct environment/resolved/ignored
                          combination present. Combinations with no faults are absent
                          rather than zero.

                          '
                        items:
                          type: object
                          required:
