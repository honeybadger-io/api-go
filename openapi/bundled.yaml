  "/accounts/{account_id}/projects/{project_id}/faults/{fault_id}/merge":
    post:
      operationId: mergeFaults
      summary: Merge a fault into another
      description: 'Merges the fault in the path into the one named by `target_fault_id`.
        The path fault is the source: its notices move to the target and it is removed.
        The merge runs in the background, so this answers 202 with a batch id rather
        than the merged fault.

        '
      tags:
      - Faults
      parameters:
      - "$ref": "#/components/parameters/AccountId"
      - "$ref": "#/components/parameters/ProjectId"
      - "$ref": "#/components/parameters/FaultId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Names the fault to merge into
              required:
              - target_fault_id
              properties:
                target_fault_id:
                  type: string
                  description: 'Public ID of the fault to keep. Must be in the same
                    project as the fault in the path, which is the one being merged
                    away.

                    '
                  example: Ab3kL9
      responses:
        '202':
          description: Merge accepted and queued
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    description: A queued merge
                    required:
                    - batch_id
                    - source_id
                    - target_id
                    properties:
                      batch_id:
                        type: string
                        description: Identifies the background merge
                        example: WksB67FpRY3bZQ
                      source_id:
                        type: string
                        description: Public ID of the fault merged away — the one
                          from the path
                        example: 2z4WtH9gARww
                      target_id:
                        type: string
                        description: Public ID of the fault kept
                        example: OmDSjxQSys5k
                  meta:
                    "$ref": "#/components/schemas/ResponseMeta"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/AmbiguousAccount"
      security:
      - bearer_auth:
        - faults:write
