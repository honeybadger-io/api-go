  "/accounts/{account_id}/projects/{project_id}/faults/summary":
    get:
      operationId: getFaultSummary
      summary: Get fault counts by environment and state
      description: |
        Project-wide fault counts, grouped by environment and by resolved/ignored state.

        Accepts the same `q` search filter and time parameters as the fault list, so a caller can count the same set it would otherwise page through — which is the point, since the list cannot answer "how many, broken down how" without fetching every match.
      tags:
      - Faults
      parameters:
      - "$ref": "#/components/parameters/AccountId"
      - "$ref": "#/components/parameters/ProjectId"
      - name: q
        in: query
        description: Search filter, the same syntax the fault list accepts
        schema:
          type: string
      - "$ref": "#/components/parameters/CreatedAfter"
      - name: occurred_after
        in: query
        description: Only count faults that occurred after this Unix timestamp
        schema:
          type: number
          format: double
      - name: occurred_before
        in: query
        description: Only count faults that occurred before this Unix timestamp
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - total
                    - environments
                    properties:
                      total:
                        type: integer
                        description: Total faults matching the filter
                        example: 142
                      environments:
                        type: array
                        description: 'One entry per distinct environment/resolved/ignored
                          combination present. Combinations with no faults are absent
                          rather than zero.

                          '
                        items:
                          type: object
                          required:
                          - environment
                          - resolved
                          - ignored
                          - count
                          properties:
                            environment:
                              type:
                              - string
                              - 'null'
                              description: Null for faults recorded with no environment
                              example: production
                            resolved:
                              type: boolean
                            ignored:
                              type: boolean
                            count:
                              type: integer
                  meta:
                    "$ref": "#/components/schemas/ResponseMeta"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/AmbiguousAccount"
        '429':
          "$ref": "#/components/responses/RateLimitExceeded"
      security:
      - bearer_auth:
        - faults:read
