                - data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - fault_count
                    - unresolved_fault_count
                    - notice_count_today
                    - notice_count_week
                    - notice_count_month
                    properties:
                      id:
                        type: string
                        description: Project ID
                      fault_count:
                        type: integer
