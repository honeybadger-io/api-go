      - total_count
      - total_pages
      properties:
        page:
          type: integer
          description: Current page number
          minimum: 1
          example: 1
        per_page:
          type: integer
          description: Items per page
          minimum: 1
          maximum: 100
          example: 25
        total_count:
          type: integer
          description: Total number of items across all pages
          minimum: 0
          example: 142
        total_pages:
          type: integer
          description: Total number of pages
          minimum: 0
          example: 6
    Project:
      type: object
      description: A Honeybadger project
      required:
      - id
      - account_id
      - name
      - active
      properties:
        id:
          type: string
          description: Unique public identifier
          example: Xk9mZp
        account_id:
          type: string
          description: Public ID of the account this project belongs to
          example: Ab3kL9
        name:
          type: string
          description: Project name
          example: My Rails App
        token:
          type: string
          description: API key for error reporting (only shown to authorized users)
          example: hbp_abc123...
        active:
          type: boolean
          description: Whether the project is active
        disable_public_links:
          type: boolean
          description: Whether public error links are disabled
        environments:
          type: array
          items:
            type: string
          description: List of environment names seen in this project
          example:
          - production
          - staging
          - development
        language:
          type:
          - string
          - 'null'
          description: Primary programming language
          example: Ruby
        fault_count:
          type: integer
          description: Total number of faults (errors) in this project
        unresolved_fault_count:
          type: integer
          description: Number of unresolved faults
        last_notice_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the last error was received
        earliest_notice_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Earliest available notice (based on retention)
        purge_days:
          type:
          - integer
          - 'null'
          description: Data retention period in days
        created_at:
          type: string
          format: date-time
          description: When the project was created
    ProjectInput:
      type: object
      description: Writable project attributes
      required:
      - name
      properties:
        name:
          type: string
          example: Billing API
        resolve_errors_on_deploy:
          type: boolean
          description: Resolve every open fault when a deploy is recorded
        disable_public_links:
          type: boolean
          description: Disallow shareable public fault links
        language:
          type: string
          description: Primary language, used to format backtraces
          example: ruby
        user_url:
          type: string
          description: 'Template for linking a fault''s affected user into your own
            system. `[user_id]` and `[user_email]` are substituted.

            '
          example: https://admin.example.com/users/[user_id]
        source_url:
          type: string
          description: 'Template for linking a backtrace line to your source host.
            `[file]` and `[line]` are substituted.

            '
          example: https://github.com/acme/app/blob/main/[file]#L[line]
        user_search_field:
          type: string
          description: 'Context key identifying the affected user, for when it is
            not in the default `context.user_email` or `context.user_id`.

            '
          example: context.account_id
        disable_email_notifications:
          type: boolean
          description: 'Applied at creation: members added with the project get email
            notifications switched off. Not a stored setting, so reading a project
            never returns it.

            '
        pivotal_project_id:
          type: string
        asana_workspace_id:
          type: string
        customer_throttle:
          type: integer
          description: Notices accepted per minute before throttling kicks in
        team_id:
          type: string
          description: 'Public ID of a team on this account, granting it access when
            the project is created. A team from another account resolves to nothing
            rather than being attached. Create only — afterwards manage access through
            the team''s projects.

            '
          example: Ab3kL9
        purge_days:
          type: integer
          description: 'Days to retain notices. Accepted only on accounts with custom
            retention; silently ignored otherwise.

            '
    ResponseMeta:
      type: object
      properties:
        request_id:
          type: string
          description: Unique identifier for the request, for correlating with support
    Site:
      type: object
      description: An uptime monitoring site
      required:
      - id
      - project_id
      - name
      - url
      - active
      properties:
        id:
          type: string
          description: Unique public identifier
          example: St3vBn
        project_id:
          type: string
          description: Public ID of the project this site belongs to
          example: Xk9mZp
        name:
          type: string
          description: Display name for the site
          example: Production App
        url:
          type: string
          description: URL to monitor
          example: https://app.example.com
        active:
          type: boolean
          description: Whether monitoring is active
        state:
          type: string
          description: Current state of the site
          example: up
        last_checked_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the site was last checked
        match_type:
          type: string
          description: Type of response matching
        match:
          type: string
          description: Value to match in the response
        request_method:
          type: string
          description: HTTP method for checks
          example: GET
        frequency:
          type: integer
          description: Check frequency in seconds
        locations:
          type: array
          items:
            type: string
          description: Monitoring locations
          example:
          - us-east-1
          - eu-west-1
        validate_ssl:
          type: boolean
          description: Whether to validate SSL certificates
        request_headers:
          type: object
          description: Custom headers sent with check requests
        request_body:
          type:
          - string
          - 'null'
          description: Request body for POST/PUT checks
        outage_threshold:
          type: integer
          description: Number of failed checks before declaring an outage
        timeout:
          type: integer
          description: Request timeout in seconds
        created_at:
          type: string
          format: date-time
          description: When the site was created
    SiteInput:
      type: object
      description: Writable uptime-check site attributes
      required:
      - name
      - url
      properties:
        name:
          type: string
          example: Marketing site
        url:
          type: string
          format: uri
          example: https://www.example.com/health
        match_type:
          type: string
          enum:
          - success
          - jmespath
          description: 'How a response is judged. `success` accepts any 2xx and ignores
            `match`; `jmespath` evaluates `match` against the JSON body.

            '
        match:
          type: string
          maxLength: 255
          description: Required unless `match_type` is `success`, where it is cleared
          example: status == 'ok'
        request_method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        validate_ssl:
          type: boolean
          description: Fail the check when the TLS certificate does not validate
        request_body:
          type: string
          description: Body to send with the request
        request_headers:
          type: array
          description: Headers to send with the request
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
        frequency:
          type: integer
          enum:
          - 1
          - 2
          - 5
          - 15
          description: 'Minutes between checks. The plan sets a floor, so a value
            below it is rejected.

            '
        locations:
          type: array
          description: 'Locations to check from, by name. Anything outside the known
            set is discarded, and if nothing recognisable remains the site checks
            from every location — so a typo silently widens rather than narrows.

            '
          items:
            type: string
            enum:
            - Virginia
            - Oregon
            - London
            - Frankfurt
            - Singapore
        outage_threshold:
          type: integer
          description: Consecutive failures before an outage is declared
        active:
          type: boolean
        timeout:
          type: integer
          description: 'Request timeout. Accepted only on accounts with the uptime-timeout
            feature; ignored otherwise.

            '
    StatusPage:
      type: object
      description: A public status page
      required:
      - id
