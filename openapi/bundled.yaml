          type: string
      - "$ref": "#/components/parameters/CreatedAfter"
      - name: occurred_after
        in: query
        description: Only count faults that occurred after this Unix timestamp
        schema:
          type: number
          format: double
      - name: occurred_before
        in: query
        description: Only count faults that occurred before this Unix timestamp
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
