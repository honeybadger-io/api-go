      description: |
        Occurrence counts for a fault, bucketed over an explicit window.

        The window is given by `occurred_after` and `occurred_before` — the same names the fault list uses for the same filter. Omit both for the last hour; `occurred_before` alone gives the hour before it; `occurred_after` alone runs to now. The start is clamped to retention. Bucket resolution is derived from the window's length, not chosen by the caller.

        `meta.window` reports the window actually served, which is narrower than the one requested when retention clamped the start, and `meta.interval_seconds` gives the spacing between the timestamps in `data`. Buckets are zero-filled, so every interval in the window is present.
      tags:
      - Faults
      parameters:
      - "$ref": "#/components/parameters/ProjectId"
      - "$ref": "#/components/parameters/FaultId"
      - "$ref": "#/components/parameters/FaultOccurredAfter"
      - "$ref": "#/components/parameters/FaultOccurredBefore"
      - "$ref": "#/components/parameters/SearchFilter"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    description: 'Buckets in ascending time order, one per interval
                      across the served window.

                      '
                    items:
                      type: object
                      required:
                      - timestamp
                      - count
                      properties:
                        timestamp:
                          type: integer
                          description: Start of the bucket, as a Unix timestamp.
                          example: 1704067200
                        count:
                          type: integer
                          description: Occurrences within the bucket.
                          example: 12
                  meta:
                    allOf:
                    - "$ref": "#/components/schemas/ResponseMeta"
                    - type: object
                      properties:
                        window:
                          type: object
                          description: The window actually served.
                          required:
                          - occurred_after
                          - occurred_before
                          properties:
                            occurred_after:
                              type: number
                              format: double
                              description: Unix timestamp, preserving fractional seconds.
                              example: 1704067200
                            occurred_before:
                              type: number
                              format: double
                              description: Unix timestamp, preserving fractional seconds.
                              example: 1704070800
                        interval_seconds:
                          type:
                          - integer
                          - 'null'
                          description: 'Spacing between bucket timestamps. Null when
                            the requested window falls entirely outside retention.

                            '
                          example: 60
                        retention_truncated:
                          type: boolean
                          description: Whether retention narrowed the requested window.
        '301':
          "$ref": "#/components/responses/MergedFault"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/AmbiguousAccount"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      security:
      - bearer_auth:
        - faults:read
