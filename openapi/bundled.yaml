  "/projects/{project_id}/streams":
    get:
      operationId: listStreams
      summary: List event streams
      description: 'Returns the project''s Insights event streams: `default`, for
        events your applications send, and `internal`, for events Honeybadger records
        about the project (errors, deploys, uptime checks and check-ins). A new project''s
        streams can take a moment to appear.

        '
      tags:
      - Streams
      parameters:
      - "$ref": "#/components/parameters/ProjectId"
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/PerPage"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Stream"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
                  links:
                    "$ref": "#/components/schemas/OffsetLinks"
                  meta:
                    "$ref": "#/components/schemas/ResponseMeta"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/AmbiguousAccount"
        '429':
          "$ref": "#/components/responses/RateLimitExceeded"
      security:
      - bearer_auth:
        - insights:read
  "/projects/{project_id}/insights/queries":
    post:
      operationId: runInsightsQuery
      summary: Run an Insights query
      description: |
        Runs a BadgerQL query against the project's event streams and returns the result. It's a POST, but it changes nothing.

        Pass `stream_ids` to choose streams, or leave it out to search them all. Events on a stream that isn't selected return no rows. See [BadgerQL](https://docs.honeybadger.io/guides/insights/badgerql/) for the query language.
      tags:
      - Insights
      parameters:
      - "$ref": "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              additionalProperties: false
              properties:
                query:
                  type: string
                  description: BadgerQL query
                  example: "@size > 0 | limit 10"
                stream_ids:
                  type: array
                  description: 'Streams to search. Omit it, or pass an empty array,
                    to search every stream on the project. Every ID must belong to
                    this project; repeated IDs are deduplicated.

                    '
                  items:
                    type: string
                ts:
                  type: string
                  description: Time range for the query
                  example: 1h
                timezone:
                  type: string
                  description: Timezone for time bucketing and display
                  example: UTC
      responses:
        '200':
          description: |
            The query result. Its fields depend on the query: an aggregation returns different fields from an event listing.

            `links.web` opens this query in the Honeybadger web UI, with the request's `ts`, `stream_ids` and `timezone` (UTC when none was sent). Present even when `data` carries an `error` from a query that failed while running.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - links
                properties:
                  data:
                    type: object
                    description: The query result; its fields depend on the query.
                    additionalProperties: true
                  links:
                    allOf:
                    - "$ref": "#/components/schemas/WebLinks"
                    description: Opens this query in Insights.
                  meta:
                    "$ref": "#/components/schemas/ResponseMeta"
        '422':
          description: 'The query was rejected. For a syntax or semantic error, `error.message`
            explains it and `error` may carry more keys. Also returned when `query`
            is missing or not a string, when `stream_ids` isn''t an array of strings,
            or when a stream ID isn''t one of the project''s.

            '
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Error"
                - type: object
                  properties:
                    error:
                      type: object
                      additionalProperties: true
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimitExceeded"
        '503':
          description: Insights didn't answer. Retry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
      - bearer_auth:
        - insights:read
