openapi: 3.1.0
info:
  title: Honeybadger API
  description: |
    The Honeybadger API v3 provides programmatic access to your Honeybadger data.

    ## Authentication

    Every request authenticates with a Bearer token:

    ```
    Authorization: Bearer YOUR_API_TOKEN
    ```

    Bearer is the only accepted scheme. Two things that work on v2 are refused
    here, each with its own error code so the cause is unambiguous:

    - HTTP basic — the token as the username with a blank password, which is what
      `curl -u` sends — answers `401 unsupported_auth_scheme`.
    - A credential in the `auth_token` query parameter answers
      `401 credential_in_query`, even when the credential is valid: a secret in a
      URL leaks through access logs, proxies, Referer headers and anything a
      person copy-pastes.

    You can find your API token in your Honeybadger user settings.

    ## Account scope

    No v3 path carries an account id. `GET /v3/projects` lists projects, and
    `GET /v3/account` returns the account. v2's `/v2/accounts/:account_id/`
    prefix is gone.

    The account is resolved from the credential you authenticate with, not from
    the path. A credential that covers more than one account leaves the account
    a request applies to undetermined, and every endpoint answers 422 with code
    `ambiguous_account`.

    ## Request bodies

    Send the resource's fields at the top level of the body. There is no root
    element:

    ```json
    {"name": "Billing API", "language": "ruby"}
    ```

    v1 and v2 wrapped bodies under the resource name (`{"project": {...}}`).
    v3 does not, anywhere.


    IDs in a body (`team_id`, `site_ids`, `fault_ids` and the like) are the
    same IDs the API returns for those records. An ID the credential can't
    see fails the whole request with 422 `validation_error`, naming the field
    and the unknown IDs. None is dropped silently, and the response is the same
    whether an ID doesn't exist or belongs to someone else. An ID in the path
    that doesn't resolve is a 404.

    ## Rate Limiting

    API requests are rate limited per hour. User tokens and OAuth grants share
    one limit per person; account tokens share one limit per account. The limit
    is 360 requests per hour unless a higher one has been set for that person
    or account. Rate limit information is returned in response headers:

    - `X-RateLimit-Limit`: Maximum requests per hour
    - `X-RateLimit-Remaining`: Remaining requests in current window
    - `X-RateLimit-Reset`: Unix timestamp when the limit resets

    ## Pagination

    ### Offset-based Pagination

    Most list endpoints use offset-based pagination with the following parameters:
    - `page`: Page number (default: 1)
    - `per_page`: Items per page (default: 25, max: 100)

    ### Time-series Pagination

    Time-ordered collections (notices, comments, deploys, outages, uptime checks,
    check-in events, incidents) are not paged by number, because new items arrive
    at one end while you read. They return `limit`, `has_older` and `has_newer`.

    **Follow the links.** `links.older` and `links.newer` are the mechanism that
    works on every one of these collections, and a client that follows them needs
    to know nothing else. Both are null when there is nothing further in that
    direction.

    Five of these collections also return `oldest_cursor` and `newest_cursor`,
    opaque tokens you can pass back as `before` and `after`. Use them when a
    client needs to persist its position without storing a whole URL.

    The other three — outages, uptime checks and check-in events — are paged on a
    timestamp window instead, with `created_after` and `created_before`, and
    return no cursor fields. Uptime checks have no primary key to tie-break on;
    outages keep the v2 API's window parameters so a client can move between
    versions unchanged. Treat the cursors as an optimisation, not the contract.

    A few collections are one-directional and say so in their description: they
    always report `has_newer: false` with a null `links.newer`.

    ## Response Format

    Successful responses follow a consistent envelope structure:

    ```json
    {
      "data": { ... },
      "meta": { "request_id": "..." }
    }
    ```

    For collections:

    ```json
    {
      "data": [ ... ],
      "pagination": { ... },
      "links": { ... },
      "meta": { "request_id": "..." }
    }
    ```

    Errors have no `data`:

    ```json
    {
      "error": { "code": "...", "message": "..." },
      "meta": { "request_id": "..." }
    }
    ```

    ## Errors

    - 404: not visible to this credential. It doesn't exist, or it's outside a
      project-restricted token's projects.
    - 403 (`access_denied`, `insufficient_scope`, `project_restricted`,
      `feature_unavailable`, `limit_reached`): the credential or the plan can't
      do this.
    - 422: a problem with the body; `details` names the field.
    - 400: a problem with a query parameter.
    - 503: a data store didn't answer. Retry.

    ## Updates

    PATCH merges: an omitted field is unchanged. `null` resets or clears a
    field marked nullable and is 422 on any other. `[]` or `{}` empties a
    collection. These objects are replaced whole: status page `features`, alarm
    `trigger_config`, site `request_headers`. Integration `config` merges. An
    unknown key is 422. A body read from a GET can be sent back as is; its
    read-only keys are ignored.

    ## Deletes

    A delete has removed the resource by the time it answers 204. Deleting
    something already gone is 404, which a client can treat as success. A
    merged fault answers DELETE with 409.

    ## Consistency

    A GET right after a successful write returns the configuration written.
    Runtime state and counters can change between reads.

    ## Secrets

    Secrets are never returned. Leave one out of an update to keep it. Site
    `request_headers` are returned as stored.

    ## IDs

    IDs are strings everywhere, including UUID-formatted ones (sites, outages,
    notices).
