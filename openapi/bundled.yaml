          title: Sync status from Backlog
          description: When enabled Honeybadger will create a webhook in Backlog to
            sync issue status changes back to Honeybadger.
        subject_format:
          type:
          - string
          - 'null'
          title: Issue Subject
          description: Subject of each new Backlog issue. Placeholders such as `[class]`,
            `[message]` and `[fault_id]` are filled in; see [custom formatters](https://docs.honeybadger.io/guides/integrations/#custom-formatters).
          example: "[[project]] Occurred: [class] ([fault_id])"
        description_format:
          type:
          - string
          - 'null'
          title: Issue Description
          description: Body of each new Backlog issue. Placeholders such as `[class]`,
            `[message]` and `[fault_id]` are filled in; see [custom formatters](https://docs.honeybadger.io/guides/integrations/#custom-formatters).
          example: |
            [class]: [message]

            Backtrace:

            [backtrace]

            View full backtrace and more info at honeybadger.io: [url]
    DashboardChartConfigTable:
      type: object
      description: Raw result rows and columns. No config.
      additionalProperties: false
    DashboardChartConfigBillboard:
      type: object
      description: 'Big-number stat tiles: one tile per result row (or one per result
        field when `groupType` is `fields`).'
      additionalProperties: false
      properties:
        titleField:
          type: string
          description: Alias shown as the tile title
        valueField:
          type: string
          description: Alias shown as the big number; required when `groupType` is
            `events`
        titleURLField:
          type: string
          description: Alias containing a URL; makes the tile title a link
        subtitleField:
          type: string
          description: Alias shown below the value
        statusField:
          type: string
          description: Alias whose value drives the tile's status indicator
        groupType:
          type: string
          enum:
          - fields
          - events
          description: "`events` (default): one tile per result row using `valueField`;
            `fields`: one tile per result field"
      allOf:
      - if:
          properties:
            groupType:
              const: events
          required:
          - groupType
        then:
          required:
          - valueField
    DashboardChartConfigBar:
      type: object
      description: Bar chart of a value per category.
      required:
      - categoryField
      - valueField
      additionalProperties: false
      properties:
        categoryField:
          type: string
          description: Alias for the category axis; one bar per distinct value
        valueField:
          type: string
          description: Alias for bar height
        valueFieldUnit:
          type: string
          description: 'Unit used to format values: `percent`, `microseconds`, or
            `milliseconds`'
        labelField:
          type: string
          description: Alias rendered as a label on each bar
        groupType:
          type: string
          enum:
          - fields
          - events
          description: "`events` (default): series come from `groupField`; `fields`:
            every result field except `categoryField` becomes its own series"
        groupField:
          type: string
          description: Alias whose distinct values split bars into series (with `groupType`
            `events`)
        horizontal:
          type: boolean
          description: Render bars horizontally
        stacked:
          type: boolean
          description: Stack series instead of grouping side by side
        groups:
          type: object
          description: 'Per-series display options keyed by series name, e.g. `{"web":
            {"color": "#4A90D9"}}`. Advanced — usually omit'
          patternProperties:
            "^.*$":
              type: object
              properties:
                color:
                  type: string
    DashboardChartConfigLine:
      type: object
      description: One or more series plotted over an x axis, usually time.
      additionalProperties: false
      properties:
        xField:
          type: string
          description: Alias for the x axis, typically a time bin such as `bin(1h)`
        yField:
          type: string
          description: Alias plotted as the series value; required when `groupType`
            is `events`
        zField:
          type: string
          description: Alias whose distinct values split results into one series each
        colorField:
          type: string
          description: Alias whose values supply explicit series colors
        xFieldUnit:
          type: string
          description: 'Unit used to format x values: `percent`, `microseconds`, or
            `milliseconds`'
        yFieldUnit:
          type: string
          description: 'Unit used to format y values: `percent`, `microseconds`, or
            `milliseconds`'
        groupType:
          type: string
          enum:
          - fields
          - events
          description: "`events` (default): one series from `yField`, split by `zField`
            if set; `fields`: every result field except `xField` becomes its own series"
        yAxisLabel:
          type: string
          description: Left y-axis label (stored, but charts don't use it yet)
        yAxisMin:
          type: number
          description: Left y-axis minimum (stored, but charts don't use it yet)
        yAxisMax:
          type: number
          description: Left y-axis maximum (stored, but charts don't use it yet)
        rightYAxisFormat:
          type: string
          description: Right y-axis format (stored, but charts don't use it yet)
        rightYAxisLabel:
          type: string
          description: Right y-axis label (stored, but charts don't use it yet)
        rightYAxisMin:
          type: number
          description: Right y-axis minimum (stored, but charts don't use it yet)
        rightYAxisMax:
          type: number
          description: Right y-axis maximum (stored, but charts don't use it yet)
        groups:
          type: object
          description: 'Per-series display options keyed by series name, e.g. `{"web":
            {"color": "#4A90D9"}}`; entries may also set `axis` (`left`|`right`) to
            plot a series on the right y axis. Advanced — usually omit'
          patternProperties:
            "^.*$":
              type: object
              properties:
                color:
                  type: string
                axis:
                  type: string
                  enum:
                  - left
                  - right
      allOf:
      - if:
          properties:
            groupType:
              const: events
          required:
          - groupType
        then:
          required:
          - yField
    DashboardChartConfigArea:
      type: object
      description: Like line, with the area under each series filled; series can be
        stacked.
      additionalProperties: false
      properties:
        xField:
          type: string
          description: Alias for the x axis, typically a time bin such as `bin(1h)`
        yField:
          type: string
          description: Alias plotted as the series value; required when `groupType`
            is `events`
        zField:
          type: string
          description: Alias whose distinct values split results into one series each
        groupType:
          type: string
          enum:
          - fields
          - events
          description: "`events` (default): one series from `yField`, split by `zField`
            if set; `fields`: every result field except `xField` becomes its own series"
        stacked:
          type: boolean
          description: Stack series instead of overlaying them
        groups:
          type: object
          description: 'Per-series display options keyed by series name, e.g. `{"web":
            {"color": "#4A90D9"}}`. Advanced — usually omit'
          patternProperties:
            "^.*$":
              type: object
              properties:
                color:
                  type: string
      allOf:
      - if:
          properties:
            groupType:
              const: events
          required:
          - groupType
        then:
          required:
          - yField
    DashboardChartConfigHistogram:
      type: object
      description: Distribution of values across buckets.
      required:
      - xField
      - yField
      additionalProperties: false
      properties:
        xField:
          type: string
          description: Alias for the x axis
        yField:
          type: string
          description: Alias for the y axis
        zField:
          type: string
          description: Alias whose distinct values split results into one series each
        xFieldUnit:
          type: string
          description: 'Unit used to format x values: `percent`, `microseconds`, or
            `milliseconds`'
        yFieldUnit:
          type: string
          description: 'Unit used to format y values: `percent`, `microseconds`, or
            `milliseconds`'
        groups:
          type: object
          description: 'Per-series display options keyed by series name, e.g. `{"web":
            {"color": "#4A90D9"}}`. Advanced — usually omit'
          patternProperties:
            "^.*$":
              type: object
              properties:
                color:
                  type: string
    DashboardChartConfigScatter:
      type: object
      description: Individual points plotted on two axes.
      required:
      - xField
      - yField
      additionalProperties: false
      properties:
        xField:
          type: string
          description: Alias for the x axis
        yField:
          type: string
          description: Alias for the y axis
        groupField:
          type: string
          description: Alias whose distinct values color the points
        scaleField:
          type: string
          description: Alias that scales point size
        groups:
          type: object
          description: 'Per-series display options keyed by series name, e.g. `{"web":
            {"color": "#4A90D9"}}`. Advanced — usually omit'
          patternProperties:
            "^.*$":
              type: object
              properties:
                color:
                  type: string
    DashboardChartConfigHeatmap:
      type: object
      description: Grid of cells colored by intensity. The query must sort by the
        x and y fields (`| sort x, y`) to render correctly.
      required:
      - xField
      - yField
      - zField
      additionalProperties: false
      properties:
        xField:
          type: string
          description: Alias for the x axis, typically a time bin such as `bin(1h)`
        yField:
          type: string
          description: Alias for the y axis
        zField:
          type: string
          description: Alias for cell value/intensity
        yFieldUnit:
          type: string
          description: 'Unit used to format y values: `percent`, `microseconds`, or
            `milliseconds`'
        steps:
          type: integer
          minimum: 1
          description: Number of color steps (default 5)
        groups:
          type: object
          description: 'Per-series display options keyed by series name, e.g. `{"web":
            {"color": "#4A90D9"}}`. Advanced — usually omit'
          patternProperties:
            "^.*$":
              type: object
              properties:
                color:
                  type: string
    DashboardChartConfigPie:
      type: object
      description: Proportional slices; one slice per result row.
      required:
      - nameField
      - valueField
      additionalProperties: false
      properties:
        nameField:
          type: string
          description: Alias for slice labels
        valueField:
          type: string
          description: Alias for slice sizes
        groups:
          type: object
          description: 'Per-slice display options keyed by slice name, e.g. `{"web":
            {"color": "#4A90D9"}}`. Advanced — usually omit'
          patternProperties:
            "^.*$":
              type: object
              properties:
                color:
                  type: string
    DashboardWidgetConfigInsightsVis:
      additionalProperties: false
      properties:
        streams:
          type: array
          items:
            type: string
            enum:
            - default
            - internal
          description: 'Streams to query, by slug: `default` (the project''s own stream)
            or `internal`. Anything else is refused (422). Left out or empty, set
            to the project''s current streams. A slug whose stream the project doesn''t
            have yet, right after it''s created, is dropped.'
        query:
          type: string
          description: BadgerQL query producing the widget's data
        vis:
          type: object
          required:
          - view
          additionalProperties: false
          properties:
            view:
              type: string
              enum:
              - billboard
              - bar
              - line
              - pie
              - area
              - histogram
              - scatter
              - heatmap
              - table
            chart_config:
              type: object
          allOf:
          - if:
              properties:
                view:
                  const: table
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigTable"
          - if:
              properties:
                view:
                  const: billboard
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigBillboard"
          - if:
              properties:
                view:
                  const: bar
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigBar"
          - if:
              properties:
                view:
                  const: line
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigLine"
          - if:
              properties:
                view:
                  const: area
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigArea"
          - if:
              properties:
                view:
                  const: histogram
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigHistogram"
          - if:
              properties:
                view:
                  const: scatter
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigScatter"
          - if:
              properties:
                view:
                  const: heatmap
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigHeatmap"
          - if:
              properties:
                view:
                  const: pie
            then:
              properties:
                chart_config:
                  "$ref": "#/components/schemas/DashboardChartConfigPie"
          description: 'How to render the result: `{view, chart_config}`'
    DashboardWidgetConfigAlarms:
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          description: Max alarms shown
        filter_state:
          type: string
          enum:
          - all
          - triggered
          - ok
          description: Show all alarms or only those in one state
    DashboardWidgetConfigErrors:
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          description: Max errors shown
        query:
          type: string
          description: Error search query string to filter the list
        sort:
          type: string
          enum:
          - last_seen_desc
          - last_seen_asc
          - times_desc
          - times_asc
          description: Sort order
    DashboardWidgetConfigDeployments:
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          description: Max deploys shown
        override_time:
          type: boolean
          description: Use `ts` instead of the dashboard's time range
        ts:
          type: string
          description: Time range used when `override_time` is true
    DashboardWidgetConfigCheckins:
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          description: Max check-ins shown
        sort_order:
          type: string
          enum:
          - state_name
          - name
          - last_reported
          description: Sort by state, name, or last report time
    DashboardWidgetConfigUptime:
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          description: Max uptime monitors shown
    DashboardWidgetInput:
      type: object
      required:
      - type
      additionalProperties: false
      properties:
        id:
          type: string
          description: Kept as sent. Unique within its dashboard; another dashboard
            can use the same ID. Left out, the server assigns one. Use letters, digits,
            `-` and `_`.
        type:
          "$ref": "#/components/schemas/DashboardWidgetType"
        grid:
          type: object
          additionalProperties: false
          properties:
            x:
              type: integer
              minimum: 0
            "y":
              type: integer
              minimum: 0
            w:
              type: integer
              minimum: 1
            h:
              type: integer
              minimum: 1
          default:
            x: 0
            "y": 0
            w: 12
            h: 3
          description: 'Merged into the default {x: 0, y: 0, w: 12, h: 3}: left out,
            the widget gets the default, and a key left out takes the default''s value.'
        presentation:
          type: object
          additionalProperties: false
          properties:
            title:
              type: string
              maxLength: 255
              example: Checkout errors
            subtitle:
              type: string
              maxLength: 255
              example: Last 24 hours
        config:
          type: object
          additionalProperties: true
          description: The widget's settings, as described by DashboardWidgetConfig<Type>
            for its `type`.
      allOf:
      - if:
          properties:
            type:
              const: insights_vis
        then:
          properties:
            config:
              "$ref": "#/components/schemas/DashboardWidgetConfigInsightsVis"
      - if:
          properties:
            type:
              const: alarms
        then:
          properties:
            config:
              "$ref": "#/components/schemas/DashboardWidgetConfigAlarms"
      - if:
          properties:
            type:
              const: errors
        then:
          properties:
            config:
              "$ref": "#/components/schemas/DashboardWidgetConfigErrors"
      - if:
          properties:
            type:
              const: deployments
        then:
          properties:
            config:
              "$ref": "#/components/schemas/DashboardWidgetConfigDeployments"
      - if:
          properties:
            type:
              const: checkins
        then:
          properties:
            config:
              "$ref": "#/components/schemas/DashboardWidgetConfigCheckins"
      - if:
          properties:
            type:
              const: uptime
        then:
          properties:
            config:
              "$ref": "#/components/schemas/DashboardWidgetConfigUptime"
      description: A dashboard widget. Responses leave out empty values (null, "",
        [], {}); false and 0 are kept.
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: Project ID
      schema:
        type: string
        example: Xk9mZp
    FaultId:
      name: fault_id
      in: path
      required: true
      description: Fault ID
      schema:
        type: string
        example: '12345'
    Unmapped:
      name: unmapped
      in: query
      description: 'Return the backtrace as the client reported it instead of source-mapped.
        Accepts `true`/`false`, `1`/`0`, `yes`/`no`, `on`/`off`.

        '
      schema:
        type: boolean
        default: false
    Breadcrumbs:
      name: breadcrumbs
      in: query
      description: 'Include each notice''s `breadcrumbs` in the list. Off by default
        because a trail adds up to 40 entries per notice; the single-notice endpoint
        always includes them. Accepts `true`/`false`, `1`/`0`, `yes`/`no`, `on`/`off`.

        '
      schema:
        type: boolean
        default: false
    Page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Limit:
      name: limit
      in: query
      description: Maximum items to return. Values above 100 are treated as 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Before:
      name: before
      in: query
      description: Cursor for fetching older items
      schema:
        type: string
    After:
      name: after
      in: query
      description: Cursor for fetching newer items
      schema:
        type: string
    CreatedAfter:
      name: created_after
      in: query
      description: 'Only items created after this Unix timestamp (seconds, not ISO
        8601). Take it from `links.newer`; fractional seconds count.

        '
      schema:
        type: number
        format: double
        example: 1704067200.123456
    PageCreatedAfter:
      name: created_after
      in: query
      description: 'With `created_before`, limits the list to a window. Alone, returns
        the items just after it, newest first. A Unix timestamp (seconds, not ISO
        8601). Take it from `links.newer`; fractional seconds count.

        '
      schema:
        type: number
        format: double
        example: 1704067200.123456
    CreatedBefore:
      name: created_before
      in: query
      description: 'Only items created before this Unix timestamp (seconds, not ISO
        8601). Take it from `links.older`; fractional seconds count.

        '
      schema:
        type: number
        format: double
        example: 1704153600.123456
    OccurrencePeriod:
      name: period
      in: query
      description: 'Window to report over. Both ends are inclusive: `hour` gives 61
        one-minute buckets, `day` 25 hourly, `week` 8 daily, `month` 31 daily.

        '
      schema:
        type: string
        enum:
        - hour
        - day
        - week
        - month
        default: hour
    OccurrenceEnvironment:
      name: environment
      in: query
      description: Only count notices from faults in this environment
      schema:
        type: string
        example: production
    FaultOrder:
      name: order
      in: query
      description: "`recent` sorts by last occurrence, `frequent` by occurrence count.
        Left out, by creation time.\n"
      schema:
        type: string
        enum:
        - recent
        - frequent
    Sort:
      name: sort
      in: query
      description: 'Direction for `order`. Defaults to `desc` for `recent` and `frequent`,
        `asc` for creation time.

        '
      schema:
        type: string
        enum:
        - asc
        - desc
    FaultCreatedAfter:
      name: created_after
      in: query
      description: Only faults first seen after this Unix timestamp (seconds, not
        ISO 8601).
      schema:
        type: number
        format: double
    FaultOccurredAfter:
      name: occurred_after
      in: query
      description: 'Only occurrences after this Unix timestamp (seconds, not ISO 8601).
        A value before the project''s retention window is moved up to it. On the fault
        list, occurrence counts cover this window.

        '
      schema:
        type: number
        format: double
    FaultOccurredBefore:
      name: occurred_before
      in: query
      description: 'Only occurrences before this Unix timestamp (seconds, not ISO
        8601).

        '
      schema:
        type: number
        format: double
    SearchFilter:
      name: q
      in: query
      description: 'Search query, in the syntax of the web UI''s error search, such
        as `environment:production`, `is:resolved` or `class:ArgumentError`. Prefix
        a filter with `-` to negate it. See [Error search](https://docs.honeybadger.io/guides/errors/search/)
        for the syntax and filters. Filters that need the search index return nothing
        when it holds no data for the project.

        '
      schema:
        type: string
  responses:
    MergedFault:
      description: 'This fault was merged into another fault. Location is the same
        resource on the fault it was merged into: `…/faults/<survivor>` for the fault,
        or the same subresource path and query for occurrences, affected users and
        notices. Only reads redirect; writes get a 409 `fault_merged`.

        '
      headers:
        Location:
          required: true
          description: Absolute URL of the same resource on the surviving fault.
          schema:
            type: string
            format: uri
    FaultMergedConflict:
      description: 'This fault was merged into another, so the write wasn''t applied.
        `error.details` names the fault it was merged into.

        '
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: fault_merged
              message: This fault was merged into fault 12345
              details:
                merged_into: '12345'
                location: https://app.honeybadger.io/v3/projects/Xk9mZp/faults/12345
            meta:
              request_id: abc123
    ServiceUnavailable:
      description: Temporarily unavailable. Retry shortly.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: service_unavailable
              message: Occurrence counts are unavailable. Try again shortly.
            meta:
              request_id: abc123
    AlarmServiceUnavailable:
      description: Alarms are temporarily unavailable. Retry later.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: service_unavailable
              message: Alarm service unavailable, please try again later
            meta:
              request_id: abc123
    Unauthorized:
      description: 'The credential is missing, invalid, expired or revoked (`unauthorized`),
        or was sent in a way v3 doesn''t accept (see the examples).

        '
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          examples:
            unauthorized:
              summary: Missing, malformed, expired or revoked credential
              value:
                error:
                  code: unauthorized
                  message: Access denied
                meta:
                  request_id: abc123
            unsupported_auth_scheme:
              summary: Sent as HTTP basic, which v3 does not accept
              description: 'The token sent as the HTTP basic username, as `curl -u`
                does. v3 takes Bearer only.

                '
              value:
                error:
                  code: unsupported_auth_scheme
                  message: 'Send the credential as `Authorization: Bearer <token>`;
                    v3 does not accept HTTP basic'
                meta:
                  request_id: abc123
            credential_in_query:
              summary: Sent as the `auth_token` query parameter
              value:
                error:
                  code: credential_in_query
                  message: Credentials must be sent in the Authorization header
                meta:
                  request_id: abc123
    Forbidden:
      description: 'The credential isn''t allowed to do this. `error.code` says why.
        An account or project the credential doesn''t cover is 404 `not_found`, not
        403.

        '
      headers:
        WWW-Authenticate:
          description: 'Present as `Bearer error="insufficient_scope"` when the code
            is `insufficient_scope`. Absent for the other reasons.

            '
          schema:
            type: string
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          examples:
            access_denied:
              summary: The credential isn't allowed to do this to this record
              value:
                error:
                  code: access_denied
                  message: Access denied
                meta:
                  request_id: abc123
            insufficient_scope:
              summary: The credential lacks the permission this endpoint requires
              description: "`details.required_scope` names the missing scope and `details.token_scopes`
                lists the credential's scopes.\n"
              value:
                error:
                  code: insufficient_scope
                  message: Insufficient scope
                  details:
                    required_scope: faults:write
                    token_scopes:
                    - faults:read
                    - insights:read
                meta:
                  request_id: abc123
            requires_user_token:
              summary: The endpoint records who acted, and an account token has nobody
              description: 'Sending an invitation records who sent it, so it needs
                a user token. An account token can''t, whatever its scopes.

                '
              value:
                error:
                  code: requires_user_token
                  message: This endpoint records the person who acted, so it requires
                    a user credential rather than an account token
                meta:
                  request_id: abc123
            project_restricted:
              summary: A project-restricted credential cannot create a project
              value:
                error:
                  code: project_restricted
                  message: Project-restricted tokens cannot create projects
                meta:
                  request_id: abc123
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Resource not found
            meta:
              request_id: abc123
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: validation_error
              message: Name can't be blank
              details:
              - field: name
                message: can't be blank
            meta:
              request_id: abc123
    AmbiguousAccount:
      description: 'No path names the account, so the API token has to. This is returned
        when the token covers more than one account and the account a request applies
        to cannot be determined. Use a token bound to a single account.

        '
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: ambiguous_account
              message: This credential covers more than one account, so the account
                a request applies to is ambiguous. Use a token bound to a single account.
            meta:
              request_id: abc123
    FaultBulkRejected:
      description: 'The request was refused and nothing was changed. `error.code`
        and `error.details` say why — see the examples below.

        '
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          examples:
            missing_selection:
              summary: The body named no faults
              description: 'Name faults with `fault_ids`, narrow them with `q` or
                a time filter, or pass `all: true` for every fault.

                '
              value:
                error:
                  code: validation_error
                  message: Name the faults to change with fault_ids, narrow them with
                    a filter, or pass all=true to change every fault in the project.
                  details:
                  - field: fault_ids
                    message: required unless a filter or all=true is given
                meta:
                  request_id: abc123
            unrecognised_filter:
              summary: q contained a filter that matches nothing
              description: 'An unknown filter is ignored, so the change would have
                applied to everything the rest of `q` matched. A common mistake is
                `is:unresolved`; the filter is `-is:resolved`.

                '
              value:
                error:
                  code: validation_error
                  message: 'Unrecognised search filters: is:unresolved. They match
                    nothing, so this would have applied to every fault the rest of
                    the query matched.'
                  details:
                  - field: q
                    message: unrecognised filter is:unresolved
                meta:
                  request_id: abc123
            unknown_fault_ids:
              summary: "`fault_ids` named a fault that isn't in this project"
              description: 'Every ID must be a fault in the project. One that isn''t,
                including a fault merged away since it was listed, fails the whole
                request.

                '
              value:
                error:
                  code: validation_error
                  message: 'fault_ids has unknown ids: 99999'
                  details:
                  - field: fault_ids
                    message: 'has unknown ids: 99999'
                meta:
                  request_id: abc123
            ambiguous_account:
              summary: "`assignee:me` in q, from a credential that covers more than
                one account"
              value:
                error:
                  code: ambiguous_account
                  message: This credential covers more than one account, so "me" is
                    ambiguous.
                meta:
                  request_id: abc123
    RateLimitExceeded:
      description: 'Rate limit exceeded. The limit is per credential owner per hour:
        a person''s tokens share one budget, and an account token uses the account''s.
        Wait `Retry-After` seconds and retry.

        '
      headers:
        Retry-After:
          description: Seconds until the hourly window resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: rate_limit_exceeded
              message: Rate limit exceeded
            meta:
              request_id: abc123
    ConcurrentCreate:
      description: 'Another project is being created in this account at the same moment
        (`concurrent_request`), or the rate limit is exceeded (`rate_limit_exceeded`).
        Nothing was created. Wait `Retry-After` seconds and retry.

        '
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: concurrent_request
              message: Another project is being created in this account; retry shortly
            meta:
              request_id: abc123
    StreamsProvisioning:
      description: "`stream_ids` was left out (or null) and the project's streams
        are still being set up, which a new project's are for a short time after it's
        created (`streams_provisioning`); or the rate limit is exceeded (`rate_limit_exceeded`).
        Nothing was created. Wait `Retry-After` seconds and retry.\n"
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: streams_provisioning
              message: The project's streams are still being set up; retry shortly
            meta:
              request_id: abc123
    BadRequest:
      description: 'A query parameter is malformed or outside its allowed values.
        `error.details` names the parameter.

        '
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: invalid_parameter
              message: unmapped must be true or false
              details:
              - field: unmapped
                message: must be true or false
            meta:
              request_id: abc123
