      summary: Merge a fault into another
      description: |
        Merges the fault in the path into the fault named by `target_fault_id`. Its notices, comments, tickets, notification opt-outs, Actions runs and merge history move to the target, and its tags, assignee and resolved or ignored state are dropped.

        The merge runs in the background, so the response is 202. Until it finishes, the merged fault can still be read and written; once it's done, a GET on it redirects (301) to the target. The redirect lasts about as long as the project's retention, and then the old ID returns 404.
      tags:
      - Faults
      parameters:
      - "$ref": "#/components/parameters/ProjectId"
      - "$ref": "#/components/parameters/FaultId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FaultMergeInput"
      responses:
        '202':
          description: Merge accepted and queued
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/FaultMerge"
                  meta:
                    "$ref": "#/components/schemas/ResponseMeta"
        '409':
          "$ref": "#/components/responses/FaultMergedConflict"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
      security:
      - bearer_auth:
        - faults:write
  "/projects/{project_id}/faults/{fault_id}/occurrences":
    get:
      operationId: listFaultOccurrences
      summary: Get a fault's occurrence counts
      description: |
        Returns a fault's occurrence counts over a window, set with `occurred_after` and `occurred_before`. With neither, the window is the last hour; with only `occurred_before`, the hour before it; with only `occurred_after`, from then until now. A start older than the project's retention is moved up to it.

        The bucket size depends on the window's length. `meta.window` gives the window served and `meta.interval_seconds` the bucket size. Every interval is included, with 0 where there were no occurrences.
      tags:
      - Faults
      parameters:
      - "$ref": "#/components/parameters/ProjectId"
      - "$ref": "#/components/parameters/FaultId"
      - "$ref": "#/components/parameters/FaultOccurredAfter"
      - "$ref": "#/components/parameters/FaultOccurredBefore"
      - "$ref": "#/components/parameters/SearchFilter"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    description: 'Buckets in ascending time order, one per interval
                      across the served window.

                      '
                    items:
                      type: object
                      required:
                      - timestamp
                      - count
                      properties:
                        timestamp:
                          type: integer
                          description: Start of the bucket, as a Unix timestamp.
                          example: 1704067200
                        count:
                          type: integer
                          description: Occurrences within the bucket.
                          example: 12
                  meta:
                    allOf:
                    - "$ref": "#/components/schemas/ResponseMeta"
                    - type: object
                      properties:
                        window:
                          type: object
                          description: The window actually served.
                          required:
                          - occurred_after
                          - occurred_before
                          properties:
                            occurred_after:
                              type: number
                              format: double
                              description: Unix timestamp, preserving fractional seconds.
                              example: 1704067200
                            occurred_before:
                              type: number
                              format: double
                              description: Unix timestamp, preserving fractional seconds.
                              example: 1704070800
                        interval_seconds:
                          type:
                          - integer
                          - 'null'
                          description: 'Spacing between bucket timestamps. Null when
                            the requested window falls entirely outside retention.

                            '
                          example: 60
                        retention_truncated:
                          type: boolean
                          description: Whether retention narrowed the requested window.
        '301':
          "$ref": "#/components/responses/MergedFault"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/AmbiguousAccount"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      security:
      - bearer_auth:
        - faults:read
