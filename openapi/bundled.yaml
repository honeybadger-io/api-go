    Alarm:
      type: object
      description: 'An Insights alarm: a BadgerQL query run on a schedule over a project''s
        streams, which notifies its integrations when the result crosses the trigger.

        '
      required:
      - id
      - project_id
      - name
      - description
      - state
      - query
      - stream_ids
      - evaluation_period
      - lookback_lag
      - trigger_config
      - error
      - last_checked_at
      - next_check_at
      - created_at
      - updated_at
      - links
      properties:
        id:
          readOnly: true
          type: string
          example: Qx7LmP2vRt9K
        project_id:
          readOnly: true
          type: string
          description: ID of the project this alarm belongs to
          example: Xk9mZp
        name:
          type: string
          description: Alarm name
          example: High Error Rate
        description:
          type:
          - string
          - 'null'
          description: Alarm description
          example: Fires when checkout errors spike
        state:
          readOnly: true
          type: string
          description: Current alarm state
          enum:
          - initial
          - alarm
          - ok
        query:
          type:
          - string
          - 'null'
          description: 'BadgerQL run on each check, as the text a create or update
            sent.

            '
          example: filter event_type::str == "notice" | stats count() as count
        stream_ids:
          uniqueItems: true
          type:
          - array
          - 'null'
          items:
            type: string
          description: Associated stream identifiers
        evaluation_period:
          type:
          - string
          - 'null'
          description: 'Window each evaluation covers, as a compact duration. The
            API rejects a spelled-out interval like `5 minutes`.

            '
          pattern: "^\\d+[smhdw]$"
          example: 10m
        lookback_lag:
          type:
          - string
          - 'null'
          description: 'How far behind now the window ends, allowing for ingestion
            delay. Same compact duration format as `evaluation_period`.

            '
          pattern: "^\\d+[smhdw]$"
          example: 1m
        trigger_config:
          description: 'What turns the alarm on; null if the stored alarm has none.
            Updates replace the whole object.

            '
          anyOf:
          - "$ref": "#/components/schemas/AlarmTriggerConfig"
          - type: 'null'
        error:
          readOnly: true
          type:
          - string
          - 'null'
          description: Error message if the alarm is in an error state
          example:
        last_checked_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the alarm was last evaluated
        next_check_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the alarm will next be evaluated
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the alarm was created
        updated_at:
          readOnly: true
          type: string
          format: date-time
          description: When the alarm was last updated
        links:
          "$ref": "#/components/schemas/WebLinks"
    AlarmCreateInput:
      type: object
      description: A new alarm
      required:
      - name
      - query
      - evaluation_period
      - lookback_lag
      - trigger_config
      additionalProperties: false
      properties:
        name:
          type: string
          description: Alarm name
          example: Error spike
        description:
          type:
          - string
          - 'null'
          description: What the alarm watches for, shown with it in Honeybadger. Null
            clears it.
        query:
          type: string
          description: BadgerQL evaluated on each check
          example: filter event_type::str == "notice" | stats count() as count
        stream_ids:
          type:
          - array
          - 'null'
          minItems: 1
          description: 'Streams the query runs against. A set: order is ignored, duplicates
            are dropped, and it can''t be empty. Left out or null, set to the project''s
            current streams.

            '
          items:
            type: string
        evaluation_period:
          type: string
          pattern: "^\\d+[smhd]$"
          description: Window each evaluation covers. At least 1m and less than a
            week (`w` units are refused).
          example: 10m
        lookback_lag:
          type: string
          pattern: "^\\d+[smhdw]$"
          description: How far behind now the window ends, allowing for ingestion
            delay
          example: 1m
        trigger_config:
          "$ref": "#/components/schemas/AlarmTriggerConfig"
    AlarmUpdateInput:
      type: object
      description: Writable alarm attributes
      additionalProperties: false
      properties:
        name:
          type: string
          description: Alarm name
        description:
          type:
          - string
          - 'null'
          description: What the alarm watches for, shown with it in Honeybadger. Null
            clears it.
        query:
          type: string
          description: BadgerQL query evaluated on each check
        stream_ids:
          type:
          - array
          - 'null'
          minItems: 1
          items:
            type: string
          description: 'Stream identifiers to query. A set; can''t be empty. Order
            is ignored and duplicates are dropped. Null resets it to every current
            stream in the project.

            '
        evaluation_period:
          type: string
          description: Window each evaluation covers, as a compact duration. At least
            1m and less than a week (`w` units are refused).
          pattern: "^\\d+[smhd]$"
          example: 10m
        lookback_lag:
          type: string
          description: How far behind now the window ends
          pattern: "^\\d+[smhdw]$"
          example: 1m
        trigger_config:
          "$ref": "#/components/schemas/AlarmTriggerConfig"
    AlarmTriggerConfig:
      type: object
      description: 'What turns the alarm on. Sent whole: on update, a `trigger_config`
        replaces the stored one rather than merging into it.

        '
      required:
      - type
      - config
      example:
        type: alert_result_count
        config:
          operator: gt
          value: 10
      properties:
        type:
          type: string
          enum:
          - alert_result_count
          description: "`alert_result_count` compares the number of results the query
            returns."
        config:
          "$ref": "#/components/schemas/AlarmTriggerCondition"
    AlarmHistoryEntry:
      type: object
      description: One alarm state change
      required:
      - id
      - alarm_id
      - alarm_version_id
      - status
      - created_at
      - evaluation_started_at
      - evaluation_result
      properties:
        id:
          type: string
          example: Hm4nR8sTq2Wz
        alarm_id:
          type: string
          description: The alarm's ID
          example: Qx7LmP2vRt9K
        alarm_version_id:
          type: string
          description: 'The version of the alarm that was evaluated. Editing an alarm
            creates a new version, and history spans every version.

            '
          example: Vn6pK3dLq9Xa
        status:
          type:
          - string
          - 'null'
          description: The state the alarm entered
          enum:
          - alarm
          - ok
          -
        created_at:
          type: string
          format: date-time
          description: When the change was recorded
        evaluation_started_at:
          type: string
          format: date-time
          description: Start of the window whose evaluation caused the change
        evaluation_result:
          type:
          - number
          - 'null'
          format: double
          description: The value the trigger compared against its threshold
          example: 42
    IntegrationFilter:
      type: object
      description: Only errors matching `query` notify for `event`.
      required:
      - event
      - query
      properties:
        event:
          "$ref": "#/components/schemas/IntegrationFilterEvent"
          description: An event name, or `all` for every event.
        query:
          type: string
          minLength: 1
          description: An error search query, as in the Errors search box.
          example: environment:production
    Integration:
      type: object
      description: A notification integration
      required:
      - id
      - project_id
      - type
      - active
      - rate
      - threshold
      - notification_limit
      - filters
      - links
      - events
      - site_ids
      - check_in_ids
      - excluded_environments
      - included_environments
      - alarm_alert_ids
      - alarm_ok_ids
      - created_at
      - config
      properties:
        id:
          readOnly: true
          type: string
          example: Ch9wLp
        project_id:
          readOnly: true
          type: string
          description: ID of the project this integration belongs to
          example: Xk9mZp
        type:
          type: string
          description: Integration type
          example: Slack
        active:
          type: boolean
          description: 'Whether to use the integration. An OAuth integration that
            isn''t `connected` sends nothing until it is.

            '
        events:
          uniqueItems: true
          type: array
          items:
            type: string
          description: Events this integration notifies on
          example:
          - occurred
          - resolved
          - assigned
        site_ids:
          uniqueItems: true
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: 'Sites whose up and down events this integration receives.
            null means every site in the project, including ones added later.

            '
          example:
        check_in_ids:
          uniqueItems: true
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Check-ins whose events this integration receives. null means
            every check-in in the project, including ones added later.

            '
          example:
        excluded_environments:
          uniqueItems: true
          type: array
          items:
            type: string
          description: Errors from these environments never notify through this integration.
            Takes precedence over `included_environments`.
          example:
          - development
        included_environments:
          uniqueItems: true
          type: array
          items:
            type: string
          description: When non-empty, only errors from these environments notify
            through this integration.
          example: []
        filters:
          type: array
          description: 'An ordered list. Each event that has a filter notifies only
            for errors matching its query.

            '
          items:
            "$ref": "#/components/schemas/IntegrationFilter"
          example:
          - event: occurred
            query: environment:production
        alarm_alert_ids:
          uniqueItems: true
          type: array
          items:
            type: string
          description: IDs of alarms whose alert events this integration receives
          example: []
        alarm_ok_ids:
          uniqueItems: true
          type: array
          items:
            type: string
          description: IDs of alarms whose recovery events this integration receives
          example: []
        threshold:
          type: integer
          description: Occurrence threshold before `rate_exceeded` fires
          example: 100
        rate:
          "$ref": "#/components/schemas/IntegrationRate"
        notification_limit:
          type:
          - integer
          - 'null'
          description: Maximum notifications in a 10-minute window before flood control
          example:
        connected:
          readOnly: true
          type: boolean
          description: 'Present on OAuth integrations (Slack, GitHub, GitLab, Bitbucket,
            Jira Cloud, Asana, Intercom and the like) and WebSocket integrations.
            On an OAuth integration it says whether the integration is authenticated,
            which someone does in the web UI at `links.web`. Separate from `active`:
            an active integration that isn''t connected sends nothing until it is,
            and connecting doesn''t change `active`. GitHub authenticates through
            the GitHub App: the app is installed on the repo, and the installation
            is attached when someone with access to it saves the integration. A creator
            who signed in to Honeybadger with GitHub is connected on create. On a
            WebSocket integration it says whether a client checked in within the last
            two minutes.

            '
        config:
          type: object
          additionalProperties: true
          description: 'The type''s settings, one IntegrationConfig<Type> per `type`.
            Unset settings are null. Write-only secrets are never returned. Other
            settings are, including webhook URLs, which can contain credentials.

            '
        error:
          readOnly: true
          type: boolean
          description: 'Set when a delivery fails in a way that stops the integration;
            `error_reason` says why. The integration sends nothing while it''s set.
            A successful update clears it.

            '
        error_reason:
          readOnly: true
          type: string
          description: Reason for the error state, if any
          example: The webhook URL returned 410 Gone
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the integration was created
        links:
          "$ref": "#/components/schemas/WebLinks"
      allOf:
      - if:
          properties:
            type:
              const: Campfire
          required:
          - type
        then:
          properties:
