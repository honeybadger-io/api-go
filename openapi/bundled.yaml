paths:
  "/token":
    get:
      operationId: getToken
      summary: Get the current token
      description: |
        Returns the credential making the request and what it can reach. It needs no scope.

        `project_ids` lists the projects the token can reach now; a user token loses a project as soon as its owner does.
      tags:
      - Tokens
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - user
                        - account
                        - oauth
                        description: "`user` and `account` are scoped API tokens.
                          `oauth` is an access token issued to an application acting
                          for a user.\n"
                      name:
                        type:
                        - string
                        - 'null'
                        description: 'The token''s name. For an OAuth grant, the name
                          the user gave the connection, or the application''s name
                          if none.

                          '
                        example: CI deploys
                      scopes:
                        type: array
                        items:
                          type: string
                        description: 'Granular permissions. For an OAuth grant these
                          are its legacy `read`/`write` aliases expanded to the API
                          surface as it stood when the grant was consented to.

                          '
                        example:
                        - faults:read
                        - faults:write
                      account_id:
                        type: string
                        description: ID of the account the credential is bound to.
                        example: Ab3kL9
                      project_ids:
                        type: array
                        items:
                          type: string
                        description: 'IDs of the projects the credential can reach.
                          Empty for a credential bound to an account with no visible
                          projects; every project in the account when unrestricted.

                          '
                      expires_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                      last_used_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: 'When the credential was last used before this
                          request. Recorded at most once a minute, so it can lag by
                          up to a minute; null on first use.

                          '
                  meta:
                    "$ref": "#/components/schemas/ResponseMeta"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/openapi.json":
    get:
      operationId: getOpenapiJson
      summary: Get the OpenAPI spec (JSON)
      description: 'Returns the OpenAPI spec for this API. It needs no scope. Send
        the `ETag` back as `If-None-Match` to skip downloading an unchanged spec.

        '
