    CheckIn:
      type: object
      description: 'A check-in monitor for a scheduled job. The job requests the check-in''s
        report URL each time it runs, and Honeybadger alerts when a report doesn''t
        arrive on schedule.

        '
      required:
      - id
      - project_id
      - schedule_type
      - links
      - name
      - slug
      - state
      - reported_at
      - expected_at
      - missed_count
      - grace_period
      - report_url
      - cron_timezone
      - created_at
      properties:
        id:
          readOnly: true
          type: string
          example: Ci5xWq
        project_id:
          readOnly: true
          type: string
          description: ID of the project this check-in belongs to
          example: Xk9mZp
        name:
          type:
          - string
          - 'null'
          description: Display name
          example: Daily Backup
        slug:
          type:
          - string
          - 'null'
          description: URL-safe identifier
          example: daily-backup
        schedule_type:
          "$ref": "#/components/schemas/CheckInScheduleType"
        state:
          readOnly: true
          type: string
          description: Current check-in state
          enum:
          - pending
          - reporting
          - missing
          - paused
        reported_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the last report was received
        expected_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the next report is expected
        missed_count:
          readOnly: true
          type: integer
          description: Number of consecutive missed reports
          example: 0
        grace_period:
          type: string
          pattern: "^(\\d+ (second|minute|hour|day|week|month|year)s?)( \\d+ (second|minute|hour|day|week|month|year)s?)*$|^\\d\\d:\\d\\d:\\d\\d$"
          description: 'How long after the expected time before the check-in is missing.
            A duration such as `5 minutes`, `1 hour 30 minutes` or `01:30:00`. Returned
            in long form: `1 week` comes back as `7 days`, and zero as `00:00:00`.

            '
          example: 10 minutes
        report_url:
          readOnly: true
          type: string
          description: URL to ping when the task completes
          example: https://api.honeybadger.io/v1/check_in/Ci5xWq
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the check-in was created
        cron_schedule:
          type:
          - string
          - 'null'
          description: Cron expression (for cron schedule type)
          example: 0 2 * * *
        cron_timezone:
          type: string
          description: Timezone for cron schedule, as the web app names time zones.
            `UTC` on a simple check-in.
          example: Eastern Time (US & Canada)
        report_period:
          type:
          - string
          - 'null'
          description: 'How often a report is expected, for `simple` schedules. Same
            format as `grace_period`. Null for `cron` schedules, which use `cron_schedule`.

            '
          example: 1 day
        links:
          "$ref": "#/components/schemas/WebLinks"
    CheckInReplaceInput:
      type: object
      description: 'The project''s complete set of check-ins. Any check-in the project
        has that this list doesn''t name is deleted. Must be non-empty, and every
        entry needs a slug.

        '
      required:
      - check_ins
      properties:
        check_ins:
          type: array
          minItems: 1
          example:
          - name: Nightly billing job
            slug: nightly-billing
            schedule_type: simple
            report_period: 1 day
            grace_period: 15 minutes
          items:
            "$ref": "#/components/schemas/CheckInReplaceEntry"
    CheckInReplaceEntry:
      description: 'One check-in in a replace request, matched to an existing check-in
        by slug. A match is updated, and an unmatched slug creates a new check-in.

        '
      allOf:
      - "$ref": "#/components/schemas/CheckInInput"
      - type: object
        required:
        - slug
        properties:
          slug:
            type: string
            pattern: "\\S"
            description: Identifies which check-in an entry refers to, so it is required
              here
    CheckInScheduleType:
      type: string
      enum:
      - simple
      - cron
      default: simple
      description: "`simple` expects a report every `report_period`. `cron` expects
        reports on a cron schedule and requires `cron_schedule`.\n"
    FaultMerge:
      type: object
      description: A queued merge
      required:
      - batch_id
      - source_id
      - target_id
      properties:
        batch_id:
          type: string
          description: Identifies the background merge
          example: WksB67FpRY3bZQ
        source_id:
          type: string
          description: ID of the fault being merged, from the path.
          example: '12345'
        target_id:
          type: string
          description: ID of the fault kept
          example: '67890'
    FaultMergeInput:
      type: object
      description: Names the fault to merge into
      required:
      - target_fault_id
      additionalProperties: false
      properties:
        target_fault_id:
          type: string
          description: 'ID of the fault to keep. The fault in the path is merged into
            it.

            '
          example: '12345'
    AlarmTriggerCondition:
      type: object
      description: The comparison against the query's result that fires the trigger
      required:
      - operator
      - value
      properties:
        operator:
          type: string
          enum:
          - gt
          - gte
          - lt
          - lte
          - eq
          - neq
          description: 'How the query''s result is compared with `value`: greater
            than, greater than or equal, less than, less than or equal, equal, or
            not equal.

            '
          example: gt
        value:
          type: number
          format: double
          description: Threshold to compare against. `alert_result_count` takes a
            whole number >= 0.
          example: 10
    PauseDuration:
      type: string
      enum:
      - hour
      - day
      - week
      description: A duration of an hour, a day or a week.
    CheckInEvent:
      type: object
      description: A check-in event
      required:
      - check_in_id
      - state
      - created_at
      properties:
        check_in_id:
          type: string
          description: ID of the check-in
          example: Ci5xWq
        state:
          type: string
          enum:
          - reporting
          - missing
          - paused
          description: The state the check-in entered
          example: reporting
        created_at:
          type: string
          format: date-time
          description: When the event occurred
        payload:
          type:
          - string
          - 'null'
          description: The payload reported with the check-in, as it was sent. Only
            retained on plans with advanced check-ins.
          example:
    CheckInCreateInput:
      description: Attributes for creating a check-in.
      allOf:
      - "$ref": "#/components/schemas/CheckInInput"
    CheckInInput:
      type: object
      description: 'Writable check-in attributes. Read-only fields are ignored.

        '
      properties:
        name:
          type:
          - string
          - 'null'
          description: Display name. Null clears it; an unnamed check-in shows its
            ID.
          example: Nightly billing job
        slug:
          type:
          - string
          - 'null'
          description: 'Short identifier used in the check-in''s reporting URL. Null
            clears it. Renaming it breaks jobs reporting to `…/check_in/<ingestion
            key>/<slug>` and changes how `PUT /check_ins` matches this check-in.

            '
          example: nightly-billing
        schedule_type:
          description: 'Switching to `simple` clears `cron_schedule` and resets `cron_timezone`
            to `UTC`; switching to `cron` clears `report_period`.

            '
          allOf:
          - "$ref": "#/components/schemas/CheckInScheduleType"
        report_period:
          type:
          - string
          - 'null'
          pattern: "^(\\d+ (second|minute|hour|day|week|month|year)s?)( \\d+ (second|minute|hour|day|week|month|year)s?)*$|^\\d\\d:\\d\\d:\\d\\d$"
          description: 'How often a report is expected, for `simple` schedules. Required
            unless `schedule_type` is `cron`, and may not be zero. A duration such
            as `5 minutes`, `1 hour 30 minutes` or `01:30:00`. Returned in long form:
            `1 week` comes back as `7 days`.

            '
          example: 1 day
        grace_period:
          type:
          - string
          - 'null'
          default: '00:00:00'
          pattern: "^(\\d+ (second|minute|hour|day|week|month|year)s?)( \\d+ (second|minute|hour|day|week|month|year)s?)*$|^\\d\\d:\\d\\d:\\d\\d$"
          description: 'How long after the expected time before the check-in is considered
            missing. Same format as `report_period`; zero is `00:00:00`. Null resets
            it to zero.

            '
          example: 10 minutes
        cron_schedule:
          type:
          - string
          - 'null'
          description: Cron expression, required when `schedule_type` is `cron`.
          example: 0 3 * * *
        cron_timezone:
          type:
          - string
          - 'null'
          default: UTC
          description: 'Timezone the cron schedule is evaluated in. A time zone name
            as the web app lists them, not an IANA identifier — `Central Time (US
            & Canada)`, not `America/Chicago`, which is rejected. Required when `schedule_type`
            is `cron`. Null resets it to `UTC`.

            '
          example: Central Time (US & Canada)
    Comment:
      type: object
      description: A comment on a fault
      required:
      - id
