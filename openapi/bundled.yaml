  "/projects/{project_id}/streams":
    get:
      operationId: listStreams
      summary: List event streams
      description: |
        Returns the project's Insights event streams. A project is provisioned with a `default` stream carrying events your applications send and an `internal` stream carrying events Honeybadger generates about the project — errors, deploys, uptime checks and check-ins.

        Provisioning is asynchronous, so a just-created project may return an empty or partial list for a short time. Retry before concluding that a stream is missing.

        Listing streams is a prerequisite for querying: a query against an unselected stream returns nothing, which is indistinguishable from the events not existing.
      tags:
      - Streams
      parameters:
      - "$ref": "#/components/parameters/ProjectId"
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/PerPage"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Stream"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
                  links:
                    "$ref": "#/components/schemas/OffsetLinks"
                  meta:
                    "$ref": "#/components/schemas/ResponseMeta"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/AmbiguousAccount"
        '429':
          "$ref": "#/components/responses/RateLimitExceeded"
      security:
      - bearer_auth:
        - insights:read
  "/projects/{project_id}/insights/queries":
    post:
      operationId: runInsightsQuery
      summary: Run an Insights query
      description: |
        Executes a BadgerQL query against the project's event streams and returns the result. A POST because the query goes in the body, but it only reads — nothing is created.

        Selecting streams is part of the request, not the query: pass `stream_ids`, or omit it to search every stream on the project. An event class that lives on an unselected stream returns no rows, which looks exactly like the events not existing — so list the project's streams first. Unlike v2, an id that does not belong to the project is rejected rather than silently dropped, so a partial result can never be mistaken for a complete one.

        See the BadgerQL reference for the query language.
      tags:
      - Insights
      parameters:
      - "$ref": "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              additionalProperties: false
              properties:
                query:
                  type: string
                  description: BadgerQL query
                  example: "@size > 0 | limit 10"
                stream_ids:
                  type: array
                  description: 'Streams to search. Omit it, or pass an empty array,
                    to search every stream on the project. Every id must belong to
                    this project; repeated ids are deduplicated. A value that is not
                    an array of strings is rejected with 422.

                    '
                  items:
                    type: string
                ts:
                  type: string
                  description: Time range for the query
                  example: 1h
                timezone:
                  type: string
                  description: Timezone for time bucketing and display
                  example: UTC
      responses:
        '200':
          description: |
            The query result. Its shape is defined by the Insights query service rather than by this API, and varies with the query — an aggregation returns different fields from an event listing. It is passed through unchanged, so this schema deliberately does not pin it.

            `links.web` re-runs this query in the Honeybadger web UI. It carries the request's `ts` and `stream_ids` when sent, and its `timezone` (UTC when none was sent). Present even when `data` carries an `error` from a query that failed while running.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - links
                properties:
                  data:
                    type: object
                    description: Query result, as returned by the query service
                    additionalProperties: true
                  links:
                    "$ref": "#/components/schemas/WebLinks"
                  meta:
                    "$ref": "#/components/schemas/ResponseMeta"
        '422':
          description: 'The query was rejected. For a syntax or semantic error, `error.message`
            is the query service''s own message, since it is more specific than anything
            this API could substitute, and the service may supply additional keys
            alongside it. Also returned when `query` is missing or not a string, when
            `stream_ids` is not an array of strings, or when a stream id does not
            belong to the project.

            '
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Error"
                - type: object
                  properties:
                    error:
                      type: object
                      additionalProperties: true
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimitExceeded"
        '503':
          description: The query service was unreachable or failed. Retry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
      - bearer_auth:
        - insights:read
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: |
        Either credential v3 accepts, as a Bearer token: a scoped API token (prefixed `hbt_` for a personal one, `hba_` for an account one), or an OAuth access token issued to an application acting on a user's behalf.
        Both are authorized the same way. An API token carries granular permissions directly, and each is checked on its own: a `:write` permission does not imply the matching `:read`, so a token holding `faults:write` alone cannot list or fetch faults.

        An OAuth grant carries `read` or `write`, which expand to a fixed list of permissions that never grows, so a grant never gains a capability added to the API afterwards:

        - `read`: `faults:read`, `insights:read`, `dashboards:read`,
          `alarms:read`, `deploys:read`, `checkins:read`, `uptime:read`,
          `projects:read`, `integrations:read`, `status_pages:read`,
          `team:read`, `account:read`

        - `write`: everything in `read`, plus `faults:write`,
          `dashboards:write`, `alarms:write`, `deploys:write`,
          `checkins:write`, `uptime:write`, `projects:write`,
          `projects:create`, `integrations:write`, `status_pages:write`,
          `team:write`


        Neither covers `incidents:read` or `incidents:write`; use an API token for status page incidents.
        Bearer is the only accepted scheme. Unlike v2, v3 refuses HTTP basic (the token as username with a blank password, which is what `curl -u` sends) and refuses a credential in the `auth_token` query parameter.
  schemas:
    Account:
      type: object
      description: A Honeybadger account
      required:
      - id
      - active
      - links
      - name
      - email
      - parked
      - created_at
      properties:
        id:
          type: string
          description: Unique identifier
          example: Ab3kL9
        name:
          type:
          - string
          - 'null'
          description: Account name
          example: Acme Corp
        email:
          type:
          - string
          - 'null'
          format: email
          description: Primary account email
          example: billing@acme.com
        active:
          type: boolean
          description: Whether the account is active
        parked:
          type: boolean
          description: Whether the account is parked (temporarily inactive)
        created_at:
          type: string
          format: date-time
          description: When the account was created
        links:
          "$ref": "#/components/schemas/WebLinks"
    AccountInvitation:
      type: object
      description: An invitation to join an account
      required:
      - id
      - account_id
      - email
      properties:
        id:
          type: string
          description: Unique identifier
          example: Ai9nRx
        account_id:
          type: string
          description: ID of the account
          example: Ab3kL9
        email:
          type: string
          description: Email address of the invitee
          example: newmember@example.com
        role:
          type:
          - string
          - 'null'
          description: Role granted upon acceptance
          enum:
          - Owner
          - Admin
          - Billing
          - Member
          -
          example: Member
        created_at:
          type: string
          format: date-time
          description: When the invitation was created
        accepted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the invitation was accepted
        created_by:
          type:
          - object
          - 'null'
          description: User who created the invitation
          properties:
            id:
              type: string
              description: ID of the user
            name:
              type:
              - string
              - 'null'
              description: User name
            email:
              type: string
              description: User email
        accepted_by:
          type:
          - object
          - 'null'
          description: User who accepted the invitation
          properties:
            id:
              type: string
              description: ID of the user
            name:
              type:
              - string
              - 'null'
              description: User name
            email:
              type: string
              description: User email
    AccountInvitationCreateInput:
      description: Attributes for creating a account-invitation.
      allOf:
      - "$ref": "#/components/schemas/AccountInvitationInput"
      - required:
        - email
    AccountInvitationInput:
      type: object
      description: Writable account-invitation attributes
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - Owner
          - Admin
          - Member
        disable_email_notifications:
          type: boolean
          description: Create the member with email notifications off
        team_ids:
          type:
          - array
          - 'null'
          description: 'IDs of teams to add the invitee to. An ID that isn''t a team
            on this account fails the request with 422.

            '
          items:
            type: string
    AffectedUser:
      type: object
      description: A user affected by a fault, and how many times
      required:
      - user
      - count
      properties:
        user:
          type: string
          description: 'The affected user as the reporting client identified them.
            Opaque: not a Honeybadger user id, and not necessarily an email.

            '
          example: jane@example.com
        count:
          type: integer
          description: How many times this user was seen on the fault
          example: 12
    AccountMember:
      type: object
      description: A member of an account
      required:
      - id
      - account_id
      - user_id
      - role
      - email
      properties:
        id:
          type: string
          description: Unique identifier
          example: Am4wLq
        account_id:
          type: string
          description: ID of the account
          example: Ab3kL9
        user_id:
          type: string
          description: ID of the user
          example: Uz4wKm
        role:
          type: string
          description: Member role in the account
          enum:
          - Owner
          - Admin
          - Member
          example: Admin
        email:
          type: string
          description: Member email address
          example: jane@example.com
        name:
          type:
          - string
          - 'null'
          description: Member display name
          example: Jane Smith
        created_at:
          type: string
          format: date-time
          description: When the member was added to the account
    AccountMemberInput:
      type: object
      description: Writable account-member attributes
      required:
      - role
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
          - Owner
          - Admin
          - Member
    Alarm:
      type: object
      description: 'An Insights alarm. Read from Honeybadger''s copy of the alarm,
        written after each change; an edit made directly in the alarm service doesn''t
        show here.

        '
      required:
      - id
      - project_id
      - name
      - description
      - state
      - query
      - stream_ids
      - evaluation_period
      - lookback_lag
      - trigger_config
      - error
      - last_checked_at
      - next_check_at
      - created_at
      - updated_at
      - links
      properties:
        id:
          readOnly: true
          type: string
          description: Alarm identifier (opticon observer root ID)
          example: obs_abc123
        project_id:
          readOnly: true
          type: string
          description: ID of the project this alarm belongs to
          example: Xk9mZp
        name:
          type: string
          description: Alarm name
          example: High Error Rate
        description:
          type:
          - string
          - 'null'
          description: Alarm description
        state:
          readOnly: true
          type: string
          description: Current alarm state
          enum:
          - initial
          - alarm
          - ok
        query:
          type:
          - string
          - 'null'
          description: 'BadgerQL evaluated on each check. A string, the same shape
            AlarmCreateInput accepts — the presenter renders the observer''s stored
            query text, not a structured object.

            '
          example: filter event_type::str == "notice" | stats count() as count
        stream_ids:
          uniqueItems: true
          type:
          - array
          - 'null'
          items:
            type: string
          description: Associated stream identifiers
        evaluation_period:
          type:
          - string
          - 'null'
          description: 'Window each evaluation covers, as a compact duration. The
            API rejects a spelled-out interval like `5 minutes`.

            '
          pattern: "^\\d+[smhdw]$"
          example: 10m
        lookback_lag:
          type:
          - string
          - 'null'
          description: 'How far behind now the window ends, allowing for ingestion
            delay. Same compact duration format as evaluation_period.

            '
          pattern: "^\\d+[smhdw]$"
          example: 1m
        trigger_config:
          description: 'What turns the alarm on; null if the stored alarm has none.
            Updates replace the whole object.

            '
          anyOf:
          - "$ref": "#/components/schemas/AlarmTriggerConfig"
          - type: 'null'
        error:
          readOnly: true
          type:
          - string
          - 'null'
          description: Error message if the alarm is in an error state
        last_checked_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the alarm was last evaluated
        next_check_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the alarm will next be evaluated
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the alarm was created
        updated_at:
          readOnly: true
          type: string
          format: date-time
          description: When the alarm was last updated
        links:
          "$ref": "#/components/schemas/WebLinks"
    AlarmCreateInput:
      type: object
      description: An alarm and the observer that evaluates it
      required:
      - name
      - query
      - evaluation_period
      - lookback_lag
      - trigger_config
      additionalProperties: false
      properties:
        name:
          type: string
          description: Alarm name
          example: Error spike
        description:
          type:
          - string
          - 'null'
          description: What the alarm watches for, shown with it in Honeybadger. Send
            null to clear.
        query:
          type: string
          description: BadgerQL evaluated on each check
          example: filter event_type::str == "notice" | stats count() as count
        stream_ids:
          type: array
          minItems: 1
          description: 'Streams the query runs against. A set: order is ignored, duplicates
            are dropped, and it can''t be empty. Left out, every current stream in
            the project, which a read then lists. An ID that isn''t one of the project''s
            streams fails the request with 422.

            '
          items:
            type: string
        evaluation_period:
          type: string
          pattern: "^\\d+[smhd]$"
          description: Window each evaluation covers. At least 1m and less than a
            week (`w` units are refused).
          example: 10m
        lookback_lag:
          type: string
          pattern: "^\\d+[smhdw]$"
          description: How far behind now the window ends, allowing for ingestion
            delay
          example: 1m
        trigger_config:
          "$ref": "#/components/schemas/AlarmTriggerConfig"
    AlarmUpdateInput:
      type: object
      description: Writable alarm attributes
      additionalProperties: false
      properties:
        name:
          type: string
          description: Alarm name
        description:
          type:
          - string
          - 'null'
          description: What the alarm watches for, shown with it in Honeybadger. Send
            null to clear.
        query:
          type: string
          description: BadgerQL query evaluated on each check
        stream_ids:
          type:
          - array
          - 'null'
          minItems: 1
          items:
            type: string
          description: 'Stream identifiers to query. A set; can''t be empty. Order
            is ignored and duplicates are dropped. Send null to reset to every current
            stream in the project.

            '
        evaluation_period:
          type: string
          description: Window each evaluation covers, as a compact duration. At least
            1m and less than a week (`w` units are refused).
          pattern: "^\\d+[smhd]$"
          example: 10m
        lookback_lag:
          type: string
          description: How far behind now the window ends
          pattern: "^\\d+[smhdw]$"
          example: 1m
        trigger_config:
          "$ref": "#/components/schemas/AlarmTriggerConfig"
    AlarmTriggerConfig:
      type: object
      description: 'What turns the alarm on. Sent whole: on update, a `trigger_config`
        replaces the stored one rather than merging into it.

        '
      required:
      - type
      - config
      properties:
        type:
          type: string
          enum:
          - alert_result_count
          description: "`alert_result_count` compares the number of results the query
            returns."
        config:
          "$ref": "#/components/schemas/AlarmTriggerCondition"
    AlarmHistoryEntry:
      type: object
      description: One alarm state change, as recorded by the Insights backend
      required:
      - id
      - observer_root_id
      - observer_id
      - status
      - created_at
      - evaluation_started_at
      - evaluation_result
      properties:
        id:
          type: string
          description: Trigger identifier
        observer_root_id:
          type: string
          description: The alarm's ID
          example: obs_abc123
        observer_id:
          type: string
          description: 'The version of the alarm that was evaluated. Editing an alarm
            creates a new version, and history spans every version.

            '
        status:
          type:
          - string
          - 'null'
          description: The state the alarm entered
          enum:
          - alarm
          - ok
          -
        created_at:
          type: string
          format: date-time
          description: When the change was recorded
        evaluation_started_at:
          type: string
          format: date-time
          description: Start of the window whose evaluation caused the change
        evaluation_result:
          type:
          - number
          - 'null'
          format: double
          description: The value the trigger compared against its threshold
          example: 42
    IntegrationFilter:
      type: object
      description: Only errors matching `query` notify for `event`.
      required:
      - event
      - query
      properties:
        event:
          "$ref": "#/components/schemas/IntegrationFilterEvent"
          description: An event name, or `all` for every event.
        query:
          type: string
          minLength: 1
          description: An error search query, as in the Errors search box.
          example: environment:production
    Integration:
      type: object
      description: A notification integration
      required:
      - id
      - project_id
      - type
      - active
      - rate
      - threshold
      - notification_limit
      - all_sites
      - all_check_ins
      - filters
      - links
      - events
      - site_ids
      - check_in_ids
      - excluded_environments
      - included_environments
      - alarm_alert_ids
      - alarm_ok_ids
      - created_at
      - config
      properties:
        id:
          readOnly: true
          type: string
          description: Unique identifier
          example: Ch9wLp
        project_id:
          readOnly: true
          type: string
          description: ID of the project this channel belongs to
          example: Xk9mZp
        type:
          type: string
          description: Integration type
          example: Slack
        active:
          type: boolean
          description: 'Whether to use the integration. An OAuth integration that
            isn''t `connected` sends nothing until it is.

            '
        events:
          uniqueItems: true
          type: array
          items:
            type: string
          description: Event types this channel listens for
        all_sites:
          type: boolean
          description: 'Whether the integration follows every site in the project,
            including ones added later. When true, site_ids is [].

            '
        all_check_ins:
          type: boolean
          description: 'Whether the integration follows every check-in in the project,
            including ones added later. When true, check_in_ids is [].

            '
        site_ids:
          uniqueItems: true
          type: array
          items:
            type: string
            format: uuid
          description: Identifiers of sites this channel monitors
        check_in_ids:
          uniqueItems: true
          type: array
          items:
            type: string
          description: IDs of check-ins this channel monitors
        excluded_environments:
          uniqueItems: true
          type: array
          items:
            type: string
          description: Errors from these environments never notify through this integration.
            Takes precedence over included_environments.
        included_environments:
          uniqueItems: true
          type: array
          items:
            type: string
          description: When non-empty, only errors from these environments notify
            through this integration.
        filters:
          type: array
          description: 'An ordered list. Each event that has a filter notifies only
            for errors matching its query.

            '
          items:
            "$ref": "#/components/schemas/IntegrationFilter"
        alarm_alert_ids:
          uniqueItems: true
          type: array
          items:
            type: string
          description: IDs of alarms whose alert events this integration receives
        alarm_ok_ids:
          uniqueItems: true
          type: array
          items:
            type: string
          description: IDs of alarms whose recovery events this integration receives
        threshold:
          type: integer
          description: Occurrence threshold before rate_exceeded fires
        rate:
          type: string
          description: Rate period for rate_exceeded (e.g. min, hour)
        notification_limit:
          type:
          - integer
          - 'null'
          description: Maximum notifications in a 10-minute window before flood control
        connected:
          readOnly: true
          type: boolean
          description: 'Present only on OAuth integrations (Slack, GitHub, GitLab,
            Bitbucket, Jira Cloud, Asana, Intercom and the like): whether the integration
            is authenticated, which someone does in the web UI at `links.web`. Separate
            from `active`: an active integration that isn''t connected sends nothing
            until it is, and connecting doesn''t change `active`. GitHub authenticates
            through the GitHub App: the app is installed on the repo, and the installation
            is attached when someone with access to it saves the integration. A creator
            who signed in to Honeybadger with GitHub is connected on create.

            '
        config:
          type: object
          additionalProperties: true
          description: 'The type''s settings, one IntegrationConfig<Type> per `type`.
            Unset settings are null. Write-only secrets are never returned; everything
            else, webhook URLs included, comes back as stored.

            '
        error:
          readOnly: true
          type: boolean
          description: Whether the channel is in an error state
        error_reason:
          readOnly: true
          type: string
          description: Reason for the error state, if any
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the channel was created
        links:
          "$ref": "#/components/schemas/WebLinks"
      allOf:
