    IntegrationUpdateInput:
      type: object
      description: 'Fields to change on an integration. Omitted fields are left as
        they are. `type` can''t be changed. Read-only fields are ignored. Type-specific
        settings go under `config`, listed per type in [Integration types](https://docs.honeybadger.io/api/v3/integrations/types/).

        '
      properties:
        active:
          type: boolean
          description: 'Whether to use the integration. An OAuth integration that''s
            active sends nothing until someone connects it in the web UI at `links.web`.

            '
        events:
          type:
          - array
          - 'null'
          description: 'Events this integration notifies on. On create, defaults to
            the type''s default events. Null resets it to the type''s defaults. A
            set; order is ignored and duplicates are dropped. `up` and `down` need
            uptime monitoring, `rate_exceeded` escalation, and `volume_spike` anomaly
            detection on the plan; the defaults leave them out on plans without them.

            '
          items:
            "$ref": "#/components/schemas/IntegrationEvent"
        rate:
          default: wday
          description: Period the `rate_exceeded` threshold counts over. Null resets
            it to `wday`.
          anyOf:
          - "$ref": "#/components/schemas/IntegrationRate"
          - type: 'null'
        threshold:
          type:
          - integer
          - 'null'
          default: 100
          description: Number of occurrences before `rate_exceeded` fires. Null resets
            it to 100.
        notification_limit:
          type:
          - integer
          - 'null'
          description: Maximum notifications in a 10-minute window before flood control.
            Null removes the limit.
        site_ids:
          type:
          - array
          - 'null'
          description: 'Sites whose up and down events this integration receives.
            null follows every site in the project, including ones added later; a
            create that leaves it out does the same. [] follows none, and a list follows
            just those sites. A set; order is ignored and duplicates are dropped.

            '
          items:
            type: string
            format: uuid
        check_in_ids:
          type:
          - array
          - 'null'
          description: 'Check-ins whose events this integration receives. null follows
            every check-in in the project, including ones added later; a create that
            leaves it out does the same. [] follows none, and a list follows just
            those check-ins. A set; order is ignored and duplicates are dropped.

            '
          items:
            type: string
        alarm_alert_ids:
          type:
          - array
          - 'null'
          description: IDs of alarms whose alert events this integration receives.
            Null or empty clears it. A set; order is ignored and duplicates are dropped.
          items:
            type: string
        alarm_ok_ids:
          type:
          - array
          - 'null'
          description: IDs of alarms whose recovery events this integration receives.
            Null or empty clears it. A set; order is ignored and duplicates are dropped.
          items:
            type: string
        excluded_environments:
          type:
          - array
          - 'null'
          description: 'Errors from these environments never notify through this integration.
            Takes precedence over `included_environments`. An environment can be excluded
            before it first reports. Null or empty clears it. Changing it requires
            environment settings on the plan. A set; order is ignored and duplicates
            are dropped.

            '
          items:
            type: string
        included_environments:
          type:
          - array
          - 'null'
          description: 'When non-empty, only errors from these environments notify
            through this integration, including environments that haven''t reported
            yet. Empty means every environment not excluded. Null or empty clears
            it. Changing it requires environment settings on the plan. A set; order
            is ignored and duplicates are dropped.

            '
          items:
            type: string
        filters:
          type:
          - array
          - 'null'
          description: 'An ordered list. Each event that has a filter notifies only
            for errors matching its query. Replaces the stored filters; null or empty
            clears them. Changing it requires integration filters on the plan.

            '
          items:
            "$ref": "#/components/schemas/IntegrationFilter"
        config:
          type: object
          additionalProperties: true
          description: 'Type-specific settings, listed per type in [Integration types](https://docs.honeybadger.io/api/v3/integrations/types/).
            Merged into the stored settings: a key left out keeps its value; a key
            sent as null is cleared, or reset to its default. Secrets are never returned;
            leave them out to keep them.

            '
    IntegrationCreateInput:
      type: object
      description: 'A new integration. `type` picks the integration, and `config`
        holds that type''s settings. OAuth integrations (Slack, GitHub and the like)
        are created active by default and send nothing until someone connects them
        in the web UI at `links.web`. Some required settings are IDs from the other
        service, such as a Linear team or a Trello board.

