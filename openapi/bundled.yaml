components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: |
        A Bearer token: an API token (`hbu_` personal, `hba_` account) or an
        OAuth access token.

        Each scope is checked on its own: `faults:write` doesn't include
        `faults:read`.

        An account token can't hold `account:write`, and its `team:write`
        covers teams only. Managing account and team members and invitations
        takes a personal token or an OAuth `write` grant.

        An OAuth grant is `read` or `write`, each a fixed list of scopes:

        - `read`: `faults:read`, `insights:read`, `dashboards:read`,
          `alarms:read`, `deploys:read`, `checkins:read`, `uptime:read`,
          `projects:read`, `integrations:read`, `status_pages:read`,
          `team:read`, `account:read`
        - `write`: everything in `read`, plus `faults:write`,
          `dashboards:write`, `alarms:write`, `deploys:write`,
          `checkins:write`, `uptime:write`, `projects:write`,
          `projects:create`, `integrations:write`, `status_pages:write`,
          `team:write`

        Neither includes `incidents:read` or `incidents:write`; status page
        incidents need an API token.

        HTTP basic auth and the `auth_token` query parameter are refused.
  schemas:
    Account:
      type: object
      description: A Honeybadger account
      required:
      - id
      - active
      - links
      - name
      - email
      - parked
      - created_at
      properties:
        id:
          type: string
          example: Ab3kL9
        name:
          type:
          - string
          - 'null'
          description: Account name
          example: Acme Corp
        email:
          type:
          - string
          - 'null'
          format: email
          description: Primary account email
          example: billing@acme.com
        active:
          type: boolean
          description: Whether the account is active
        parked:
          type: boolean
          description: Whether the account is parked (temporarily inactive)
        created_at:
          type: string
          format: date-time
          description: When the account was created
        links:
