          - string
          - 'null'
          title: Tags
          description: Comma-separated list of tags.
        title_format:
          type:
          - string
          - 'null'
          default: "[[project]] Occurred: [class] ([fault_id])"
          title: Title format
          description: You can customize the ClickUp task name, or you can leave this
            blank for the default name. Please see [our documentation](https://docs.honeybadger.io/guides/integrations/#custom-formatters)
            for details.
          example: "[[project]] Occurred: [class] ([fault_id])"
        description_format:
          type:
          - string
          - 'null'
          default: |-
            [class]: [message]

            Backtrace:

            [backtrace]

            View full backtrace and more info at honeybadger.io: [url]
          title: Description format
          description: Description of each new ClickUp task. Placeholders such as
            `[class]`, `[message]` and `[fault_id]` are filled in; see [custom formatters](https://docs.honeybadger.io/guides/integrations/#custom-formatters).
          example: |
            [class]: [message]

            Backtrace:

            [backtrace]

            View full backtrace and more info at honeybadger.io: [url]
    IntegrationConfigClickUpChat:
