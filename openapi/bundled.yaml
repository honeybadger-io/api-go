          - default
          - internal
        internal:
          type: boolean
          description: 'True for the stream carrying Honeybadger-generated event types
            (`notice`, `deploy`, `uptime_check`, `check_in`). Those event classes
            are only queryable when this stream is selected.

            '
        project_id:
          type: string
          description: ID of the project this stream belongs to
          example: Xk9mZp
        created_at:
          type: string
          format: date-time
