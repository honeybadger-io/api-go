            https://chat.example.com). It must resolve to a public address. When set,
            it is used instead of the Zulip Cloud subdomain.
          example: https://chat.example.com
        channel:
          type:
          - string
          - 'null'
          title: Channel
          description: The Zulip channel notifications are posted to.
          example: alerts
        topic:
          type:
          - string
