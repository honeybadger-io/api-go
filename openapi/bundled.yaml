        created_at:
          type: string
          format: date-time
          description: When the check was performed
        duration:
          type:
          - integer
          - 'null'
          description: Response time in whole milliseconds
          example: 182
        location:
          description: Monitoring location that performed the check
          anyOf:
          - "$ref": "#/components/schemas/SiteLocation"
          - type: 'null'
        up:
          type:
          - boolean
          - 'null'
