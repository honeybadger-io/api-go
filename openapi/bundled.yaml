            "$ref": "#/components/schemas/WebhookV2BacktraceLine"
        web_environment:
          description: CGI-style request environment, as the notifier sent it.
        deploy:
          anyOf:
          - "$ref": "#/components/schemas/WebhookV2Deploy"
          - type: 'null'
        url:
          type: string
          format: uri
    WebhookV2Deploy:
      type: object
      description: A deploy.
      required:
      - environment
      - revision
      - repository
      - local_username
      - created_at
      - changelog
      - url
      properties:
        environment:
          type: string
          example: production
        revision:
          type:
          - string
          - 'null'
          example: 850510ab072102729e6967cf89f28b740c61311b
        repository:
          type:
          - string
          - 'null'
          example: git@github.com:acme/billing.git
        local_username:
          type:
          - string
          - 'null'
          example: deploy-bot
        created_at:
          type: string
          format: date-time
        changelog:
          type:
          - array
          - 'null'
          description: Commits in the deploy, as the deploy notification sent them.
          items: {}
        url:
          type: string
          format: uri
    WebhookV2Site:
      type: object
      description: The uptime site the event is about.
      required:
      - id
      - name
      - url
      - frequency
      - match_type
      - match
      - state
      - active
      - last_checked_at
      - retries
      - proxy
      - cert_will_expire_at
      - timeout
      - response_headers
      - details_url
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          description: The checked URL, as entered.
        frequency:
          type: integer
          description: Minutes between checks.
        match_type:
          type: string
          example: success
        match:
          type:
          - string
          - 'null'
        state:
          type: string
          enum:
          - pending
          - up
          - down
        active:
          type: boolean
        last_checked_at:
          type:
          - string
          - 'null'
          format: date-time
        retries:
          type:
          - integer
          - 'null'
        proxy:
          type: integer
        cert_will_expire_at:
          type:
          - string
          - 'null'
          format: date-time
        timeout:
          type:
          - integer
          - 'null'
        response_headers:
          type:
          - object
          - 'null'
          description: Headers the site is set to expect in each check's response.
        details_url:
          type: string
          format: uri
    WebhookV2Outage:
      type: object
      description: 'The site''s latest outage. Every field but `details_url` is null
        when the site has none on record.

        '
      required:
      - down_at
      - up_at
      - status
      - reason
      - headers
      - details_url
      properties:
        down_at:
          type:
          - string
          - 'null'
          format: date-time
        up_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Null while the site is still down.
        status:
          type:
          - integer
          - 'null'
          description: The HTTP status the failing check got.
          example: 503
        reason:
          type:
          - string
          - 'null'
        headers:
          type:
          - object
          - 'null'
          description: Headers from the failing check's response.
        details_url:
          type: string
          format: uri
    WebhookV2CheckIn:
      type: object
      description: The check-in the event is about.
      required:
      - id
      - name
      - slug
      - state
      - schedule_type
      - reported_at
      - expected_at
      - missed_count
      - grace_period
      - url
      - details_url
      properties:
        id:
          type: string
          example: NeI9K5
        name:
          type:
          - string
          - 'null'
        slug:
          type:
          - string
          - 'null'
        state:
          type: string
          enum:
          - pending
          - reporting
          - missing
          - paused
        schedule_type:
          type: string
          enum:
          - simple
          - cron
        reported_at:
          type:
          - string
          - 'null'
          format: date-time
        expected_at:
          type:
          - string
          - 'null'
          format: date-time
        missed_count:
          type: integer
        grace_period:
          type: string
          description: 'How late a report can be before the check-in is missing, as
            a duration such as `5 minutes`. Empty when there''s no grace period.

            '
        report_period:
          type: string
          description: How often the job reports, as a duration such as `1 day`. Sent
            for `simple` check-ins.
        cron_schedule:
          type: string
          description: Sent for `cron` check-ins.
        cron_timezone:
          type: string
          description: Sent for `cron` check-ins.
        url:
          type: string
          description: The URL the job reports to.
        details_url:
          type: string
          format: uri
    WebhookV2Comment:
      type: object
      description: The comment that was added.
      required:
      - id
      - fault_id
      - event
      - source
      - created_at
      - email
      - author
      - body
      properties:
        id:
          type: integer
        fault_id:
          type: integer
        event:
          type:
          - string
          - 'null'
        source:
          type: string
          example: web
        created_at:
          type: string
          format: date-time
        email:
          type:
          - string
          - 'null'
          description: The commenter's email, for a comment from someone without an
            account.
        author:
          type:
          - string
          - 'null'
          description: The commenter's name.
        body:
          type:
          - string
          - 'null'
    WebhookV2Alarm:
      type: object
      description: The Insights alarm the event is about.
      required:
      - id
      - name
      - state
      - created_at
      - url
      - details_url
      properties:
        id:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
          enum:
          - initial
          - alarm
          - ok
          -
        created_at:
          type: string
          format: date-time
        url:
          type: string
          format: uri
        details_url:
          type: string
          format: uri
          description: The same as `url`.
    WebhookV2VolumeSpike:
      type: object
      description: The error volume that triggered the spike alert.
      required:
      - observed
      - baseline_median
      - factor
      - z_score
      - window_minutes
      properties:
        observed:
          type: integer
          description: Errors in the window just checked.
        baseline_median:
          type: integer
        factor:
          type:
          - number
          - 'null'
        z_score:
          type:
          - number
          - 'null'
        window_minutes:
          type: integer
    WebhookV2Event:
      type: object
      description: 'The fields every v2 webhook body carries. Each event adds the
        records it''s about. A v2 body has no `payload_version`; that''s how it differs
        from the later versions.

        '
      required:
      - event
      - message
      not:
        required:
        - payload_version
      properties:
        event:
          type: string
          description: The event's name, the same as its key under `webhooks`.
          example: occurred
        message:
          type: string
          description: A one-line summary of the event, as notifications show it.
        actor:
          allOf:
          - "$ref": "#/components/schemas/WebhookV2User"
          description: The person who caused the event. Absent when Honeybadger, or
            an API token with no user, did.
    WebhookV2OccurredEvent:
      description: An error occurred, or a fault passed its notification rate threshold.
      allOf:
      - "$ref": "#/components/schemas/WebhookV2Event"
      - type: object
        required:
        - project
        - fault
        - notice
        properties:
          event:
            type: string
            enum:
            - occurred
            - rate_exceeded
          project:
            "$ref": "#/components/schemas/WebhookV2Project"
          fault:
            "$ref": "#/components/schemas/WebhookV2Fault"
          notice:
            "$ref": "#/components/schemas/WebhookV2Notice"
          context:
            description: 'The notice''s request context, as the notifier sent it.
              Usually an object, but any JSON value. Moved here from `notice.request`.

              '
          custom_fields:
            description: The integration's custom fields, when it has any.
    WebhookV2ResolutionEvent:
      description: A fault was resolved or reopened.
      allOf:
      - "$ref": "#/components/schemas/WebhookV2Event"
      - type: object
        required:
        - fault
        properties:
          event:
            type: string
            enum:
            - resolved
            - unresolved
          fault:
            "$ref": "#/components/schemas/WebhookV2Fault"
    WebhookV2AssignedEvent:
      description: A fault, or a bulk action's faults, were assigned.
      allOf:
      - "$ref": "#/components/schemas/WebhookV2Event"
      - type: object
        properties:
          event:
            type: string
            enum:
            - assigned
          fault:
            allOf:
            - "$ref": "#/components/schemas/WebhookV2Fault"
            description: The fault. Absent for a bulk action, which sends `fault_ids`
              instead.
          fault_ids:
            type: array
            description: The faults a bulk action changed. Sent in place of `fault`.
            items:
              type: string
          assignee:
            allOf:
            - "$ref": "#/components/schemas/WebhookV2User"
            description: Absent when the fault was unassigned before the webhook was
              sent.
    WebhookV2CommentedEvent:
      description: A comment was added to a fault, or to a bulk action's faults.
      allOf:
      - "$ref": "#/components/schemas/WebhookV2Event"
      - type: object
        required:
        - comment
        properties:
          event:
            type: string
            enum:
            - commented
          fault:
            allOf:
            - "$ref": "#/components/schemas/WebhookV2Fault"
            description: The fault. Absent for a bulk action, which sends `fault_ids`
              instead.
          fault_ids:
            type: array
            description: The faults a bulk action changed. Sent in place of `fault`.
            items:
              type: string
          comment:
            "$ref": "#/components/schemas/WebhookV2Comment"
    WebhookV2DeployedEvent:
      description: A deploy was recorded.
      allOf:
      - "$ref": "#/components/schemas/WebhookV2Event"
      - type: object
        required:
        - project
        - deploy
        properties:
          event:
            type: string
            enum:
            - deployed
          project:
            "$ref": "#/components/schemas/WebhookV2Project"
          deploy:
            "$ref": "#/components/schemas/WebhookV2Deploy"
    WebhookV2OutageEvent:
      description: An uptime site went down or came back up.
      allOf:
      - "$ref": "#/components/schemas/WebhookV2Event"
      - type: object
        required:
        - project
        - site
        - outage
        properties:
          event:
            type: string
            enum:
            - up
            - down
          project:
            "$ref": "#/components/schemas/WebhookV2Project"
          site:
            "$ref": "#/components/schemas/WebhookV2Site"
          outage:
            "$ref": "#/components/schemas/WebhookV2Outage"
    WebhookV2CertExpirationEvent:
      description: An uptime site's TLS certificate is about to expire.
      allOf:
      - "$ref": "#/components/schemas/WebhookV2Event"
      - type: object
        required:
        - project
        - site
        properties:
          event:
            type: string
            enum:
            - cert_will_expire
          project:
            "$ref": "#/components/schemas/WebhookV2ProjectRef"
          site:
            "$ref": "#/components/schemas/WebhookV2Site"
    WebhookV2CheckInEvent:
      description: A check-in missed its schedule, or started reporting again.
      allOf:
      - "$ref": "#/components/schemas/WebhookV2Event"
      - type: object
        required:
        - project
        - check_in
        properties:
          event:
            type: string
            enum:
            - check_in_missing
            - check_in_reporting
          project:
            "$ref": "#/components/schemas/WebhookV2Project"
          check_in:
            "$ref": "#/components/schemas/WebhookV2CheckIn"
    WebhookV2AlarmEvent:
      description: An Insights alarm was triggered, or returned to normal.
      allOf:
      - "$ref": "#/components/schemas/WebhookV2Event"
      - type: object
        required:
        - alarm
        properties:
          event:
            type: string
            enum:
            - alarm_alert
            - alarm_ok
          alarm:
            "$ref": "#/components/schemas/WebhookV2Alarm"
    WebhookV2VolumeSpikeEvent:
      description: A project's error volume rose well above its usual level.
      allOf:
      - "$ref": "#/components/schemas/WebhookV2Event"
      - type: object
        required:
        - project
        - volume_spike
        properties:
          event:
            type: string
            enum:
            - volume_spike
          project:
            "$ref": "#/components/schemas/WebhookV2Project"
          volume_spike:
            "$ref": "#/components/schemas/WebhookV2VolumeSpike"
    IntegrationRate:
      type: string
      enum:
      - min
      - hour
      - wday
      - week
      description: 'Period the `rate_exceeded` threshold counts over: `min` a minute,
        `hour` an hour, `wday` a day (24 hours, not a weekday), `week` a week.'
    IntegrationEvent:
      type: string
      description: An event an integration can notify on. Each type supports a subset,
        which IntegrationCreateInput lists per type.
      enum:
      - occurred
      - rate_exceeded
      - assigned
      - resolved
      - unresolved
      - commented
      - deployed
      - up
      - down
      - cert_will_expire
      - flooded
      - check_in_missing
      - check_in_reporting
      - alarm_alert
      - alarm_ok
      - volume_spike
    IntegrationFilterEvent:
      type: string
      description: An event a filter applies to, or `all` for every event.
      enum:
      - occurred
      - rate_exceeded
      - assigned
      - resolved
      - unresolved
      - commented
      - deployed
      - up
      - down
      - cert_will_expire
      - flooded
      - check_in_missing
      - check_in_reporting
      - alarm_alert
      - alarm_ok
      - volume_spike
      - all
