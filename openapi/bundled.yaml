          example: jane
        created_at:
          type: string
          format: date-time
          description: When the deploy was recorded
    Environment:
      type: object
      description: 'An environment a project''s errors are reported from, such as
        production or staging, and whether errors from it send notifications.

        '
      required:
      - id
      - project_id
      - name
      - notifications
      - created_at
      properties:
        id:
          readOnly: true
          type: string
          example: En6tRm
        project_id:
          readOnly: true
          type: string
          description: ID of the project this environment belongs to
          example: Xk9mZp
        name:
          type: string
          description: Environment name
          example: production
        notifications:
          type: boolean
          description: Whether notifications fire for this environment.
        created_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the environment was created
    EnvironmentCreateInput:
      type: object
      description: A new environment. Names are unique per project and case-sensitive.
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: production
        notifications:
          type:
          - boolean
          - 'null'
          default: true
          description: Whether errors in this environment notify. Null means the default.
    EnvironmentInput:
      type: object
      description: 'Fields to change on an environment. Omitted fields are unchanged.
        Read-only fields are ignored.

        '
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Can only be sent with its current value; an environment can't
            be renamed.
          example: production
        notifications:
          type:
          - boolean
          - 'null'
          default: true
          description: Whether errors in this environment notify. Null resets it to
            true.
    Error:
      type: object
      description: |
        An error response. `error.code` names the error and is stable; branch on
        it, since several codes share a status. `error.message` is for people and
        may change.

        `error.details`, when present, takes one of three shapes:

        - **A list of `{field, message}`**, on `validation_error` and
          `invalid_parameter`, and on `feature_unavailable` or `limit_reached` when
          one field caused the refusal. `field` can be a path such as
          `widgets[1].id` or `check_ins.<slug>`, or `base` for the record as a
          whole, and the same field can appear more than once.
        - **`{required_scope, token_scopes}`**, on `insufficient_scope`: the scope
          the operation needs, and the scopes the token has.
        - **`{merged_into, location}`**, on `fault_merged`: the fault it was merged
          into. Only writes get this; reads of a merged fault redirect to it with a
          301.

        Every 429 sends a `Retry-After` header with the seconds to wait. A 503 can
        be retried after a short wait.

        Include `meta.request_id` when contacting support.

        | `error.code` | Status | Meaning |
        | --- | --- | --- |
        | `invalid_parameter` | 400 | A query parameter is malformed or outside its allowed values. |
        | `unauthorized` | 401 | The credential is missing, invalid or revoked. |
        | `unsupported_auth_scheme` | 401 | The credential was sent with HTTP basic auth instead of as a Bearer token. |
        | `credential_in_query` | 401 | The credential was sent in the URL. |
        | `ingestion_key_not_accepted` | 401 | An ingestion key was sent; this API takes an API token. |
        | `access_denied` | 403 | The credential isn't allowed to do this to this record. |
        | `insufficient_scope` | 403 | The token lacks a scope this needs. `details` names it. |
        | `project_restricted` | 403 | A token limited to some projects can't create projects. |
        | `requires_user_token` | 403 | This records who acted, so it needs a user token, not an account token. |
        | `feature_unavailable` | 403 | The plan doesn't include this. |
        | `limit_reached` | 403 | The plan's limit for this resource is reached. |
        | `account_inactive` | 403 | The account isn't active. |
        | `account_parked` | 403 | The account is parked. |
        | `not_found` | 404 | Doesn't exist, or isn't visible to this credential. |
        | `fault_merged` | 409 | The fault was merged into another. `details` names it. |
        | `validation_error` | 422 | The body is invalid. `details`, when present, names each field. |
        | `forbidden_attributes` | 422 | The body sets fields that can't be set. |
        | `ambiguous_account` | 422 | The credential covers more than one account. |
        | `delete_failed` | 422 | The delete didn't complete. |
        | `rate_limit_exceeded` | 429 | Over the rate limit. Wait for `Retry-After`. |
        | `concurrent_request` | 429 | Another request is changing the same thing. Retry. |
        | `streams_provisioning` | 429 | The project's Insights streams are still being set up. Retry. |
        | `maintenance_mode` | 503 | Writes are paused for maintenance. Retry later. |
        | `service_unavailable` | 503 | Temporarily unavailable. Retry shortly. |
      required:
      - error
      properties:
        error:
          "$ref": "#/components/schemas/ErrorBody"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    ErrorBody:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 'Machine-readable code. Branch on this, not the message.

            '
          enum:
          - unauthorized
          - unsupported_auth_scheme
          - credential_in_query
          - access_denied
          - insufficient_scope
          - requires_user_token
          - project_restricted
          - account_inactive
          - account_parked
          - feature_unavailable
          - not_found
          - validation_error
          - delete_failed
          - limit_reached
          - rate_limit_exceeded
          - concurrent_request
          - streams_provisioning
          - ingestion_key_not_accepted
          - maintenance_mode
          - invalid_parameter
          - forbidden_attributes
          - service_unavailable
          - ambiguous_account
          - fault_merged
        message:
          type: string
          description: Human-readable explanation
          example: Access denied
        details:
          description: 'A list of `{field, message}` on `validation_error` and `invalid_parameter`,
            and on `feature_unavailable` or `limit_reached` when one field caused
            the refusal; `{required_scope, token_scopes}` on `insufficient_scope`;
            `{merged_into, location}` on `fault_merged`. Absent when there''s nothing
            to add.

            '
          oneOf:
          - type: array
            title: ValidationErrorDetails
            description: One entry per problem, naming the field it's about.
            items:
              "$ref": "#/components/schemas/ErrorDetail"
          - type: object
            title: InsufficientScopeDetails
            description: 'The scope the endpoint requires and the scopes the credential
              holds.

              '
            required:
            - required_scope
            - token_scopes
            properties:
              required_scope:
                type: string
                description: The permission this endpoint requires.
                example: faults:write
              token_scopes:
                type: array
                description: The permissions the credential actually holds.
                items:
                  type: string
          - type: object
            title: FaultMergedDetails
            description: 'The fault this one was merged into.

              '
            required:
            - merged_into
            - location
            properties:
              merged_into:
                type: string
                description: ID of the fault this one was merged into.
                example: '12345'
              location:
                type: string
                format: uri
                description: Absolute v3 URL of the surviving fault.
    ErrorDetail:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
          description: The field that failed validation
          example: name
        message:
          type: string
          description: Why it failed, without the field name repeated
          example: can't be blank
    Fault:
      type: object
      description: A unique error fingerprint (fault)
      required:
      - id
      - project_id
      - message
      - created_at
      - links
      properties:
        id:
          type: string
          example: '12345'
        project_id:
          type: string
          description: ID of the project this fault belongs to
          example: Xk9mZp
        klass:
          type:
          - string
          - 'null'
          description: Error class name
          example: NoMethodError
        message:
          type: string
          description: Error message
          example: undefined method 'foo' for nil:NilClass
        component:
          type:
          - string
          - 'null'
          description: Component where the error occurred
          example: UsersController
        action:
          type:
          - string
          - 'null'
          description: Action where the error occurred
          example: show
        environment:
          type:
          - string
          - 'null'
          description: Environment name
          example: production
        resolved:
          type: boolean
          description: Whether the fault is resolved
        ignored:
          type: boolean
          description: Whether the fault is ignored
        created_at:
          type: string
          format: date-time
          description: When the fault was first reported
        last_notice_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the last notice was received
        notices_count:
          type: integer
          description: Total number of notices for this fault
          example: 214
        comments_count:
          type: integer
          description: Number of comments on this fault
          example: 2
        tags:
          type: array
          items:
            type: string
          description: Tags assigned to this fault
          example:
          - critical
          - backend
        assignee_id:
          type:
          - string
          - 'null'
          description: Same as `assignee.id`. Written by PATCH or POST …/assign.
          example: Uq7rT2
        snoozed:
          type: boolean
          readOnly: true
          description: Whether a snooze is in effect now. A new snooze replaces any
            existing one.
        assignee:
          type:
          - object
          - 'null'
          description: User assigned to this fault
          properties:
            id:
              type: string
              description: ID of the assignee
              example: Uz4wKm
            name:
              type:
              - string
              - 'null'
              description: Name of the assignee
              example: Jane Smith
            email:
              type: string
              description: Email of the assignee
              example: jane@example.com
        last_notice_deploy:
          description: 'The deploy that was live when the error last occurred: the
            newest deploy in the fault''s environment before `last_notice_at`. A guess
            from timing, not the deploy that introduced or resolved the error.

            '
          oneOf:
          - "$ref": "#/components/schemas/Deploy"
          - type: 'null'
        tickets:
          type: array
          description: Issue tracker tickets linked to this fault
          items:
            type: object
            properties:
              url:
                type: string
                description: URL of the ticket
                example: https://github.com/acme/shop/issues/482
              integration_id:
                type: string
                description: ID of the integration that created the ticket
                example: Ch9wLp
        resolve_on_deploy:
          type: boolean
          description: 'Whether this fault is waiting to be resolved by the next recorded
            deploy. Absent for a fault on an inactive project.

            '
        recording_paused_until:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When a recording pause ends; null when recording is not paused.
            Absent for a fault on an inactive project.

            '
        notices_count_in_range:
          type: integer
          description: 'Notices inside the requested occurrence window. Present only
            when the request supplied `occurred_after` or `occurred_before`.

            '
          example: 37
        links:
          "$ref": "#/components/schemas/WebLinks"
    FaultAssignmentInput:
      type: object
      description: Who to assign a fault to
      required:
      - assignee_id
      additionalProperties: false
      properties:
        assignee_id:
          type: string
          description: 'ID of a user on the project. To unassign, DELETE the same
            path.

            '
          example: Xk9mZp
    FaultSelectionInput:
      type: object
      description: Selects the faults a bulk operation applies to
      additionalProperties: false
      properties:
        all:
          type: boolean
          description: 'Apply to every fault the other filters match, which with no
            other filters is every fault in the project. Required to make an unbounded
            change explicit; ignored when `fault_ids` names specific faults.

            '
          example: false
        dry_run:
          type: boolean
          description: 'Report what the request would change without changing it —
            no state change, no comments, no timeline entries. The response has the
            same shape either way, with `dry_run` echoed back.

            '
          example: false
        fault_ids:
          type: array
          description: 'IDs of the faults to change. If any ID isn''t a fault in this
            project, nothing changes. Omit to act on everything the query and time
            filters match; with no filters, that requires `"all": true`.

            '
          items:
            type: string
          example:
          - '12345'
          - '12346'
        q:
          type: string
          description: 'Search query, in the syntax of the web UI''s error search,
            applied when `fault_ids` is left out. See [Error search](https://docs.honeybadger.io/guides/errors/search/)
            for the syntax and filters.

            '
          example: "-is:resolved"
        created_after:
          type: number
          format: double
          description: 'Only faults created after this Unix timestamp. Applied when
            `fault_ids` is omitted, alongside q.

            '
        occurred_after:
          type: number
          format: double
          description: 'Only faults that occurred after this Unix timestamp. Applied
            when `fault_ids` is omitted, alongside `q`.

            '
        occurred_before:
          type: number
          format: double
          description: 'Only faults that occurred before this Unix timestamp. Applied
            when `fault_ids` is omitted, alongside `q`.

            '
    FaultBulkResult:
      type: object
      required:
      - count
      - dry_run
      - fault_ids
      properties:
        count:
          type: integer
          description: 'How many faults changed. Exact, and counts what changed rather
            than what matched: resolving a hundred faults of which ninety were already
            resolved reports ten. On a dry run, how many would have changed.

            '
          example: 12
        dry_run:
          type: boolean
          description: 'True when nothing was written. Echoed back so a response is
            never ambiguous about whether it took effect.

            '
          example: false
        fault_ids:
          type: array
          description: 'IDs of the faults that changed, capped at 100. `count` is
            exact regardless; see `fault_ids_truncated`.

            '
          items:
            type: string
          example:
          - '12345'
          - '12346'
        fault_ids_truncated:
          type: boolean
          description: True when more faults changed than `fault_ids` lists.
          example: false
    FaultInput:
      type: object
      description: Writable fault attributes
      additionalProperties: false
      properties:
        resolved:
          type: boolean
        ignored:
          type: boolean
        assignee_id:
          type:
          - string
          - 'null'
          description: 'ID of a user on the project. Null unassigns.

            '
          example: Xk9mZp
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
        resolve_on_deploy:
          type: boolean
          description: |
            Set to true to resolve this fault when the project's next deploy is recorded, in any environment. After that deploy, it reads false again.

            It has no effect if the fault is resolved or ignored once the rest of this update is applied. If the fault is resolved or ignored before the next deploy, the pending resolution is cancelled. Set it to false to cancel it yourself.
    IncidentUpdate:
      type: object
      description: An update to a status page incident. The incident's prose lives
        here, and its `current_status`, `current_severity` and `closed_at` are derived
        from its updates.
      required:
      - id
      - incident_id
      - status
      - severity
      properties:
        id:
          type: string
          example: Iu6tMn
        incident_id:
          type: string
          description: ID of the incident
          example: In3pKr
        message:
          type:
          - string
          - 'null'
          description: The update's prose
          example: We have identified the cause and are rolling back.
        status:
          "$ref": "#/components/schemas/IncidentStatus"
        severity:
          "$ref": "#/components/schemas/IncidentSeverity"
        start_at:
          type: string
          format: date-time
          description: When the update takes effect. A future time schedules it.
        should_notify:
          type:
          - boolean
          - 'null'
          description: Whether the update is announced on the status page's connected
            accounts
        notified_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the announcement was sent
        created_at:
          type: string
          format: date-time
          description: When the update was posted
        updated_at:
          type: string
          format: date-time
          description: When the update was last changed
    IncidentUpdateInput:
      type: object
      description: The writable fields of an incident update. `status` and `severity`
        default to `investigating` and `problem_detected`. If neither `start_at` nor
        `start_now` is given, the update starts now.
      additionalProperties: false
      properties:
        message:
          type: string
          description: The update's prose
          example: We have identified the cause and are rolling back.
        status:
          "$ref": "#/components/schemas/IncidentStatus"
        severity:
          "$ref": "#/components/schemas/IncidentSeverity"
        start_at:
          type: string
          format: date-time
          description: When the update takes effect. Only a scheduled_maintenance
            incident may set this in the future.
        start_now:
          type: boolean
          description: 'Start the update immediately, ignoring `start_at`. An update
            that has already started is left as it is, so sending it again changes
            nothing.

            '
        should_notify:
          type: boolean
          description: Announce the update on the status page's connected accounts
            and email the status page's subscribers
    Notice:
      type: object
      description: An individual error occurrence
      required:
      - id
      - fault_id
      - project_id
      - message
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The notice's ID, a UUID that addresses it without its project
            or fault
          example: 1e2ba1f0-4f3c-4b1a-9c7e-6f2f5c0f1a3b
        fault_id:
          type: string
          description: ID of the fault this notice belongs to
          example: '12345'
        project_id:
          type: string
          description: ID of the project
          example: Xk9mZp
        environment:
          type:
          - string
          - 'null'
          description: 'Environment name: the fault''s environment, or the one the
            notice reported when the fault has none. Null when neither is set.

            '
          example: production
        message:
          type:
          - string
          - 'null'
          description: Error message. Null when the notifier reported none.
          example: undefined method 'foo' for nil:NilClass
        created_at:
          type: string
          format: date-time
          description: When the notice was received
        request:
          type:
          - object
          - 'null'
          description: Request details when the error occurred. Fields not reported
            are null.
          properties:
            url:
              type:
              - string
              - 'null'
              description: Request URL
              example: https://shop.example.com/checkout
            component:
              type:
              - string
              - 'null'
              description: Controller or component name
              example: CheckoutController
            action:
              type:
              - string
              - 'null'
              description: Action name
              example: create
            params:
              type:
              - object
              - 'null'
              description: Request parameters
            session:
              type:
              - object
              - 'null'
              description: Session data
        context:
          type: object
          description: Custom context data sent with the notice
          additionalProperties: true
        backtrace:
          type: array
          description: 'Stack trace frames, at most 20. Source-mapped by default;
            pass `unmapped=true` for the frames exactly as the client sent them.

            '
          items:
            "$ref": "#/components/schemas/NoticeFrame"
        backtrace_mode:
          type: string
          enum:
          - source_mapped
          - reported
          description: 'Which representation of the trace this response carries. `source_mapped`
            when a stored mapped trace was served, `reported` when the frames are
            as the client sent them — either because `unmapped=true` was requested
            or because no different mapped trace was stored.

            '
          example: source_mapped
        backtrace_total_frames:
          type: integer
          description: 'Total frames in the selected trace before the 20-frame limit
            was applied.

            '
          example: 25
        backtrace_truncated:
          type: boolean
          description: Whether `backtrace` omits frames because of the 20-frame limit.
          example: true
        request_fields_removed:
          type:
          - array
          - 'null'
          description: 'Names of `request` fields removed at ingest because the payload
            exceeded the size limit. Null when nothing was removed.

            '
          items:
            type: string
          example:
          - params
        breadcrumbs:
          type:
          - object
          - 'null'
          description: 'Events the notifier recorded in the moments before the error,
            such as clicks, console logs, network requests and earlier notices. Null
            when the notice carries no breadcrumbs data, which is the case for notifiers
            that don''t send it. Always present on the single-notice endpoint; the
            notices list leaves it out unless `breadcrumbs=true` is passed.

            '
          required:
          - enabled
          - trail
          - total_entries
          - truncated
          additionalProperties: false
          properties:
            enabled:
              type: boolean
              description: Whether breadcrumbs were enabled in the notifier that sent
                this notice.
              example: true
            trail:
              type: array
              description: 'The recorded events in the order they happened, oldest
                first. At most 40; when there were more, these are the 40 nearest
                the error.

                '
              items:
                type: object
                required:
                - category
                - message
                - metadata
                - timestamp
                additionalProperties: false
                properties:
                  category:
                    type:
                    - string
                    - 'null'
                    description: The kind of event, as the notifier named it (for
                      example `ui.click`, `log`, `request`, `error`).
                    example: ui.click
                  message:
                    type:
                    - string
                    - 'null'
                    description: What happened
                    example: button#checkout
                  metadata:
                    type:
                    - object
                    - 'null'
                    description: Details the notifier attached to the event
                    additionalProperties: true
                  timestamp:
                    type:
                    - string
                    - 'null'
                    description: When the event happened, as the notifier reported
                      it (usually ISO 8601)
                    example: '2026-11-03T18:22:41.516Z'
            total_entries:
              type: integer
              description: Total events in the stored trail before the 40-entry limit
                was applied.
              example: 12
            truncated:
              type: boolean
              description: Whether `trail` omits older events because of the 40-entry
                limit.
              example: false
        links:
          "$ref": "#/components/schemas/WebLinks"
    NoticeFrame:
      type: object
      properties:
        file:
          type:
          - string
          - 'null'
          description: 'Path to the source file. Null when the notifier sent a backtrace
            entry that carried no file, or one that was not a frame at all.

            '
          example: app/models/checkout.rb
        line:
          type:
          - integer
          - 'null'
          description: 'Line number within `file`. Null when the notifier sent a value
            that is not a line number, such as `(eval)`.

            '
          example: 42
        column:
          type:
          - integer
          - 'null'
          description: Column number. Usually present only on source-mapped frames.
          example: 8
        method:
          type:
          - string
          - 'null'
          description: 'Name of the method or function. Null when the notifier omitted
            it, and routinely on source-mapped frames where the map carries no name
            for the position.

            '
          example: submit_order
        in_app:
          type: boolean
          description: 'Whether this frame is the project''s own code rather than
            a framework, gem or dependency. Derived from the project root the notifier
            reported.

            '
          example: true
        mapping:
          type: string
          enum:
          - source_mapped
          - reported
          description: 'Whether this specific frame was resolved through a source
            map. Mapping is applied one frame at a time and falls back to the reported
            frame, so a source-mapped trace can contain reported frames. Always `reported`
            when `unmapped=true` was requested.

            '
          example: source_mapped
        source:
          type: array
          description: 'Contiguous runs of source lines around the frame. Normally
            one block; a notifier-sent snippet with a gap produces one block per run.
            Empty when no source is available, when the notifier sent it in a shape
            other than a map of line number to content, or when no entry carried a
            usable line number. At most 25 lines in total.

            '
          items:
            "$ref": "#/components/schemas/SourceBlock"
    SourceBlock:
      type: object
      required:
      - first_line
      - lines
      properties:
        first_line:
          type: integer
          description: Line number of the first entry in `lines`.
          example: 41
        lines:
          type: array
          description: 'Source lines in order. Each line is truncated to 1024 characters.
            Across all of a frame''s blocks at most 25 lines are returned, chosen
            nearest the frame''s own line so that line is always present when the
            notifier sent it.

            '
          items:
            type: string
            maxLength: 1024
          example:
          - "  def submit"
          - "    charge!"
          - "  end"
    OccurrenceMeta:
      type: object
      properties:
        request_id:
          type: string
          example: 6f1c2b0e-8d4a-4f6e-9b2a-3c5d7e9f1a2b
        period:
          type: string
          enum:
          - hour
          - day
          - week
          - month
          description: The window used, which is `hour` when none was requested
        interval:
          type: string
          enum:
          - minute
          - hour
          - day
          description: Bucket width implied by the period
    OccurrenceSeries:
      type: object
      required:
      - project_id
      - buckets
      properties:
        project_id:
          type: string
          description: ID of the project this series belongs to
          example: Xk9mZp
        buckets:
          type: array
          description: 'One entry per interval in the window, oldest first, including
            intervals with no notices.

            '
          items:
            type: object
            required:
            - timestamp
            - count
            properties:
              timestamp:
                type: integer
                format: int64
                description: Start of the interval, Unix seconds
                example: 1704067200
              count:
                type: integer
                description: Notices recorded in this interval
                example: 17
    OffsetLinks:
      type: object
      description: Navigation links for a numbered-page collection. Each link is a
        root-relative path (`/v3/...`); resolve it against the API host.
      required:
      - self
      properties:
        self:
          type: string
          format: uri-reference
          description: This page
          example: "/v3/projects?page=2&per_page=25"
        first:
          type: string
          format: uri-reference
          description: First page
          example: "/v3/projects?page=1&per_page=25"
        prev:
          type:
          - string
          - 'null'
          description: Previous page, or null on the first page
          example: "/v3/projects?page=1&per_page=25"
        next:
          type:
          - string
          - 'null'
          description: Next page, or null on the last page
          example: "/v3/projects?page=3&per_page=25"
    Outage:
      type: object
      description: An uptime outage period
      required:
      - id
      - site_id
      - down_at
      - status
      - reason
      - headers
      - created_at
      - up_at
      - duration_seconds
      properties:
        id:
          type: string
          format: uuid
          example: 3d7a1c94-6f28-4e5b-8a13-c5e9b204d6f8
        site_id:
          type: string
          format: uuid
          description: Identifier of the site
          example: 9f8b6d2e-4c1a-4b7f-9e35-2a6c8d0f1b47
        down_at:
          type: string
          format: date-time
          description: When the site went down
        up_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the site came back up, or null while it is still down
        status:
          type:
          - integer
          - 'null'
          description: HTTP status of the check that went down
          example: 502
        reason:
          type:
          - string
          - 'null'
          description: Why the check failed
          example: Expected 200, got 502
        headers:
          type: object
          description: Response headers of the failing check
          additionalProperties:
            type: string
        duration_seconds:
          type:
          - integer
          - 'null'
          description: Duration of the outage in seconds
          example: 360
        created_at:
          type: string
          format: date-time
          description: When the outage record was created
    Pagination:
      type: object
      description: Offset-based pagination information
      required:
      - page
      - per_page
      properties:
        page:
          type: integer
          description: Current page number
          minimum: 1
          example: 1
        per_page:
          type: integer
          description: Items per page
          minimum: 1
          maximum: 100
          example: 25
    Project:
      type: object
      description: 'A Honeybadger project: one application or service. Errors, Insights
        data, uptime sites, check-ins, deploys and integrations all belong to a project.

        '
      required:
      - id
      - account_id
      - name
      - asana_workspace_id
      - active
      - links
      - disable_public_links
      - environments
      - language
      - resolve_errors_on_deploy
      - user_url
      - source_url
      - user_search_field
      - customer_throttle
      - fault_count
      - unresolved_fault_count
      - last_notice_at
      - earliest_notice_at
      - purge_days
      - created_at
      properties:
        id:
          readOnly: true
          type: string
          example: Xk9mZp
        account_id:
          readOnly: true
          type: string
          description: ID of the account this project belongs to
          example: Ab3kL9
        name:
          type: string
          description: Project name
          example: My Rails App
        active:
          readOnly: true
          type: boolean
          description: Whether the project is active
        disable_public_links:
          type: boolean
          description: Whether public error links are disabled
        environments:
          readOnly: true
          type: array
          items:
            type: string
          description: List of environment names seen in this project
          example:
          - production
          - staging
          - development
        resolve_errors_on_deploy:
          type: boolean
          description: Whether recording a deploy resolves every open fault
        user_url:
          type:
          - string
          - 'null'
          description: 'Template linking a fault''s affected user into your own system.
            `[user_id]` and `[user_email]` are substituted.

            '
          example: https://admin.example.com/users/[user_id]
        source_url:
          type:
          - string
          - 'null'
          description: 'Template linking a backtrace line to your source host. `[file]`
            and `[line]` are substituted.

            '
          example: https://github.com/acme/app/blob/main/[file]#L[line]
        user_search_field:
          type:
          - string
          - 'null'
          description: 'Context key identifying the affected user, when it is not
            in the default `context.user_email` or `context.user_id`.

            '
          example: context.account_id
        asana_workspace_id:
          type:
          - string
          - 'null'
          description: Asana workspace used by the project's Asana integration
          example:
        customer_throttle:
          type:
          - integer
          - 'null'
          description: Notices accepted per minute before throttling kicks in
        language:
          type:
          - string
          - 'null'
          description: Primary programming language
          example: Ruby
        fault_count:
          readOnly: true
          type: integer
          description: Total number of faults (errors) in this project
          example: 128
        unresolved_fault_count:
          readOnly: true
          type: integer
          description: Number of unresolved faults
          example: 12
        last_notice_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the last error was received
        earliest_notice_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: 'The start of the retention window: now minus the project''s
            `purge_days` (or the account''s retention when unset), at most 180 days.
            Computed on each read, so it moves forward with the clock.

            '
        purge_days:
          type:
          - integer
          - 'null'
          description: Data retention period in days
          example: 90
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the project was created
        links:
          "$ref": "#/components/schemas/WebLinks"
    ProjectCreateInput:
      description: Attributes for creating a project.
      allOf:
      - "$ref": "#/components/schemas/ProjectInput"
      - type: object
        required:
        - name
        properties:
          disable_email_notifications:
            type: boolean
            writeOnly: true
            description: 'Create-only. Members added with the project get email notifications
              switched off. Not stored or returned.

              '
          team_id:
            type: string
            description: 'Puts the new project in this team. Create-only: afterwards
              the team''s `project_ids` owns membership. Including it requires `team:write`
              in addition to the operation''s project scope, and the user must be
              allowed to manage the team. Without `team:write` the entire request
              is rejected with 403 `insufficient_scope`; no other fields are saved.

              '
            example: Ab3kL9
    ProjectInput:
      type: object
      description: 'Writable project attributes. Omitted fields are unchanged; null
        resets or clears the fields marked nullable. `team_id` and `disable_email_notifications`
        can only be set on create. Read-only fields are ignored.

        '
      properties:
        name:
          type: string
          description: Project name
          example: Billing API
        resolve_errors_on_deploy:
          type:
          - boolean
          - 'null'
          default: true
          description: Resolve every open fault when a deploy is recorded. Null resets
            it to true.
        disable_public_links:
          type:
          - boolean
          - 'null'
          default: false
          description: Disallow shareable public fault links. Null resets it to false.
        language:
          type:
          - string
          - 'null'
          description: Primary language, used to format backtraces. Null clears it.
          example: ruby
        user_url:
          type:
          - string
          - 'null'
          description: 'Template for linking a fault''s affected user into your own
            system. `[user_id]` and `[user_email]` are substituted. Null clears it.

            '
          example: https://admin.example.com/users/[user_id]
        source_url:
          type:
          - string
          - 'null'
          description: 'Template for linking a backtrace line to your source host.
            `[file]` and `[line]` are substituted. Null clears it.

            '
          example: https://github.com/acme/app/blob/main/[file]#L[line]
        user_search_field:
          type:
          - string
          - 'null'
          description: 'Context key identifying the affected user, for when it is
            not in the default `context.user_email` or `context.user_id`. Null clears
            it.

            '
          example: context.account_id
        asana_workspace_id:
          type:
          - string
          - 'null'
          description: Asana workspace used by the project's Asana integration. Null
            clears it.
        customer_throttle:
          type:
          - integer
          - 'null'
          description: Notices accepted per minute before throttling kicks in. Null
            clears it.
        purge_days:
          type:
          - integer
          - 'null'
          description: 'Days to retain notices. Changing it requires custom retention
            on the account; without it, only the current value (on create, the default)
            is accepted. Null clears it.

            '
    IngestionKey:
      type: object
      description: 'The key your app uses to send data to Honeybadger, set as `ingestion_key`
        in the client''s config (`api_key` in older clients). It can''t authenticate
        to this API; use an API token for that.

        '
      required:
      - id
      - project_id
      - key
      - label
      - created_at
      properties:
        id:
          readOnly: true
          type: string
          description: Identifier for this key. Use it in paths.
          example: Kp7mZq2x
        project_id:
          readOnly: true
          type: string
          description: Identifier of the project the key belongs to.
          example: Xk9mZp
        key:
          readOnly: true
          type: string
          description: 'The Ingestion Key value a notifier sends. Returned in full:
            unlike an API Token, it''s meant to ship with your application.

            '
          example: hbp_aBcDeFgHiJkLmNoPqRsTuVwXyZ012345aB12Cd
        label:
          type:
          - string
          - 'null'
          description: Optional human-readable name.
          example: CI
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the key was created
    IngestionKeyInput:
      type: object
      additionalProperties: false
      properties:
        label:
          type:
          - string
          - 'null'
          description: Optional human-readable name.
          example: CI
    ResponseMeta:
      type: object
      properties:
        request_id:
          type: string
          description: Unique identifier for the request, for correlating with support
          example: 6f1c2b0e-8d4a-4f6e-9b2a-3c5d7e9f1a2b
    Site:
      type: object
      description: 'A URL Honeybadger checks for uptime from several locations on
        a schedule, alerting when it goes down and when it recovers.

        '
      required:
      - id
      - project_id
      - name
      - url
      - active
      - links
      - state
      - last_checked_at
      - match_type
      - match
      - request_method
      - frequency
      - locations
      - validate_ssl
      - request_headers
      - request_body
      - outage_threshold
      - timeout
      - created_at
      properties:
        id:
          readOnly: true
          type: string
          format: uuid
          example: 9f8b6d2e-4c1a-4b7f-9e35-2a6c8d0f1b47
        project_id:
          readOnly: true
          type: string
          description: ID of the project this site belongs to
          example: Xk9mZp
        name:
          type: string
          description: Display name for the site
          example: Production App
        url:
          type: string
          description: URL to monitor. Includes the scheme.
          example: https://app.example.com
        active:
          type: boolean
          description: Whether monitoring is active. After 740 consecutive failed
            checks the server sets it to false.
        state:
          readOnly: true
          type: string
          description: Current state of the site
          enum:
          - pending
          - up
          - down
          example: up
        last_checked_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the site was last checked
        match_type:
          "$ref": "#/components/schemas/SiteMatchType"
        match:
          type:
          - string
          - 'null'
          description: Value to match in the response
          example:
        request_method:
          "$ref": "#/components/schemas/SiteRequestMethod"
        frequency:
          "$ref": "#/components/schemas/SiteFrequency"
        locations:
          type: array
          uniqueItems: true
          items:
            "$ref": "#/components/schemas/SiteLocation"
          description: Locations checks run from. Unordered. [] means every location.
          example:
          - Virginia
          - London
        validate_ssl:
          type: boolean
          description: Whether to validate SSL certificates
        request_headers:
          type: object
          description: Custom headers sent with check requests, as header name to
            value; {} when there are none
          additionalProperties:
            type: string
            format: password
        request_body:
          type:
          - string
          - 'null'
          format: password
          description: Request body for POST/PUT checks
          example:
        outage_threshold:
          type:
          - integer
          - 'null'
          description: Number of failed checks before declaring an outage
          example: 2
        timeout:
          type:
          - integer
          - 'null'
          description: 'The stored request timeout in seconds; null means the default,
            30. On a plan without custom timeouts the default applies whatever is
            stored.

            '
          example: 30
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the site was created
        links:
          "$ref": "#/components/schemas/WebLinks"
    SiteMatchType:
      type: string
      enum:
      - success
      - exact
      - include
      - exclude
      - jmespath
      description: 'How a response is judged. `success`: any 2xx; `match` must be
        left out. `exact`: the response status code equals `match`. `include` / `exclude`:
        the body does / doesn''t contain `match`. `jmespath`: `match` is a JMESPath
        expression evaluated against the JSON body; numbers in it use backticks, not
        quotes.

        '
    SiteFrequency:
      type: integer
      enum:
      - 1
      - 2
      - 5
      - 15
      description: Minutes between checks. A value below the plan's floor is refused.
    SiteLocation:
      type: string
      enum:
      - Virginia
      - Frankfurt
      - Singapore
      - London
      - Oregon
      description: A location uptime checks run from.
    SiteRequestMethod:
      type: string
      enum:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    SiteCreateInput:
      description: Attributes for creating a site. `name` defaults to the URL.
      allOf:
      - "$ref": "#/components/schemas/SiteInput"
      - required:
        - url
    SiteInput:
      type: object
      description: 'Writable uptime-check site attributes. Omitted fields are unchanged;
        null resets or clears the fields marked nullable. Read-only fields are ignored.

        '
      properties:
        name:
          type: string
          description: Name shown for the site in Honeybadger and on status pages.
          example: Marketing site
        url:
          type: string
          format: uri
          pattern: "^https?://\\S"
          description: Must start with http:// or https://, with no surrounding whitespace.
          example: https://www.example.com/health
        match_type:
          default: success
          description: How a check decides the site is up (see SiteMatchType). Null
            resets it to success.
          anyOf:
          - "$ref": "#/components/schemas/SiteMatchType"
          - type: 'null'
        match:
          type:
          - string
          - 'null'
          maxLength: 255
          description: 'What `match_type` compares against (see SiteMatchType). Required
            unless `match_type` is `success`, and must be left out with `success`.
            Null clears it.

            '
          example: status == 'ok'
        request_method:
          default: GET
          description: HTTP method each check sends. Null resets it to GET.
          anyOf:
          - "$ref": "#/components/schemas/SiteRequestMethod"
          - type: 'null'
        validate_ssl:
          type:
          - boolean
          - 'null'
          default: true
          description: Fail the check when the TLS certificate does not validate.
            Null resets it to true.
        request_body:
          type:
          - string
          - 'null'
          format: password
          maxLength: 32768
          description: Body to send with the request, up to 32 KB. Null clears it.
        request_headers:
          type:
          - object
          - 'null'
          default: {}
          description: 'Headers to send with the request, as header name to value.
            Replaces the stored headers; null or `{}` clears them.

            '
          additionalProperties:
            type: string
            format: password
          example:
            Authorization: Bearer abc123
        frequency:
          default: 5
          description: 'Minutes between checks. The plan sets the most frequent allowed.
            Null resets it to 5.

            '
          anyOf:
          - "$ref": "#/components/schemas/SiteFrequency"
          - type: 'null'
        locations:
          type:
          - array
          - 'null'
          uniqueItems: true
          default: []
          description: 'A set of location names to check from. Null or empty means
            every location. A set; order is ignored and duplicates are dropped.

            '
          items:
            "$ref": "#/components/schemas/SiteLocation"
        outage_threshold:
          type:
          - integer
          - 'null'
          minimum: 1
          description: 'Consecutive failures before an outage is declared. null means
            down once failures reach 50% of locations.

            '
        active:
          type:
          - boolean
          - 'null'
          default: true
          description: 'Whether monitoring is active. After 740 consecutive failed
            checks the server sets it to false. Null resets it to true.

            '
        timeout:
          type:
          - integer
          - 'null'
          description: 'Request timeout in seconds, 1 to 120, default 30, and less
            than the frequency in seconds. Changing it requires the uptime timeout
            feature on the account; without it, only the current value (on create,
            the default) is accepted. Null resets it to the default.

            '
    StatusPage:
      type: object
      description: 'A public status page. Readable and deletable after the plan loses
        status pages; creating and editing need the feature.

        '
      required:
      - id
      - account_id
      - name
      - url
      - features
      - hide_branding
      - password_protected
      - username
      - links
      - domain
      - created_at
      - domain_verified_at
      - sites
      - check_ins
      - incidents_enabled
      - search_engine_indexing_disabled
      - message_enabled
      - message_title
      - message_body
      - google_analytics_id
      properties:
        id:
          readOnly: true
          type: string
          example: Sp7bMq
        account_id:
          readOnly: true
          type: string
          description: ID of the account this status page belongs to
          example: Ab3kL9
        name:
          type: string
          description: Status page name
          example: Acme Status
        domain:
          type:
          - string
          - 'null'
          description: Custom domain for the status page
          example: status.acme.com
        features:
          "$ref": "#/components/schemas/StatusPageFeatures"
        hide_branding:
          type: boolean
        password_protected:
          type: boolean
        username:
          type:
          - string
          - 'null'
          description: Basic-auth user when password protected. The password is never
            returned.
          example:
        incidents_enabled:
          type: boolean
          description: Whether the page shows incidents
        search_engine_indexing_disabled:
          type: boolean
          description: Whether search engines are asked not to index the page
        message_enabled:
          type: boolean
          description: Whether the message banner shows
        message_title:
          type:
          - string
          - 'null'
          description: The message banner's title
          example: Scheduled maintenance
        message_body:
          type:
          - string
          - 'null'
          description: The message banner's text
          example: We're upgrading our database on Saturday at 02:00 UTC.
        google_analytics_id:
          type:
          - string
          - 'null'
          description: The page's Google Analytics measurement ID
          example:
        url:
          readOnly: true
          type: string
          description: URL of the status page
          example: https://acme.statuspage.honeybadger.io
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the status page was created
        domain_verified_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the custom domain was verified
        sites:
          type: array
          description: Uptime sites displayed on the status page. An ordered list;
            the order is the order on the page.
          items:
            "$ref": "#/components/schemas/StatusPageSite"
        check_ins:
          type: array
          description: Check-ins displayed on the status page. An ordered list; the
            order is the order on the page.
          items:
            "$ref": "#/components/schemas/StatusPageCheckIn"
        links:
          "$ref": "#/components/schemas/WebLinks"
    StatusPageIncident:
      type: object
      description: 'An incident on a status page. An incident is a container for a
        thread of updates: the prose lives on each update, and `current_status`, `current_severity`
        and `closed_at` are derived from them and are never writable.'
      required:
      - id
      - status_page_id
      - title
      - build_type
      - retro_should_notify
      - retro_notify_message
      - updates
      - links
      properties:
        id:
          type: string
          example: In3pKr
        status_page_id:
          type: string
          description: ID of the status page
          example: Sp7bMq
        title:
          type: string
          description: Incident title
          example: Database connectivity issues
        retro_should_notify:
          type: boolean
          description: For a retroactive incident, whether to announce it once on
            the status page's connected accounts
        retro_notify_message:
          type:
          - string
          - 'null'
          description: The announcement sent when `retro_should_notify` is true
          example:
        build_type:
          "$ref": "#/components/schemas/IncidentBuildType"
        current_status:
          description: Status of the update in effect now. Derived from the updates.
          anyOf:
          - "$ref": "#/components/schemas/IncidentStatus"
          - type: 'null'
        current_severity:
          description: Severity of the update in effect now. Derived from the updates.
          anyOf:
          - "$ref": "#/components/schemas/IncidentSeverity"
          - type: 'null'
        start_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the incident starts. Derived from the updates.
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the incident closed, or null while it is open. Derived
            from the updates: it is set once an update reaches resolved or maintenance_complete.'
        created_at:
          type: string
          format: date-time
          description: When the incident was created
        updated_at:
          type: string
          format: date-time
          description: When the incident was last updated
        updates:
          type: array
          description: The incident's thread, newest first. Always at least one update.
          items:
            "$ref": "#/components/schemas/IncidentUpdate"
        links:
          "$ref": "#/components/schemas/WebLinks"
    StatusPageIncidentCreateInput:
      type: object
      description: An incident and the updates it opens with
      required:
      - title
      - updates
      additionalProperties: false
      properties:
        title:
          type: string
          example: Elevated error rates
        build_type:
          "$ref": "#/components/schemas/IncidentBuildType"
        retro_should_notify:
          type: boolean
          description: Announce a retroactive incident when it is created
        retro_notify_message:
          type:
          - string
          - 'null'
          description: Message accompanying that announcement
        updates:
          type: array
          minItems: 1
          example:
          - status: investigating
            severity: partial_outage
            message: Some requests to the API are failing. We're looking into it.
          description: Updates to create with the incident; at least one
          items:
            "$ref": "#/components/schemas/IncidentUpdateInput"
    StatusPageIncidentUpdateInput:
      type: object
      description: Writable incident attributes
      additionalProperties: false
      properties:
        title:
          type: string
        retro_should_notify:
          type: boolean
        retro_notify_message:
          type:
          - string
          - 'null'
    StatusPageCreateInput:
      description: Attributes for creating a status page.
      allOf:
      - "$ref": "#/components/schemas/StatusPageInput"
      - required:
        - name
    StatusPageInput:
      type: object
      description: 'Writable status-page attributes. Omitted fields are unchanged;
        null resets or clears the fields marked nullable. Read-only fields, including
        each monitor''s state, are ignored.

        '
      properties:
        name:
          type: string
          maxLength: 100
          example: Acme Status
        domain:
          type:
          - string
          - 'null'
          description: 'Custom domain the page is served on. Unique across Honeybadger.
            An account can set at most 30 domains a week. Null clears it.

            '
          example: status.example.com
        incidents_enabled:
          type:
          - boolean
          - 'null'
          description: 'Whether the page shows incidents. Changing it requires status
            page incidents on the plan. On create, defaults to whether the plan has
            them. Null resets it to that same create default.

            '
        search_engine_indexing_disabled:
          type:
          - boolean
          - 'null'
          default: false
          description: Asks search engines not to index the page. Null resets it to
            false.
        message_enabled:
          type:
          - boolean
          - 'null'
          default: false
          description: Shows the message banner. Null resets it to false.
        message_title:
          type:
          - string
          - 'null'
          description: The message banner's title. Null clears it.
        message_body:
          type:
          - string
          - 'null'
          description: The message banner's text. Null clears it.
        google_analytics_id:
          type:
          - string
          - 'null'
          description: A Google Analytics measurement ID for the page. Null clears
            it.
        hide_branding:
          type:
          - boolean
          - 'null'
          default: false
          description: 'Changing it requires advanced status pages on the plan; the
            default (false) or the stored value is accepted on any plan. Null resets
            it to false.

            '
        password_protected:
          type:
          - boolean
          - 'null'
          default: false
          description: 'Changing it requires advanced status pages and password protection
            on the plan; the default (false) or the stored value is accepted on any
            plan. Turning it on needs a username and password, sent or already stored.
            Null resets it to false.

            '
        username:
          type:
          - string
          - 'null'
          description: Basic-auth user when password protected. Requires advanced
            status pages and password protection on the plan.
        password:
          type:
          - string
          - 'null'
          format: password
          writeOnly: true
          description: Basic-auth password when password protected. Never returned.
            Requires advanced status pages and password protection on the plan.
        features:
          default: {}
          description: 'Presentation copy and styling. Replaces the whole object;
            null clears it. Changing it requires advanced status pages on the plan;
            the default ({}) or the stored value is accepted on any plan.

            '
          anyOf:
          - "$ref": "#/components/schemas/StatusPageFeatures"
          - type: 'null'
        sites:
          type:
          - array
          - 'null'
          default: []
          description: 'Sites listed on the page, in page order, replacing the current
            list. Null or empty removes every site.

            '
          items:
            "$ref": "#/components/schemas/StatusPageSiteInput"
        check_ins:
          type:
          - array
          - 'null'
          default: []
          description: 'Check-ins listed on the page, in page order, replacing the
            current list. Null or empty removes every check-in.

            '
          items:
            "$ref": "#/components/schemas/StatusPageCheckInInput"
    StatusPageSite:
      type: object
      description: A site listed on a status page.
      required:
      - site_id
      - display_name
      - description
      properties:
        site_id:
          type: string
          format: uuid
          description: Identifier of the site
          example: 9f8b6d2e-4c1a-4b7f-9e35-2a6c8d0f1b47
        display_name:
          type:
          - string
          - 'null'
          description: Display name on the status page
          example: Website
        description:
          type:
          - string
          - 'null'
          description: Description shown on the status page
          example:
    StatusPageCheckIn:
      type: object
      description: A check-in listed on a status page.
      required:
      - check_in_id
      - display_name
      - description
      properties:
        check_in_id:
          type: string
          description: ID of the check-in
          example: Ci5xWq
        display_name:
          type:
          - string
          - 'null'
          description: Display name on the status page
          example: Nightly backup
        description:
          type:
          - string
          - 'null'
          description: Description shown on the status page
          example:
    StatusPageFeatures:
      type: object
      description: 'Presentation copy and styling. Replaced whole by an update. A
        key that was never set is absent from a read; one sent as null reads back
        as null.

        '
      additionalProperties: false
      properties:
        home_link:
          type:
          - string
          - 'null'
          description: URL the page header links to, usually your own site.
          example: https://www.example.com
        up_caption:
          type:
          - string
          - 'null'
          description: Text shown when every check is up. Unset, the page says "All
            systems are operational".
          example: Everything is running smoothly
        down_caption:
          type:
          - string
          - 'null'
          description: Text shown when every check is down. Unset, the page says "All
            systems are experiencing issues".
          example: We're working on an outage
        mixed_caption:
          type:
          - string
          - 'null'
          description: Text shown when only some checks are down. Unset, the page
            says "Some systems are experiencing issues".
          example: Some services are degraded
        custom_css:
          type:
          - string
          - 'null'
          description: CSS added to the page after its own styles.
          example: ".header { background: #1d4ed8; }"
    StatusPageSiteInput:
      type: object
      description: A site listed on a status page.
      required:
      - site_id
      properties:
        site_id:
          type: string
          format: uuid
          description: Identifier of a site on this account
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        display_name:
          type:
          - string
          - 'null'
          minLength: 1
          description: null uses the monitor's own name; "" is refused.
        description:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 80
          description: null shows no description; "" is refused.
    StatusPageCheckInInput:
      type: object
      description: A check-in listed on a status page.
      required:
      - check_in_id
      properties:
        check_in_id:
          type: string
          description: ID of a check-in on this account
          example: XZbIlD
        display_name:
          type:
          - string
          - 'null'
          minLength: 1
          description: null uses the monitor's own name; "" is refused.
        description:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 80
          description: null shows no description; "" is refused.
    Stream:
      type: object
      description: An Insights event stream
      properties:
        id:
          type: string
          description: 'Stream ID: 12 lowercase hex characters, randomly assigned.
            Pass it in `stream_ids` when querying.

            '
          pattern: "^[0-9a-f]{12}$"
          example: a3f19c02b7de
        name:
          type: string
          description: Display name
          example: Default
        slug:
          type: string
          description: Stable short name
