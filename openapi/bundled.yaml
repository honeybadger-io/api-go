    DashboardUpdateInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          example: Production overview
          maxLength: 255
        default_ts:
          type:
          - string
          - 'null'
          description: Default time range. Null clears it.
        widgets:
          type: array
          items:
            "$ref": "#/components/schemas/DashboardWidgetInput"
          default: []
          description: The dashboard's widgets, kept and read back in this order.
            Sent on an update, the list replaces the stored one.
      description: 'Fields to change on a dashboard. A field left out keeps its current
        value. `widgets` replaces the whole list: to remove a widget, send the list
        without it. A widget that keeps its `id` is updated in place, and one without
