    TimeSeriesLinks:
      type: object
      description: Navigation links for a time-ordered collection. Each link is a
        root-relative path (`/v3/...`); resolve it against the API host.
      required:
      - self
      properties:
        self:
          type: string
          format: uri-reference
          description: This page
          example: "/v3/projects/Xk9mZp/deploys?limit=25"
        older:
          type:
          - string
          - 'null'
          description: Page of older items, or null when none exist
          example: "/v3/projects/Xk9mZp/deploys?before=eyJ0IjoxNzA0MDY3MjAwMTIzNDU2LCJpIjoiRHAyeU5rIn0&limit=25"
        newer:
          type:
          - string
          - 'null'
          description: 'Page of newer items, or null when none exist. Always null
            on one-directional collections, which are documented as such.

            '
          example: "/v3/projects/Xk9mZp/deploys?after=eyJ0IjoxNzA0MTUzNjAwMTIzNDU2LCJpIjoiRHA4d1FzIn0&limit=25"
    TimeSeriesPagination:
      type: object
      description: Pagination for a time-ordered collection
      required:
      - limit
      - has_older
      - has_newer
      properties:
        limit:
          type: integer
          description: Maximum items per page
          minimum: 1
          maximum: 100
          example: 25
        has_older:
          type: boolean
          description: Whether older items exist. When true, follow `links.older`.
        has_newer:
          type: boolean
          description: Whether newer items exist. When true, follow `links.newer`.
        oldest_cursor:
          type:
          - string
          - 'null'
          description: 'Cursor for the oldest item on this page. Pass it back unchanged
            as `before`. Absent or null on collections that page on a timestamp rather
            than a cursor; use `links.older` instead.

            '
          example: eyJ0IjoxNzA0MDY3MjAwLCJpIjoiTm04cFF4In0
        newest_cursor:
          type:
          - string
          - 'null'
          description: 'Cursor for the newest item on this page. Pass it back unchanged
            as `after`. Absent or null on collections that page on a timestamp rather
            than a cursor, and on one-directional collections; use `links.newer` instead.

            '
          example: eyJ0IjoxNzA0MTUzNjAwLCJpIjoiWGs5bVpwIn0
    UptimeCheck:
      type: object
