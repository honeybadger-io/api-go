    CheckIn:
      type: object
      description: A scheduled task check-in monitor
      required:
      - id
      - project_id
      - schedule_type
      - links
      - name
      - slug
      - state
      - reported_at
      - expected_at
      - missed_count
      - grace_period
      - report_url
      - cron_timezone
      - created_at
      properties:
        id:
          readOnly: true
          type: string
          description: Unique identifier
          example: Ci5xWq
        project_id:
          readOnly: true
          type: string
          description: ID of the project this check-in belongs to
          example: Xk9mZp
        name:
          type:
          - string
          - 'null'
          description: Display name
          example: Daily Backup
        slug:
          type:
          - string
          - 'null'
          description: URL-safe identifier
          example: daily-backup
        schedule_type:
          "$ref": "#/components/schemas/CheckInScheduleType"
        state:
          readOnly: true
          type: string
          description: Current check-in state
          enum:
          - pending
          - reporting
          - missing
          - paused
        reported_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the last report was received
        expected_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the next report is expected
        missed_count:
          readOnly: true
          type: integer
          description: Number of consecutive missed reports
        grace_period:
          type: string
          pattern: "^(\\d+ (second|minute|hour|day|week|month|year)s?)( \\d+ (second|minute|hour|day|week|month|year)s?)*$|^\\d\\d:\\d\\d:\\d\\d$"
          description: 'How long after the expected time before the check-in is missing.
            A duration such as `5 minutes`, `1 hour 30 minutes` or `01:30:00`. Reads
            return the canonical long form (`1 week` reads `7 days`); every form a
            read returns can be written back. Compare periods by duration, not text.
            Zero reads as `00:00:00`.

            '
          example: 10 minutes
        report_url:
          readOnly: true
          type: string
          description: URL to ping when the task completes
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the check-in was created
        cron_schedule:
          type:
          - string
          - 'null'
          description: Cron expression (for cron schedule type)
          example: 0 2 * * *
        cron_timezone:
          type: string
          description: Timezone for cron schedule, as a Rails zone name. `UTC` on
            a simple check-in.
          example: Eastern Time (US & Canada)
        report_period:
          type:
          - string
          - 'null'
          description: 'How often a report is expected, for `simple` schedules. Same
            format as `grace_period`. Null for `cron` schedules, which use `cron_schedule`.

            '
          example: 1 day
        links:
          "$ref": "#/components/schemas/WebLinks"
    CheckInReplaceInput:
      type: object
      description: 'The project''s complete set of check-ins. This replaces rather
        than merges: any check-in the project has and this payload does not name is
        DELETED. Must be a non-empty array, and every entry needs a slug — an empty
        payload is rejected rather than taken to mean "delete all of them".

        '
      required:
      - check_ins
      properties:
        check_ins:
          type: array
          minItems: 1
          items:
            "$ref": "#/components/schemas/CheckInReplaceEntry"
    CheckInReplaceEntry:
      description: 'One check-in in a replace request, matched to an existing check-in
        by slug. A match is updated, and an unmatched slug creates a new check-in.

        '
      allOf:
      - "$ref": "#/components/schemas/CheckInInput"
      - type: object
        required:
        - slug
        properties:
          slug:
            type: string
            pattern: "\\S"
            description: Identifies which check-in an entry refers to, so it is required
              here
    CheckInScheduleType:
      type: string
      enum:
      - simple
      - cron
      default: simple
      description: "`simple` expects a report every `report_period`. `cron` expects
        reports on a cron schedule and requires `cron_schedule`.\n"
    FaultMerge:
      type: object
      description: A queued merge
      required:
      - batch_id
      - source_id
      - target_id
      properties:
        batch_id:
          type: string
          description: Identifies the background merge
          example: WksB67FpRY3bZQ
        source_id:
          type: string
          description: ID of the fault merged away — the one from the path
          example: '12345'
        target_id:
          type: string
          description: ID of the fault kept
          example: '67890'
    FaultMergeInput:
      type: object
      description: Names the fault to merge into
      required:
      - target_fault_id
      additionalProperties: false
      properties:
        target_fault_id:
          type: string
          description: 'ID of the fault to keep. Must be in the same project as the
            fault in the path, which is the one being merged away.

            '
          example: '12345'
    AlarmTriggerCondition:
      type: object
      description: The comparison against the query's result that fires the trigger
      required:
      - operator
      - value
      properties:
        operator:
          type: string
          enum:
          - gt
          - gte
          - lt
          - lte
          - eq
          - neq
          description: 'How the query''s result is compared with `value`: greater
            than, greater than or equal, less than, less than or equal, equal, or
            not equal.

            '
          example: gt
        value:
          type: number
          format: double
          description: Threshold to compare against. `alert_result_count` takes a
            whole number >= 0.
          example: 10
    PauseDuration:
      type: string
      enum:
      - hour
      - day
      - week
      description: A duration of an hour, a day or a week.
    CheckInEvent:
      type: object
      description: A check-in event
      required:
      - check_in_id
      - state
      - created_at
      properties:
        check_in_id:
          type: string
          description: ID of the check-in
          example: Ci5xWq
        state:
          type: string
          enum:
          - reporting
          - missing
          - paused
          description: The state the check-in entered
          example: reporting
        created_at:
          type: string
          format: date-time
          description: When the event occurred
        payload:
          type:
          - string
          - 'null'
          description: The payload reported with the check-in, as it was sent. Only
            retained on plans with advanced check-ins.
    CheckInCreateInput:
      description: Attributes for creating a check-in.
      allOf:
      - "$ref": "#/components/schemas/CheckInInput"
    CheckInInput:
      type: object
      description: 'Writable check-in attributes. A key this operation doesn''t take
        is 422; the read-only keys a GET returns are ignored.

        '
      properties:
        name:
          type:
          - string
          - 'null'
          description: Send null to clear; an unnamed check-in shows its ID.
          example: Nightly billing job
        slug:
          type:
          - string
          - 'null'
          description: 'Short identifier used in the check-in''s reporting URL. Send
            null to clear. Renaming it breaks jobs reporting to `…/check_in/<project
            key>/<slug>` and changes how `PUT /check_ins` matches this check-in.

            '
          example: nightly-billing
        schedule_type:
          description: 'Switching to `simple` clears `cron_schedule` and resets `cron_timezone`
            to `UTC`; switching to `cron` clears `report_period`.

            '
          allOf:
          - "$ref": "#/components/schemas/CheckInScheduleType"
        report_period:
          type:
          - string
          - 'null'
          pattern: "^(\\d+ (second|minute|hour|day|week|month|year)s?)( \\d+ (second|minute|hour|day|week|month|year)s?)*$|^\\d\\d:\\d\\d:\\d\\d$"
          description: 'How often a report is expected, for `simple` schedules. Required
            unless `schedule_type` is `cron`, and may not be zero. A duration such
            as `5 minutes`, `1 hour 30 minutes` or `01:30:00`. Reads return the canonical
            long form (`1 week` reads `7 days`); every form a read returns can be
            written back. Compare periods by duration, not text.

            '
          example: 1 day
        grace_period:
          type:
          - string
          - 'null'
          default: '00:00:00'
          pattern: "^(\\d+ (second|minute|hour|day|week|month|year)s?)( \\d+ (second|minute|hour|day|week|month|year)s?)*$|^\\d\\d:\\d\\d:\\d\\d$"
          description: 'How long after the expected time before the check-in is considered
            missing. Same format as `report_period`; zero is `00:00:00`. Send null
            to reset to zero.

            '
          example: 10 minutes
        cron_schedule:
          type:
          - string
          - 'null'
          description: Cron expression, required when `schedule_type` is `cron`.
          example: 0 3 * * *
        cron_timezone:
          type:
          - string
          - 'null'
          default: UTC
          description: 'Timezone the cron schedule is evaluated in. A Rails/ActiveSupport
            zone NAME, not an IANA identifier — `Central Time (US & Canada)`, not
            `America/Chicago`, which is rejected. Required when `schedule_type` is
            `cron`. Send null to reset to `UTC`.

            '
          example: Central Time (US & Canada)
    Comment:
      type: object
      description: A comment on a fault
      required:
      - id
      - fault_id
      - created_at
      - links
      - author
      - body
      - source
      - event
      properties:
        id:
          type: string
          description: Unique identifier
          example: Cm7pLx
        fault_id:
          type: string
          description: ID of the fault this comment belongs to
          example: '12345'
        author:
          type:
          - object
          - 'null'
          description: Author of the comment
          properties:
            id:
              type:
              - string
              - 'null'
              description: ID of the author
            name:
              type:
              - string
              - 'null'
              description: Name of the author
            email:
              type:
              - string
              - 'null'
              description: Email of the author; null for authors known only by name,
                such as an account token or name-only feedback
        body:
          type:
          - string
          - 'null'
          description: Comment body text
        source:
          type: string
          description: Source of the comment
        event:
          type:
          - string
          - 'null'
          description: Event type associated with the comment
        created_at:
          type: string
          format: date-time
          description: When the comment was created
        links:
          "$ref": "#/components/schemas/WebLinks"
    CommentInput:
      type: object
      description: Writable comment attributes
      required:
      - body
      additionalProperties: false
      properties:
        body:
          type: string
          description: The comment text. `@mentions` notify the named project members.
          example: Rolled back, watching for recurrence.
    Dashboard:
      type: object
      description: An Insights dashboard
      required:
      - id
      - project_id
      - title
      - links
      - default_ts
      - widgets
      - is_default
      - shared
      - created_at
      - updated_at
      properties:
        id:
          readOnly: true
          type: string
          description: Unique identifier
          example: Db4rKn
        project_id:
          readOnly: true
          type: string
          description: ID of the project this dashboard belongs to
          example: Xk9mZp
        title:
          type: string
          description: Dashboard title
          example: Performance Overview
        widgets:
          type: array
          description: 'The dashboard''s widgets, in the same shape a write accepts
            — the read and write forms are identical, including `config.streams` as
            stream slugs (`stream_ids` exists only inside the model).

            '
          items:
            "$ref": "#/components/schemas/DashboardWidget"
        is_default:
          readOnly: true
          type: boolean
          description: Whether this is the default dashboard
        shared:
          readOnly: true
          type: boolean
          description: Whether the dashboard is shared with all team members
        default_ts:
          type:
          - string
          - 'null'
          description: Default time range for the dashboard
          example: PT3H
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the dashboard was created
        updated_at:
          readOnly: true
          type: string
          format: date-time
          description: When the dashboard was last updated
        links:
          "$ref": "#/components/schemas/WebLinks"
    DashboardWidget:
      type: object
      description: A widget on an Insights dashboard
      required:
      - type
      properties:
        id:
          type: string
          description: 'Stable identifier for the widget. Regenerated when a write
            omits it, so a read-edit-write round trip must echo this back to keep
            widget identity.

            '
        type:
          type: string
          description: Which kind of widget, and therefore which config shape applies.
          enum:
          - insights_vis
          - alarms
          - deployments
          - checkins
          - uptime
          - errors
        grid:
          type: object
          description: Position and size on the dashboard grid.
          additionalProperties: false
          properties:
            x:
              type: integer
              minimum: 0
            "y":
              type: integer
              minimum: 0
            w:
              type: integer
              minimum: 1
            h:
              type: integer
              minimum: 1
        presentation:
          type: object
          description: Display-only chrome.
          additionalProperties: false
          properties:
            title:
              type: string
              maxLength: 255
            subtitle:
              type: string
              maxLength: 255
        config:
          type: object
          description: 'Type-specific configuration. Its accepted fields depend on
            `type` and are enforced on write by the dashboard validator; left open
            here because the conditional that selects them cannot be expressed as
            a single static type.

            '
          additionalProperties: true
    DashboardInput:
      type: object
      required:
      - title
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 255
        default_ts:
          type:
          - string
          - 'null'
          description: Default time range. Send null to clear.
        widgets:
          type: array
          items:
            "$ref": "#/components/schemas/DashboardWidgetInput"
    DashboardUpdateInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 255
        default_ts:
          type:
          - string
          - 'null'
          description: Default time range. Send null to clear.
        widgets:
          type: array
          items:
            "$ref": "#/components/schemas/DashboardWidgetInput"
      description: 'Fields to change on a dashboard. A field left out keeps its current
        value. `widgets` replaces the whole list: to remove a widget, send the list
        without it. A widget that keeps its `id` is updated in place, and one without
        an `id` is added.

        '
    Deploy:
      type: object
      description: A deploy event
      required:
      - id
      - project_id
      - environment
      - revision
      - repository
      - local_username
      - created_at
      properties:
        id:
          type: string
          description: Unique identifier
          example: Dp2yNk
        project_id:
          type: string
          description: ID of the project this deploy belongs to
          example: Xk9mZp
        environment:
          type:
          - string
          - 'null'
          description: Deploy environment; null when the deploy named none
          example: production
        revision:
          type:
          - string
          - 'null'
          description: Source control revision
          example: a1b2c3d4
        repository:
          type:
          - string
          - 'null'
          description: Source control repository
          example: acme/app
        local_username:
          type:
          - string
          - 'null'
          description: Username of the person who triggered the deploy
          example: jane
        created_at:
          type: string
          format: date-time
          description: When the deploy was recorded
    Environment:
      type: object
      description: A project environment configuration
      required:
      - id
      - project_id
      - name
      - notifications
      - created_at
      properties:
        id:
          readOnly: true
          type: string
          description: Unique identifier
          example: En6tRm
        project_id:
          readOnly: true
          type: string
          description: ID of the project this environment belongs to
          example: Xk9mZp
        name:
          type: string
          description: Environment name
          example: production
        notifications:
          type: boolean
          description: Whether notifications fire for this environment.
        created_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the environment was created
    EnvironmentCreateInput:
      type: object
      description: A new environment. Names are unique per project and case-sensitive.
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: production
        notifications:
          type:
          - boolean
          - 'null'
          default: true
          description: Whether errors in this environment notify. Send null for the
            default.
    EnvironmentInput:
      type: object
      description: 'Fields to change on an environment. Omitted fields are unchanged.
        A key this operation doesn''t take is 422; the read-only keys a GET returns
        are ignored.

        '
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Can only be sent with its current value; an environment can't
            be renamed.
          example: production
        notifications:
          type:
          - boolean
          - 'null'
          description: Whether errors in this environment notify. Send null to reset
            to true.
    Error:
      type: object
      description: API error response
      required:
      - error
      properties:
        error:
          "$ref": "#/components/schemas/ErrorBody"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    ErrorBody:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 'Machine-readable code. Branch on this rather than on the message,
            which is free text and may be the upstream service''s own wording.

            '
          enum:
          - unauthorized
          - unsupported_auth_scheme
          - credential_in_query
          - access_denied
          - insufficient_scope
          - requires_user_token
          - project_restricted
          - account_inactive
          - account_parked
          - feature_unavailable
          - not_found
          - validation_error
          - delete_failed
          - limit_reached
          - rate_limit_exceeded
          - concurrent_request
          - streams_provisioning
          - project_key_not_accepted
          - maintenance_mode
          - invalid_parameter
          - forbidden_attributes
          - service_unavailable
          - ambiguous_account
          - fault_merged
        message:
          type: string
          description: Human-readable explanation
          example: Access denied
        details:
          description: 'A list of field errors for `validation_error`, `invalid_parameter`,
            `feature_unavailable`, and `limit_reached` from PUT /check_ins; an object
            naming the missing permission for `insufficient_scope`, or the surviving
            fault for `fault_merged`. Absent for every other code.

            '
          oneOf:
          - type: array
            title: ValidationErrorDetails
            description: Present on validation_error, one entry per field that failed
            items:
              "$ref": "#/components/schemas/ErrorDetail"
          - type: object
            title: InsufficientScopeDetails
            description: 'What the endpoint required and what the credential holds,
              so a client can tell the holder exactly what to re-grant.

              '
            required:
            - required_scope
            - token_scopes
            properties:
              required_scope:
                type: string
                description: The permission this endpoint requires.
                example: faults:write
              token_scopes:
                type: array
                description: The permissions the credential actually holds.
                items:
                  type: string
          - type: object
            title: FaultMergedDetails
            description: 'The fault this one was merged into. Writes are refused rather
              than redirected, leaving the caller to decide whether to act on the
              surviving fault.

              '
            required:
            - merged_into
            - location
            properties:
              merged_into:
                type: string
                description: ID of the fault this one was merged into.
                example: '12345'
              location:
                type: string
                format: uri
                description: Absolute v3 URL of the surviving fault.
    ErrorDetail:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
          description: The field that failed validation
          example: name
        message:
          type: string
          description: Why it failed, without the field name repeated
          example: can't be blank
    Fault:
      type: object
      description: A unique error fingerprint (fault)
      required:
      - id
      - project_id
      - message
      - created_at
      - links
      properties:
        id:
          type: string
          description: Unique identifier. Like every v3 ID it's an opaque string,
            although today it's the fault's number.
          example: '12345'
        project_id:
          type: string
          description: ID of the project this fault belongs to
          example: Xk9mZp
        klass:
          type:
          - string
          - 'null'
          description: Error class name
          example: NoMethodError
        message:
          type: string
          description: Error message
          example: undefined method 'foo' for nil:NilClass
        component:
          type:
          - string
          - 'null'
          description: Component where the error occurred
          example: UsersController
        action:
          type:
          - string
          - 'null'
          description: Action where the error occurred
          example: show
        environment:
          type:
          - string
          - 'null'
          description: Environment name
          example: production
        resolved:
          type: boolean
          description: Whether the fault is resolved
        ignored:
          type: boolean
          description: Whether the fault is ignored
        created_at:
          type: string
          format: date-time
          description: When the fault was first reported
        last_notice_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the last notice was received
        notices_count:
          type: integer
          description: Total number of notices for this fault
        comments_count:
          type: integer
          description: Number of comments on this fault
        tags:
          type: array
          items:
            type: string
          description: Tags assigned to this fault
          example:
          - critical
          - backend
        assignee_id:
          type:
          - string
          - 'null'
          description: Same as `assignee.id`. Written by POST …/assign.
        snoozed:
          type: boolean
          readOnly: true
          description: Whether a snooze is in effect now. A new snooze replaces any
            existing one.
        assignee:
          type:
          - object
          - 'null'
          description: User assigned to this fault
          properties:
            id:
              type: string
              description: ID of the assignee
            name:
              type:
              - string
              - 'null'
              description: Name of the assignee
            email:
              type: string
              description: Email of the assignee
        last_notice_deploy:
          description: 'The deploy that was live when the error last occurred: the
            newest deploy in the fault''s environment before `last_notice_at`. A guess
            from timing, not the deploy that introduced or resolved the error.

            '
          oneOf:
          - "$ref": "#/components/schemas/Deploy"
          - type: 'null'
        tickets:
          type: array
          description: Issue tracker tickets linked to this fault
          items:
            type: object
            properties:
              url:
                type: string
                description: URL of the ticket
              channel_id:
                type: string
                description: ID of the channel that created the ticket
        resolve_on_deploy:
          type: boolean
          description: 'Whether this fault is waiting to be resolved by the next recorded
            deploy. Absent for a fault on an inactive project.

            '
        recording_paused_until:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When a recording pause ends; null when recording is not paused.
            Absent for a fault on an inactive project.

            '
        notices_count_in_range:
          type: integer
          description: 'Notices inside the requested occurrence window. Present only
            when the request supplied `occurred_after` or `occurred_before`.

            '
        links:
          "$ref": "#/components/schemas/WebLinks"
    FaultAssignmentInput:
      type: object
      description: Who to assign a fault to
      required:
      - assignee_id
      additionalProperties: false
      properties:
        assignee_id:
          type: string
          description: 'ID of a user on the project. An ID that is not a member is
            rejected with 422 rather than silently unassigning. DELETE the same path
            to unassign.

            '
          example: Xk9mZp
    FaultSelectionInput:
      type: object
      description: Selects the faults a bulk operation applies to
      additionalProperties: false
      properties:
        all:
          type: boolean
          description: 'Apply to every fault the other filters match, which with no
            other filters is every fault in the project. Required to make an unbounded
            change explicit; ignored when fault_ids names specific faults.

            '
          example: false
        dry_run:
          type: boolean
          description: 'Report what the request would change without changing it —
            no state change, no comments, no timeline entries. The response has the
            same shape either way, with `dry_run` echoed back.

            '
          example: false
        fault_ids:
          type: array
          description: 'IDs of the faults to change. An ID that isn''t a fault in
            this project fails the whole request with 422. Omit to act on everything
            the query and time filters match; with no filters, that requires all=true.

            '
          items:
            type: string
          example:
          - '12345'
          - '12346'
        q:
          type: string
          description: Search query, applied when fault_ids is omitted
          example: "-is:resolved"
        created_after:
          type: number
          format: double
          description: 'Only faults created after this Unix timestamp. Applied when
            fault_ids is omitted, alongside q.

            '
        occurred_after:
          type: number
          format: double
          description: 'Only faults that occurred after this Unix timestamp. Applied
            when fault_ids is omitted, alongside q.

            '
        occurred_before:
          type: number
          format: double
          description: 'Only faults that occurred before this Unix timestamp. Applied
            when fault_ids is omitted, alongside q.

            '
    FaultBulkResult:
      type: object
      required:
      - count
      - dry_run
      - fault_ids
      properties:
        count:
          type: integer
          description: 'How many faults changed. Exact, and counts what changed rather
            than what matched: resolving a hundred faults of which ninety were already
            resolved reports ten. On a dry run, how many would have changed.

            '
          example: 12
        dry_run:
          type: boolean
          description: 'True when nothing was written. Echoed back so a response is
            never ambiguous about whether it took effect.

            '
          example: false
        fault_ids:
          type: array
          description: 'IDs of the faults that changed, capped at 100. `count` is
            exact regardless; see fault_ids_truncated.

            '
          items:
            type: string
          example:
          - '12345'
          - '12346'
        fault_ids_truncated:
          type: boolean
          description: True when more faults changed than fault_ids lists.
          example: false
    FaultInput:
      type: object
      description: Writable fault attributes
      additionalProperties: false
      properties:
        resolved:
          type: boolean
        ignored:
          type: boolean
        assignee_id:
          type:
          - string
          - 'null'
          description: 'ID of a user on the project. Null unassigns. An ID that is
            not a member of this project is rejected with 422 rather than silently
            unassigning.

            '
          example: Xk9mZp
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
        resolve_on_deploy:
          type: boolean
          description: |
            Resolve this fault the next time a deploy is recorded. Not a column on the fault — it is stored as a pending resolution — so it is applied after the update succeeds and is echoed back on the fault as `resolve_on_deploy`.

            Setting it on a fault that is already resolved or ignored does nothing, since those states clear any pending resolution. Sending false removes a pending resolution.
    IncidentUpdate:
      type: object
      description: An update to a status page incident. The incident's prose lives
        here, and its current_status, current_severity and closed_at are derived from
        its updates.
      required:
      - id
      - incident_id
      - status
      - severity
      properties:
        id:
          type: string
          description: Unique identifier
          example: Iu6tMn
        incident_id:
          type: string
          description: ID of the incident
          example: In3pKr
        message:
          type:
          - string
          - 'null'
          description: The update's prose
          example: We have identified the cause and are rolling back.
        status:
          type: string
          description: Status at the time of the update
          enum:
          - maintenance_scheduled
          - in_maintenance
          - maintenance_complete
          - investigating
          - identified
          - resolving
          - monitoring
          - resolved
        severity:
          type: string
          description: Severity at the time of the update
          enum:
          - problem_detected
          - degraded_performance
          - partial_outage
          - outage
          - operational
        start_at:
          type: string
          format: date-time
          description: When the update takes effect. A future time schedules it.
        should_notify:
          type:
          - boolean
          - 'null'
          description: Whether the update is announced on the status page's connected
            accounts
        notified_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the announcement was sent
        created_at:
          type: string
          format: date-time
          description: When the update was posted
        updated_at:
          type: string
          format: date-time
          description: When the update was last changed
    IncidentUpdateInput:
      type: object
      description: The writable fields of an incident update. status and severity
        default to investigating and problem_detected. If neither start_at nor start_now
        is given, the update starts now.
      additionalProperties: false
      properties:
        message:
          type: string
          description: The update's prose
          example: We have identified the cause and are rolling back.
        status:
          type: string
          enum:
          - maintenance_scheduled
          - in_maintenance
          - maintenance_complete
          - investigating
          - identified
          - resolving
          - monitoring
          - resolved
        severity:
          type: string
          enum:
          - problem_detected
          - degraded_performance
          - partial_outage
          - outage
          - operational
        start_at:
          type: string
          format: date-time
          description: When the update takes effect. Only a scheduled_maintenance
            incident may set this in the future.
        start_now:
          type: boolean
          description: 'Start the update immediately, ignoring start_at. An update
            that has already started is left as it is, so sending it again changes
            nothing.

            '
        should_notify:
          type: boolean
          description: Announce the update on the status page's connected accounts
            and email the status page's subscribers
    Notice:
      type: object
      description: An individual error occurrence
      required:
      - id
      - fault_id
      - project_id
      - message
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The notice's token UUID, which addresses it globally
          example: 1e2ba1f0-4f3c-4b1a-9c7e-6f2f5c0f1a3b
        fault_id:
          type: string
          description: ID of the fault this notice belongs to
          example: '12345'
        project_id:
          type: string
          description: ID of the project
          example: Xk9mZp
        environment:
          type:
          - string
          - 'null'
          description: 'Environment name, from the fault''s environment or the notice''s
            own environment_name. Null when neither is set.

            '
          example: production
        message:
          type:
          - string
          - 'null'
          description: Error message. Null when the notifier reported none.
          example: undefined method 'foo' for nil:NilClass
        created_at:
          type: string
          format: date-time
          description: When the notice was received
        request:
          type:
          - object
          - 'null'
          description: Request details when the error occurred. Fields not reported
            are null.
          properties:
            url:
              type:
              - string
              - 'null'
              description: Request URL
            component:
              type:
              - string
              - 'null'
              description: Controller or component name
            action:
              type:
              - string
              - 'null'
              description: Action name
            params:
              type:
              - object
              - 'null'
              description: Request parameters
            session:
              type:
              - object
              - 'null'
              description: Session data
        context:
          type: object
          description: Custom context data sent with the notice
          additionalProperties: true
        backtrace:
          type: array
          description: 'Stack trace frames, at most 20. Source-mapped by default;
            pass `unmapped=true` for the frames exactly as the client sent them.

            '
          items:
            "$ref": "#/components/schemas/NoticeFrame"
        backtrace_mode:
          type: string
          enum:
          - source_mapped
          - reported
          description: 'Which representation of the trace this response carries. `source_mapped`
            when a stored mapped trace was served, `reported` when the frames are
            as the client sent them — either because `unmapped=true` was requested
            or because no different mapped trace was stored.

            '
          example: source_mapped
        backtrace_total_frames:
          type: integer
          description: 'Total frames in the selected trace before the 20-frame limit
            was applied.

            '
          example: 25
        backtrace_truncated:
          type: boolean
          description: Whether `backtrace` omits frames because of the 20-frame limit.
          example: true
        request_fields_removed:
          type:
          - array
          - 'null'
          description: 'Names of `request` fields removed at ingest because the payload
            exceeded the size limit. Null when nothing was removed. Present so a caller
            can tell an empty field from a stripped one.

            '
          items:
            type: string
          example:
          - params
        links:
          "$ref": "#/components/schemas/WebLinks"
    NoticeFrame:
      type: object
      properties:
        file:
          type:
          - string
          - 'null'
          description: 'Path to the source file. Null when the notifier sent a backtrace
            entry that carried no file, or one that was not a frame at all.

            '
          example: app/models/checkout.rb
        line:
          type:
          - integer
          - 'null'
          description: 'Line number within `file`. Null when the notifier sent a value
            that is not a line number, such as `(eval)`.

            '
          example: 42
        column:
          type:
          - integer
          - 'null'
          description: Column number. Usually present only on source-mapped frames.
          example: 8
        method:
          type:
          - string
          - 'null'
          description: 'Name of the method or function. Null when the notifier omitted
            it, and routinely on source-mapped frames where the map carries no name
            for the position.

            '
          example: submit_order
        in_app:
          type: boolean
          description: 'Whether this frame is the project''s own code rather than
            a framework, gem or dependency. Derived from the project root the notifier
            reported.

            '
          example: true
        mapping:
          type: string
          enum:
          - source_mapped
          - reported
          description: 'Whether this specific frame was resolved through a source
            map. Mapping is applied one frame at a time and falls back to the reported
            frame, so a source-mapped trace can contain reported frames. Always `reported`
            when `unmapped=true` was requested.

            '
          example: source_mapped
        source:
          type: array
          description: 'Contiguous runs of source lines around the frame. Normally
            one block; a notifier-sent snippet with a gap produces one block per run.
            Empty when no source is available, when the notifier sent it in a shape
            other than a map of line number to content, or when no entry carried a
            usable line number. At most 25 lines in total.

            '
          items:
            "$ref": "#/components/schemas/SourceBlock"
    SourceBlock:
      type: object
      required:
      - first_line
      - lines
      properties:
        first_line:
          type: integer
          description: Line number of the first entry in `lines`.
          example: 41
        lines:
          type: array
          description: 'Source lines in order. Each line is truncated to 1024 characters.
            Across all of a frame''s blocks at most 25 lines are returned, chosen
            nearest the frame''s own line so that line is always present when the
            notifier sent it.

            '
          items:
            type: string
            maxLength: 1024
          example:
          - "  def submit"
          - "    charge!"
          - "  end"
    OccurrenceMeta:
      type: object
      properties:
        request_id:
          type: string
        period:
          type: string
          enum:
          - hour
          - day
          - week
          - month
          description: The window used, which is `hour` when none was requested
        interval:
          type: string
          enum:
          - minute
          - hour
          - day
          description: Bucket width implied by the period
    OccurrenceSeries:
      type: object
      required:
      - project_id
      - buckets
      properties:
        project_id:
          type: string
          description: ID of the project this series belongs to
          example: Xk9mZp
        buckets:
          type: array
          description: 'One entry per interval in the window, oldest first, including
            intervals with no notices.

            '
          items:
            type: object
            required:
            - timestamp
            - count
            properties:
              timestamp:
                type: integer
                format: int64
                description: Start of the interval, Unix seconds
                example: 1704067200
              count:
                type: integer
                description: Notices recorded in this interval
                example: 17
    OffsetLinks:
      type: object
      description: Navigation links for a numbered-page collection
      required:
      - self
      properties:
        self:
          type: string
          format: uri-reference
          description: This page
        first:
          type: string
          format: uri-reference
          description: First page
        prev:
          type:
          - string
          - 'null'
          description: Previous page, or null on the first page
        next:
          type:
          - string
          - 'null'
          description: Next page, or null on the last page
    Outage:
      type: object
      description: An uptime outage period
      required:
      - id
      - site_id
      - down_at
      - status
      - reason
      - headers
      - created_at
      - links
      - up_at
      - duration_seconds
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
          example: 3d7a1c94-6f28-4e5b-8a13-c5e9b204d6f8
        site_id:
          type: string
          format: uuid
          description: Identifier of the site
          example: 9f8b6d2e-4c1a-4b7f-9e35-2a6c8d0f1b47
        down_at:
          type: string
          format: date-time
          description: When the site went down
        up_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the site came back up, or null while it is still down
        status:
          type:
          - integer
          - 'null'
          description: HTTP status of the check that went down
        reason:
          type:
          - string
          - 'null'
          description: Why the check failed
        headers:
          type: object
          description: Response headers of the failing check
          additionalProperties:
            type: string
        duration_seconds:
          type:
          - integer
          - 'null'
          description: Duration of the outage in seconds
        created_at:
          type: string
          format: date-time
          description: When the outage record was created
        links:
          "$ref": "#/components/schemas/WebLinks"
    Pagination:
      type: object
      description: Offset-based pagination information
      required:
      - page
      - per_page
      properties:
        page:
          type: integer
          description: Current page number
          minimum: 1
          example: 1
        per_page:
          type: integer
          description: Items per page
          minimum: 1
          maximum: 100
          example: 25
    Project:
      type: object
      description: A Honeybadger project
      required:
      - id
      - account_id
      - name
      - asana_workspace_id
      - active
      - links
      - disable_public_links
      - environments
      - language
      - resolve_errors_on_deploy
      - user_url
      - source_url
      - user_search_field
      - customer_throttle
      - fault_count
      - unresolved_fault_count
      - last_notice_at
      - earliest_notice_at
      - purge_days
      - created_at
      properties:
        id:
          readOnly: true
          type: string
          description: Unique identifier
          example: Xk9mZp
        account_id:
          readOnly: true
          type: string
          description: ID of the account this project belongs to
          example: Ab3kL9
        name:
          type: string
          description: Project name
          example: My Rails App
        active:
          readOnly: true
          type: boolean
          description: Whether the project is active
        disable_public_links:
          type: boolean
          description: Whether public error links are disabled
        environments:
          readOnly: true
          type: array
          items:
            type: string
          description: List of environment names seen in this project
          example:
          - production
          - staging
          - development
        resolve_errors_on_deploy:
          type: boolean
          description: Whether recording a deploy resolves every open fault
        user_url:
          type:
          - string
          - 'null'
          description: 'Template linking a fault''s affected user into your own system.
            `[user_id]` and `[user_email]` are substituted.

            '
          example: https://admin.example.com/users/[user_id]
        source_url:
          type:
          - string
          - 'null'
          description: 'Template linking a backtrace line to your source host. `[file]`
            and `[line]` are substituted.

            '
          example: https://github.com/acme/app/blob/main/[file]#L[line]
        user_search_field:
          type:
          - string
          - 'null'
          description: 'Context key identifying the affected user, when it is not
            in the default `context.user_email` or `context.user_id`.

            '
          example: context.account_id
        asana_workspace_id:
          type:
          - string
          - 'null'
          description: Asana workspace used by the project's Asana integration
        customer_throttle:
          type:
          - integer
          - 'null'
          description: Notices accepted per minute before throttling kicks in
        language:
          type:
          - string
          - 'null'
          description: Primary programming language
          example: Ruby
        fault_count:
          readOnly: true
          type: integer
          description: Total number of faults (errors) in this project
        unresolved_fault_count:
          readOnly: true
          type: integer
          description: Number of unresolved faults
        last_notice_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the last error was received
        earliest_notice_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: Earliest available notice (based on retention)
        purge_days:
          type:
          - integer
          - 'null'
          description: Data retention period in days
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the project was created
        links:
          "$ref": "#/components/schemas/WebLinks"
    ProjectCreateInput:
      description: Attributes for creating a project.
      allOf:
      - "$ref": "#/components/schemas/ProjectInput"
      - type: object
        required:
        - name
        properties:
          disable_email_notifications:
            type: boolean
            writeOnly: true
            description: 'Create-only. Members added with the project get email notifications
              switched off. Not a stored setting, so reading a project never returns
              it.

              '
          team_id:
            type: string
            description: 'Puts the new project in this team. Create-only: afterwards
              the team''s `project_ids` owns membership. Including it requires team:write
              in addition to the operation''s project scope, and the user must be
              allowed to manage the team. Without team:write the entire request is
              rejected with 403 insufficient_scope; no other fields are saved. An
              ID that isn''t a team on this account fails the request with 422.

              '
            example: Ab3kL9
    ProjectInput:
      type: object
      description: 'Writable project attributes. Omitted fields are unchanged; null
        resets or clears the fields marked nullable. A key this operation doesn''t
        take, including the create-only `team_id` and `disable_email_notifications`,
        is 422; the read-only keys a GET returns are ignored.

        '
      properties:
        name:
          type: string
          description: Project name
          example: Billing API
        resolve_errors_on_deploy:
          type:
          - boolean
          - 'null'
          default: true
          description: Resolve every open fault when a deploy is recorded. Send null
            to reset to true.
        disable_public_links:
          type:
          - boolean
          - 'null'
          default: false
          description: Disallow shareable public fault links. Send null to reset to
            false.
        language:
          type:
          - string
          - 'null'
          description: Primary language, used to format backtraces. Send null to clear.
          example: ruby
        user_url:
          type:
          - string
          - 'null'
          description: 'Template for linking a fault''s affected user into your own
            system. `[user_id]` and `[user_email]` are substituted. Send null to clear.

            '
          example: https://admin.example.com/users/[user_id]
        source_url:
          type:
          - string
          - 'null'
          description: 'Template for linking a backtrace line to your source host.
            `[file]` and `[line]` are substituted. Send null to clear.

            '
          example: https://github.com/acme/app/blob/main/[file]#L[line]
        user_search_field:
          type:
          - string
          - 'null'
          description: 'Context key identifying the affected user, for when it is
            not in the default `context.user_email` or `context.user_id`. Send null
            to clear.

            '
          example: context.account_id
        asana_workspace_id:
          type:
          - string
          - 'null'
          description: Asana workspace used by the project's Asana integration. Send
            null to clear.
        customer_throttle:
          type:
          - integer
          - 'null'
          description: Notices accepted per minute before throttling kicks in. Send
            null to clear.
        purge_days:
          type:
          - integer
          - 'null'
          description: 'Days to retain notices. Accepted only on accounts with custom
            retention; otherwise a value other than the current one (on create, the
            default) is refused with 403 `feature_unavailable`. Send null to clear.

            '
    ProjectKey:
      type: object
      description: 'A Project Key: what an app sends errors and events with, set as
        `api_key` in a notifier''s config. It only sends data; reading or managing
        anything through the API takes an API Token.

        '
      required:
      - id
      - project_id
      - key
      - label
      - created_at
      properties:
        id:
          readOnly: true
          type: string
          description: Identifier for this key. Use it in paths.
          example: Kp7mZq2x
        project_id:
          readOnly: true
          type: string
          description: Identifier of the project the key belongs to.
          example: Xk9mZp
        key:
          readOnly: true
          type: string
          description: 'The Project Key value a notifier sends. Returned in full:
            unlike an API Token, it''s meant to ship with your application.

            '
          example: hbp_aBcDeFgHiJkLmNoPqRsTuVwXyZ012345aB12Cd
        label:
          type:
          - string
          - 'null'
          description: Optional human-readable name.
          example: CI
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the key was created
    ProjectKeyInput:
      type: object
      additionalProperties: false
      properties:
        label:
          type:
          - string
          - 'null'
          description: Optional human-readable name.
          example: CI
    ResponseMeta:
      type: object
      properties:
        request_id:
          type: string
          description: Unique identifier for the request, for correlating with support
    Site:
      type: object
      description: An uptime monitoring site
      required:
      - id
      - project_id
      - name
      - url
      - active
      - links
      - state
      - last_checked_at
      - match_type
      - match
      - request_method
      - frequency
      - locations
      - validate_ssl
      - request_headers
      - request_body
      - outage_threshold
      - timeout
      - created_at
      properties:
        id:
          readOnly: true
          type: string
          format: uuid
          description: Unique identifier
          example: 9f8b6d2e-4c1a-4b7f-9e35-2a6c8d0f1b47
        project_id:
          readOnly: true
          type: string
          description: ID of the project this site belongs to
          example: Xk9mZp
        name:
          type: string
          description: Display name for the site
          example: Production App
        url:
          type: string
          description: URL to monitor. Includes the scheme.
          example: https://app.example.com
        active:
          type: boolean
          description: Whether monitoring is active. After 740 consecutive failed
            checks the server sets it to false.
        state:
          readOnly: true
          type: string
          description: Current state of the site
          enum:
          - pending
          - up
          - down
          example: up
        last_checked_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the site was last checked
        match_type:
          "$ref": "#/components/schemas/SiteMatchType"
        match:
          type:
          - string
          - 'null'
          description: Value to match in the response
        request_method:
          description: HTTP method for checks
          anyOf:
          - "$ref": "#/components/schemas/SiteRequestMethod"
          - type: 'null'
        frequency:
          "$ref": "#/components/schemas/SiteFrequency"
        locations:
          type: array
          uniqueItems: true
          items:
            "$ref": "#/components/schemas/SiteLocation"
          description: Locations checks run from. Unordered. [] means every location.
          example:
          - Virginia
          - London
        validate_ssl:
          type:
          - boolean
          - 'null'
          description: Whether to validate SSL certificates
        request_headers:
          type:
          - object
          - 'null'
          description: Custom headers sent with check requests, as header name to
            value
          additionalProperties:
            type: string
        request_body:
          type:
          - string
          - 'null'
          description: Request body for POST/PUT checks
        outage_threshold:
          type:
          - integer
          - 'null'
          description: Number of failed checks before declaring an outage
        timeout:
          type:
          - integer
          - 'null'
          description: 'The stored request timeout in seconds; null means the default,
            30. On a plan without custom timeouts the default applies whatever is
            stored.

            '
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the site was created
        links:
          "$ref": "#/components/schemas/WebLinks"
    SiteMatchType:
      type: string
      enum:
      - success
      - exact
      - include
      - exclude
      - jmespath
      description: 'How a response is judged. `success`: any 2xx; `match` must be
        left out. `exact`: the response status code equals `match`. `include` / `exclude`:
        the body does / doesn''t contain `match`. `jmespath`: `match` is a JMESPath
        expression evaluated against the JSON body; numbers in it use backticks, not
        quotes.

        '
    SiteFrequency:
      type: integer
      enum:
      - 1
      - 2
      - 5
      - 15
      description: Minutes between checks. A value below the plan's floor is refused.
    SiteLocation:
      type: string
      enum:
      - Virginia
      - Frankfurt
      - Singapore
      - London
      - Oregon
      description: A location uptime checks run from.
    SiteRequestMethod:
      type: string
      enum:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    SiteCreateInput:
      description: Attributes for creating a site. `name` defaults to the URL.
      allOf:
      - "$ref": "#/components/schemas/SiteInput"
      - required:
        - url
    SiteInput:
      type: object
      description: 'Writable uptime-check site attributes. Omitted fields are unchanged;
        null resets or clears the fields marked nullable. A key this operation doesn''t
        take is 422; the read-only keys a GET returns are ignored.

        '
      properties:
        name:
          type: string
          example: Marketing site
        url:
          type: string
          format: uri
          pattern: "^https?://\\S"
          description: Must start with http:// or https://, with no surrounding whitespace.
          example: https://www.example.com/health
        match_type:
          description: Send null to reset to success.
          anyOf:
          - "$ref": "#/components/schemas/SiteMatchType"
          - type: 'null'
        match:
          type:
          - string
          - 'null'
          maxLength: 255
          description: 'What `match_type` compares against (see SiteMatchType). Required
            unless `match_type` is `success`, and must be left out with `success`.
            Send null to clear.

            '
          example: status == 'ok'
        request_method:
          description: Send null to reset to GET.
          anyOf:
          - "$ref": "#/components/schemas/SiteRequestMethod"
          - type: 'null'
        validate_ssl:
          type:
          - boolean
          - 'null'
          description: Fail the check when the TLS certificate does not validate.
            Send null to reset to true.
        request_body:
          type:
          - string
          - 'null'
          maxLength: 32768
          description: Body to send with the request, up to 32 KB. Send null to clear.
        request_headers:
          type:
          - object
          - 'null'
          description: 'Headers to send with the request, as header name to value.
            Replaces the stored headers; send `{}` or null to clear them.

            '
          additionalProperties:
            type: string
          example:
            Authorization: Bearer abc123
        frequency:
          description: 'Minutes between checks. Defaults to 5; plans set the most
            frequent allowed, and a value under it is 403 `feature_unavailable`. Send
            null to reset to 5.

            '
          anyOf:
          - "$ref": "#/components/schemas/SiteFrequency"
          - type: 'null'
        locations:
          type:
          - array
          - 'null'
          description: 'A set of location names to check from. [] or null means every
            location. An unknown name is 422. A set; order is ignored and duplicates
            are dropped.

            '
          items:
            "$ref": "#/components/schemas/SiteLocation"
        outage_threshold:
          type:
          - integer
          - 'null'
          minimum: 1
          description: 'Consecutive failures before an outage is declared. null means
            down once failures reach 50% of locations.

            '
        active:
          type:
          - boolean
          - 'null'
          description: Send null to reset to true.
        timeout:
          type:
          - integer
          - 'null'
          description: 'Request timeout in seconds, 1 to 120, default 30, and less
            than the frequency in seconds. Accepted only on accounts with the uptime-timeout
            feature; otherwise a value other than the current one (on create, the
            default) is refused with 403 `feature_unavailable`. Send null to reset
            to the default.

            '
    StatusPage:
      type: object
      description: 'A public status page. Readable and deletable after the plan loses
        status pages; creating and editing need the feature.

        '
      required:
      - id
      - account_id
      - name
      - url
      - features
      - hide_branding
      - password_protected
      - username
      - links
      - domain
      - created_at
      - domain_verified_at
      - sites
      - check_ins
      - incidents_enabled
      - search_engine_indexing_disabled
      - message_enabled
      - message_title
      - message_body
      - google_analytics_id
      properties:
        id:
          readOnly: true
          type: string
          description: Unique identifier
          example: Sp7bMq
        account_id:
          readOnly: true
          type: string
          description: ID of the account this status page belongs to
          example: Ab3kL9
        name:
          type: string
          description: Status page name
          example: Acme Status
        domain:
          type:
          - string
          - 'null'
          description: Custom domain for the status page
          example: status.acme.com
        features:
          type: object
          description: Presentation copy and styling. Replaced whole by an update.
          additionalProperties: false
          properties:
            home_link:
              type: string
            up_caption:
              type: string
            down_caption:
              type: string
            mixed_caption:
              type: string
            custom_css:
              type: string
        hide_branding:
          type: boolean
        password_protected:
          type: boolean
        username:
          type:
          - string
          - 'null'
          description: Basic-auth user when password protected. The password is never
            returned.
        incidents_enabled:
          type: boolean
          description: Whether the page shows incidents
        search_engine_indexing_disabled:
          type: boolean
          description: Whether search engines are asked not to index the page
        message_enabled:
          type: boolean
          description: Whether the message banner shows
        message_title:
          type:
          - string
          - 'null'
          description: The message banner's title
        message_body:
          type:
          - string
          - 'null'
          description: The message banner's text
        google_analytics_id:
          type:
          - string
          - 'null'
          description: The page's Google Analytics measurement ID
        url:
          readOnly: true
          type: string
          description: URL of the status page
          example: https://acme.statuspage.honeybadger.io
        created_at:
          readOnly: true
          type: string
          format: date-time
          description: When the status page was created
        domain_verified_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the custom domain was verified
        sites:
          type: array
          description: Uptime sites displayed on the status page. An ordered list;
            the order is the order on the page.
          items:
            type: object
            required:
            - site_id
            - display_name
            - description
            properties:
              site_id:
                type: string
                format: uuid
                description: Identifier of the site
              display_name:
                type:
                - string
                - 'null'
                description: Display name on the status page
              description:
                type:
                - string
                - 'null'
                description: Description shown on the status page
        check_ins:
          type: array
          description: Check-ins displayed on the status page. An ordered list; the
            order is the order on the page.
          items:
            type: object
            required:
            - check_in_id
            - display_name
            - description
            properties:
              check_in_id:
                type: string
                description: ID of the check-in
              display_name:
                type:
                - string
                - 'null'
                description: Display name on the status page
              description:
                type:
                - string
                - 'null'
                description: Description shown on the status page
        links:
          "$ref": "#/components/schemas/WebLinks"
    StatusPageIncident:
      type: object
      description: 'An incident on a status page. An incident is a container for a
        thread of updates: the prose lives on each update, and current_status, current_severity
        and closed_at are derived from them and are never writable.'
      required:
      - id
      - status_page_id
      - title
      - build_type
      - retro_should_notify
      - retro_notify_message
      - updates
      - links
      properties:
        id:
          type: string
          description: Unique identifier
          example: In3pKr
        status_page_id:
          type: string
          description: ID of the status page
          example: Sp7bMq
        title:
          type: string
          description: Incident title
          example: Database connectivity issues
        retro_should_notify:
          type: boolean
          description: For a retroactive incident, whether to announce it once on
            the status page's connected accounts
        retro_notify_message:
          type:
          - string
          - 'null'
          description: The announcement sent when retro_should_notify is true
        build_type:
          type: string
          description: How the incident was opened
          enum:
          - current
          - retroactive
          - scheduled_maintenance
        current_status:
          type:
          - string
          - 'null'
          description: Status of the update in effect now. Derived from the updates.
          enum:
          - maintenance_scheduled
          - in_maintenance
          - maintenance_complete
          - investigating
          - identified
          - resolving
          - monitoring
          - resolved
        current_severity:
          type:
          - string
          - 'null'
          description: Severity of the update in effect now. Derived from the updates.
          enum:
          - problem_detected
          - degraded_performance
          - partial_outage
          - outage
          - operational
        start_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the incident starts. Derived from the updates.
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the incident closed, or null while it is open. Derived
            from the updates: it is set once an update reaches resolved or maintenance_complete.'
        created_at:
          type: string
          format: date-time
          description: When the incident was created
        updated_at:
          type: string
          format: date-time
          description: When the incident was last updated
        updates:
          type: array
          description: The incident's thread, newest first. Always at least one update.
          items:
            "$ref": "#/components/schemas/IncidentUpdate"
        links:
          "$ref": "#/components/schemas/WebLinks"
    StatusPageIncidentCreateInput:
      type: object
      description: An incident and the updates it opens with
      required:
      - title
      - updates
      additionalProperties: false
      properties:
        title:
          type: string
          example: Elevated error rates
        build_type:
          type: string
          enum:
          - current
          - retroactive
          - scheduled_maintenance
          description: "`current` is happening now, `retroactive` records something
            already over, `scheduled_maintenance` is planned. Only a scheduled_maintenance
            incident may have updates starting in the future.\n"
        retro_should_notify:
          type: boolean
          description: Announce a retroactive incident when it is created
        retro_notify_message:
          type:
          - string
          - 'null'
          description: Message accompanying that announcement
        updates:
          type: array
          minItems: 1
          description: Updates to create with the incident; at least one
          items:
            "$ref": "#/components/schemas/IncidentUpdateInput"
    StatusPageIncidentUpdateInput:
      type: object
      description: Writable incident attributes
      additionalProperties: false
      properties:
        title:
          type: string
        retro_should_notify:
          type: boolean
        retro_notify_message:
          type:
          - string
          - 'null'
    StatusPageCreateInput:
      description: Attributes for creating a status-page.
      allOf:
      - "$ref": "#/components/schemas/StatusPageInput"
      - required:
        - name
    StatusPageInput:
      type: object
      description: 'Writable status-page attributes. Omitted fields are unchanged;
        null resets or clears the fields marked nullable. A key this operation doesn''t
        take is 422; the read-only keys a GET returns (including each monitor''s state)
        are ignored.

        '
      properties:
        name:
          type: string
          maxLength: 100
          example: Acme Status
        domain:
          type:
          - string
          - 'null'
          description: 'Custom domain the page is served on. Unique across Honeybadger.
            An account can set at most 30 domains a week; past that the change is
            422. Send null to clear.

            '
          example: status.example.com
        incidents_enabled:
          type:
          - boolean
          - 'null'
          description: 'Whether the page shows incidents. Requires status page incidents
            on the plan; changing it otherwise is 403 `feature_unavailable`. On create,
            defaults to whether the plan has them. Send null to reset to false.

            '
        search_engine_indexing_disabled:
          type:
          - boolean
          - 'null'
          description: Asks search engines not to index the page. Send null to reset
            to false.
        message_enabled:
          type:
          - boolean
          - 'null'
          description: Shows the message banner. Send null to reset to false.
        message_title:
          type:
          - string
          - 'null'
          description: The message banner's title. Send null to clear.
        message_body:
          type:
          - string
          - 'null'
          description: The message banner's text. Send null to clear.
        google_analytics_id:
          type:
          - string
          - 'null'
          description: A Google Analytics measurement ID for the page. Send null to
            clear.
        hide_branding:
          type:
          - boolean
          - 'null'
          description: Requires advanced status pages; refused with 403 `feature_unavailable`
            otherwise. Send null to reset to false.
        password_protected:
          type:
          - boolean
          - 'null'
          description: 'Requires advanced status pages and password protection on
            the plan; refused with 403 `feature_unavailable` otherwise. Turning it
            on needs a username and password, sent or already stored, or it''s 422.
            Send null to reset to false.

            '
        username:
          type:
          - string
          - 'null'
          description: Basic-auth user when password protected. Requires advanced
            status pages and password protection on the plan.
        password:
          type:
          - string
          - 'null'
          format: password
          writeOnly: true
          description: Basic-auth password when password protected. Never returned.
            Requires advanced status pages and password protection on the plan.
        features:
          type:
          - object
          - 'null'
          description: 'Presentation copy and styling. Replaces the whole object;
            null clears it. Requires advanced status pages; refused with 403 `feature_unavailable`
            otherwise.

            '
          additionalProperties: false
          properties:
            home_link:
              type: string
            up_caption:
              type: string
            down_caption:
              type: string
            mixed_caption:
              type: string
            custom_css:
              type: string
        sites:
          type:
          - array
          - 'null'
          description: 'Sites listed on the page, in page order, replacing the current
            list. null or [] removes every site.

            '
          items:
            type: object
            required:
            - site_id
            properties:
              site_id:
                type: string
                format: uuid
                description: Identifier of a site on this account
              display_name:
                type:
                - string
                - 'null'
                minLength: 1
                description: null uses the monitor's own name; "" is refused.
              description:
                type:
                - string
                - 'null'
                minLength: 1
                maxLength: 80
                description: null shows no description; "" is refused.
        check_ins:
          type:
          - array
          - 'null'
          description: 'Check-ins listed on the page, in page order, replacing the
            current list. null or [] removes every check-in.

            '
          items:
            type: object
            required:
            - check_in_id
            properties:
              check_in_id:
                type: string
                description: ID of a check-in on this account
              display_name:
                type:
                - string
                - 'null'
                minLength: 1
                description: null uses the monitor's own name; "" is refused.
              description:
                type:
                - string
                - 'null'
                minLength: 1
                maxLength: 80
                description: null shows no description; "" is refused.
    Stream:
      type: object
      description: An Insights event stream
      properties:
        id:
          type: string
          description: 'Stream identifier: 12 lowercase hex characters. Randomly assigned
            rather than sequential, so unlike other v3 resources this is not a public
            ID — it is the stream''s own identifier, and the value to pass as `stream_ids`
            when querying.

