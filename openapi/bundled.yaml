    IntegrationUpdateInput:
      type: object
      description: 'Fields to change on an integration. Omitted fields are left as
        they are. `type` can be sent only with its current value; any other value
        is 422. A key this operation doesn''t take is 422, except the read-only keys
        a GET returns (`id`, `links` and the like), which are ignored. Type-specific
        settings go under `config`, in the shape a GET returns, so a fetched integration
        can be edited and sent back. Each type''s settings are listed in [Integration
        types](https://docs.honeybadger.io/api/v3/integrations/types/).

        '
      properties:
        active:
          type: boolean
        events:
          type:
          - array
          - 'null'
          description: 'Events this integration notifies on. On create, defaults to
            the type''s default events. An event the type doesn''t support is refused
            with 422. Send null to reset to the type''s defaults. A set; order is
            ignored and duplicates are dropped. `up` and `down` need uptime monitoring,
            `rate_exceeded` escalation, and `volume_spike` anomaly detection; adding
            one on a plan without it is 403 feature_unavailable, and defaults leave
            them out on those plans.

            '
          items:
            "$ref": "#/components/schemas/IntegrationEvent"
        rate:
          type:
          - string
          - 'null'
          default: wday
          description: Rate threshold period (e.g. min, hour). Send null to reset
            to wday.
        threshold:
          type:
          - integer
          - 'null'
          default: 100
          description: Number of occurrences before rate_exceeded fires. Send null
            to reset to 100.
        notification_limit:
          type:
          - integer
          - 'null'
          description: Maximum notifications in a 10-minute window before flood control.
            Send null to remove the limit.
        all_sites:
          type: boolean
          default: false
          description: 'Follow every site in the project, including ones added later.
            When true, site_ids must be empty or left out, and reads return []. Sending
            a non-empty site_ids turns it off. With it off and site_ids empty, the
            integration gets no up or down events.

            '
        all_check_ins:
          type: boolean
          default: false
          description: 'Follow every check-in in the project, including ones added
            later. When true, check_in_ids must be empty or left out, and reads return
            []. Sending a non-empty check_in_ids turns it off. With it off and check_in_ids
            empty, the integration gets no check-in events.

            '
        site_ids:
          type:
          - array
          - 'null'
          description: 'Specific sites whose up and down events this integration receives.
            An empty list turns site notifications off unless all_sites is true; a
            non-empty list with all_sites: true is 422. An ID that isn''t one of this
            project''s sites fails the request with 422. Send null or [] to clear.
            A set; order is ignored and duplicates are dropped.

            '
          items:
            type: string
            format: uuid
        check_in_ids:
          type:
          - array
          - 'null'
          description: 'Specific check-ins whose events this integration receives.
            An empty list turns check-in notifications off unless all_check_ins is
            true; a non-empty list with all_check_ins: true is 422. An ID that isn''t
            one of this project''s check-ins fails the request with 422. Send null
            or [] to clear. A set; order is ignored and duplicates are dropped.

            '
          items:
            type: string
        alarm_alert_ids:
          type:
          - array
          - 'null'
          description: IDs of alarms whose alert events this integration receives.
            Send null or [] to clear. A set; order is ignored and duplicates are dropped.
          items:
            type: string
        alarm_ok_ids:
          type:
          - array
          - 'null'
          description: IDs of alarms whose recovery events this integration receives.
            Send null or [] to clear. A set; order is ignored and duplicates are dropped.
          items:
            type: string
        excluded_environments:
          type:
          - array
          - 'null'
          description: 'Errors from these environments never notify through this integration.
            Takes precedence over included_environments. Names are stored as given,
            so an environment can be excluded before it first reports. Send null or
            [] to clear. Applies only on plans with environment settings; changing
            it on other plans is 403 feature_unavailable. Reads return what''s stored.
            A set; order is ignored and duplicates are dropped.

            '
          items:
            type: string
        included_environments:
          type:
          - array
          - 'null'
          description: 'When non-empty, only errors from these environments notify
            through this integration, including environments that haven''t reported
            yet. Empty means every environment not excluded. Send null or [] to clear.
            Applies only on plans with environment settings; changing it on other
            plans is 403 feature_unavailable. Reads return what''s stored. A set;
            order is ignored and duplicates are dropped.

            '
          items:
            type: string
        filters:
          type:
          - array
          - 'null'
          description: 'An ordered list. Each event that has a filter notifies only
            for errors matching its query. Replaces the stored filters; send [] or
            null to clear. Applies only on plans with integration filters; changing
            it on other plans is 403 feature_unavailable. Reads return what''s stored.

            '
          items:
            "$ref": "#/components/schemas/IntegrationFilter"
        config:
          type: object
          additionalProperties: true
          description: 'Type-specific settings, the same keys a GET returns under
            `config`, listed per type in [Integration types](https://docs.honeybadger.io/api/v3/integrations/types/).
            Merged into the stored settings: a key left out keeps its value; a key
            sent as null is cleared, or reset to its default. Secrets are never returned;
            leave them out to keep them. A key the type doesn''t have, or a value
            with leading or trailing whitespace on a setting that doesn''t allow it,
            is 422. Sending a setting outside `config` is refused with 422.

            '
    IntegrationCreateInput:
