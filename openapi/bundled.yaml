  "/projects/{project_id}/check_ins/bulk_update":
    put:
      operationId: replaceCheckIns
      summary: Replace the project's check-ins
      description: |
        Replaces the project's check-ins with the ones supplied. Each is matched to an existing check-in by `slug`: a matching check-in is updated, a new slug creates one, and any existing check-in that isn't supplied is deleted. The response lists what happened to each slug.

        If any create, update or delete fails, nothing changes, and `error.details` has an entry for each failed slug (field `check_ins.<slug>`). A cron entry needs cron on the plan.
      tags:
      - Check-ins
      parameters:
      - "$ref": "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CheckInReplaceInput"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - operation
                      - slug
                      - success
                      properties:
                        operation:
                          type: string
                          enum:
                          - create
                          - update
                          - delete
                        slug:
                          type: string
                          example: nightly-backup
                        success:
                          type: boolean
                          const: true
                          description: Always true; any failure makes the whole request
                            a 422 and changes nothing.
                  meta:
                    "$ref": "#/components/schemas/ResponseMeta"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
      security:
      - bearer_auth:
        - checkins:write
