          type: string
          description: ID of the project this deploy belongs to
          example: Xk9mZp
        environment:
          type:
          - string
          - 'null'
          description: Deploy environment; null when the deploy named none
          example: production
        revision:
          type:
          - string
          - 'null'
          description: Source control revision
          example: a1b2c3d4
        repository:
          type:
          - string
          - 'null'
          description: Source control repository
          example: acme/app
        local_username:
          type:
          - string
          - 'null'
