    IntegrationConfigBacklog:
      type: object
      title: Backlog settings
      additionalProperties: false
      properties:
        space_url:
          type:
          - string
          - 'null'
          title: Space URL
          description: Your Backlog space URL (e.g., https://example.backlog.com or
            https://example.backlog.jp).
          example: https://example.backlog.com
        api_key:
          type:
          - string
          - 'null'
          format: password
          title: API Key
          description: Your Backlog API key (generate one in Personal Settings > API).
            Never returned. Leave it out of an update to keep it.
          example: AbCdEf0123456789AbCdEf0123456789AbCdEf0123456789AbCdEf0123456789
          writeOnly: true
        backlog_project_id:
          type:
          - string
          - 'null'
          title: Project
          description: The Backlog project to create issues in. The value that service's
            API uses for it, usually an ID.
          example: '123456'
        issue_type_id:
          type:
          - string
          - 'null'
          title: Issue Type
          description: The type of issue to create. The value that service's API uses
            for it, usually an ID.
          example: '1074711'
        priority_id:
          type:
          - string
          - 'null'
          title: Priority
          description: The priority level for new issues. The value that service's
            API uses for it, usually an ID.
          example: '3'
        resolve_status_id:
          type:
          - string
          - 'null'
          title: Closed Status
