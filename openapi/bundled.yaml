openapi: 3.1.0
info:
  title: Honeybadger API
  description: |
    The Honeybadger API v3 provides programmatic access to your Honeybadger data.

    ## Authentication

    Every request authenticates with a Bearer token:

    ```
    Authorization: Bearer YOUR_API_TOKEN
    ```

    Bearer is the only accepted scheme. Two things that work on v2 are refused
    here, each with its own error code so the cause is unambiguous:

    - HTTP basic — the token as the username with a blank password, which is what
      `curl -u` sends — answers `401 unsupported_auth_scheme`.
    - A credential in the `auth_token` query parameter answers
      `401 credential_in_query`, even when the credential is valid: a secret in a
      URL leaks through access logs, proxies, Referer headers and anything a
      person copy-pastes.

    You can find your API token in your Honeybadger user settings.

    ## Request bodies

    Send the resource's fields at the top level of the body. There is no root
    element:

    ```json
    {"name": "Billing API", "language": "ruby"}
    ```

    v1 and v2 wrapped bodies under the resource name (`{"project": {...}}`).
    v3 does not, anywhere.

    ## Rate Limiting

    API requests are rate limited to 360 requests per hour per user. Rate limit information
    is returned in response headers:

    - `X-RateLimit-Limit`: Maximum requests per hour
    - `X-RateLimit-Remaining`: Remaining requests in current window
    - `X-RateLimit-Reset`: Unix timestamp when the limit resets

    ## Pagination

    ### Offset-based Pagination

    Most list endpoints use offset-based pagination with the following parameters:
    - `page`: Page number (default: 1)
    - `per_page`: Items per page (default: 25, max: 100)

    ### Time-series Pagination

    Time-ordered collections (notices, comments, deploys, outages, uptime checks,
    check-in events, incidents) are not paged by number, because new items arrive
    at one end while you read. They return `limit`, `has_older` and `has_newer`.

    **Follow the links.** `links.older` and `links.newer` are the mechanism that
    works on every one of these collections, and a client that follows them needs
    to know nothing else. Both are null when there is nothing further in that
    direction.

    Five of these collections also return `oldest_cursor` and `newest_cursor`,
    opaque tokens you can pass back as `before` and `after`. Use them when a
    client needs to persist its position without storing a whole URL.

    The other three — outages, uptime checks and check-in events — are paged on a
    timestamp window instead, with `created_after` and `created_before`, and
    return no cursor fields. Uptime checks have no primary key to tie-break on;
    outages keep the v2 API's window parameters so a client can move between
    versions unchanged. Treat the cursors as an optimisation, not the contract.

    A few collections are one-directional and say so in their description: they
    always report `has_newer: false` with a null `links.newer`.

    ## Response Format

    All responses follow a consistent envelope structure:

    ```json
    {
      "data": { ... },
      "meta": { "request_id": "..." }
    }
    ```

    For collections:

    ```json
    {
      "data": [ ... ],
      "pagination": { ... },
      "links": { ... },
      "meta": { "request_id": "..." }
    }
    ```
