overlay: 1.0.0
info:
  title: Go-specific mappings for api-go
  version: 0.0.1
actions:
  # The bundle types error.details as an array of {field, message}, but the
  # InsufficientScope response sends an object ({required_scope, token_scopes}).
  # Generated code follows the schema, so a real 403 fails to decode outright.
  #
  # Retyping it as json.RawMessage lets both shapes through; apiv3 decides which
  # one it got (see parseError). This is a Go-side workaround for a spec bug, so
  # it belongs here rather than in the producer spec — and it disappears the day
  # the spec settles on one shape.
  #
  # No x-go-type-import here on purpose: the generator does not deduplicate it
  # against imports it already emits, and generated code always imports
  # encoding/json for marshalling, so naming the import produces a duplicate
  # and a compile error.
  - target: $.components.schemas.Error.properties.error.properties.details
    update:
      x-go-type: json.RawMessage
