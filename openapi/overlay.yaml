overlay: 1.0.0
info:
  title: Go-specific mappings for api-go
  version: 0.0.1
actions:
  # The details field is a oneOf: an array of field errors for validation_error,
  # or an object naming the missing permission for insufficient_scope.
  #
  # The target moved when the spec extracted the error body into a named ErrorBody
  # schema. The overlay is applied in strict mode, so a stale selector fails
  # generation rather than quietly doing nothing — which is how this was caught.
  #
  # oapi-codegen renders a oneOf as a union wrapper with As*/From* accessors,
  # which would put generator-shaped machinery in the public error type for no
  # gain — apiv3 already discriminates on the error code and decodes the branch
  # it expects. Retyping it as json.RawMessage keeps that decision in one place.
  #
  # No x-go-type-import: the generator does not deduplicate it against imports it
  # already emits, and generated code always imports encoding/json, so naming the
  # import produces a duplicate and a compile error.
  - target: $.components.schemas.ErrorBody.properties.details
    update:
      x-go-type: json.RawMessage

  # Dashboard.widgets.items points at DashboardInput/properties/widgets/items — a
  # JSON Pointer into another schema's properties rather than a $ref to a named
  # component. That is legal OpenAPI, and it says something true (the read and
  # write forms of a widget are identical), but oapi-codegen cannot follow it:
  #
  #   unexpected reference depth: 7 for ref:
  #   #/components/schemas/DashboardInput/properties/widgets/items
  #
  # Two actions rather than one: Overlay's update merges, so setting items on the
  # widgets node would leave the $ref sitting beside the new type and resolvers
  # prefer the $ref. Removing the node first is what makes the replacement stick.
  #
  # A plain object is what this generated before the spec added the pointer, and
  # apiv3 hands widgets through as raw JSON in both directions anyway — the
  # authority on their shape is the app's dashboard_schema.json, not this type.
  - target: $.components.schemas.Dashboard.properties.widgets.items
    remove: true
  - target: $.components.schemas.Dashboard.properties.widgets
    update:
      items:
        type: object
